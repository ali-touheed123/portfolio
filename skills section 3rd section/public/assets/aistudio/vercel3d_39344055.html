<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Vercel — 3D Interactive Model</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #ffffff;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: grab;
      outline: none;
    }
    canvas:active { cursor: grabbing; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // 1. RENDERER, SCENE & CAMERA
    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      alpha: true,
      powerPreference: 'high-performance'
    });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.06;
    renderer.setClearColor(0xffffff, 0);
    document.body.appendChild(renderer.domElement);

    const scene = new THREE.Scene();

    const INITIAL_CAM_POS = new THREE.Vector3(0, 0, 4.15);
    const INITIAL_TARGET = new THREE.Vector3(0, 0, 0);

    const camera = new THREE.PerspectiveCamera(36, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.copy(INITIAL_CAM_POS);

    // 2. PROCEDURAL 360° STUDIO ENVIRONMENT (PMREM) & NEUTRAL MONOCHROME LIGHTING
    function createStudioEnv(glRenderer) {
      const pmrem = new THREE.PMREMGenerator(glRenderer);
      pmrem.compileEquirectangularShader();
      const envScene = new THREE.Scene();
      envScene.background = new THREE.Color(0x14171c);

      const addPanel = (w, h, color, intensity, pos) => {
        const geo = new THREE.PlaneGeometry(w, h);
        const mat = new THREE.MeshBasicMaterial({
          color: new THREE.Color(color).multiplyScalar(intensity),
          side: THREE.DoubleSide
        });
        const mesh = new THREE.Mesh(geo, mat);
        mesh.position.set(...pos);
        mesh.lookAt(0, 0, 0);
        envScene.add(mesh);
      };

      addPanel(10, 5, 0xffffff, 2.2, [0, 3.6, 8]);
      addPanel(10, 5, 0xcad2de, 1.3, [0, -3.6, 8]);
      addPanel(10, 5, 0xffffff, 2.2, [0, 3.6, -8]);
      addPanel(10, 5, 0xcad2de, 1.3, [0, -3.6, -8]);
      addPanel(12, 6, 0xf5f7fa, 2.1, [0, 8.5, 0]);
      addPanel(12, 6, 0x9aa3b0, 1.0, [0, -8.5, 0]);
      addPanel(6, 8, 0xe2e7ef, 1.5, [9, 0.5, 0]);
      addPanel(6, 8, 0xe2e7ef, 1.5, [-9, 0.5, 0]);

      const rt = pmrem.fromScene(envScene, 0.04);
      pmrem.dispose();
      return rt.texture;
    }

    scene.environment = createStudioEnv(renderer);
    scene.add(new THREE.AmbientLight(0xf4f6f9, 0.9));

    const addDirLight = (color, intensity, pos) => {
      const l = new THREE.DirectionalLight(color, intensity);
      l.position.set(...pos);
      scene.add(l);
    };
    addDirLight(0xffffff, 1.35, [2.5, 3.5, 5.5]);
    addDirLight(0xd6deea, 0.65, [-3.5, -2.0, 4.5]);
    addDirLight(0xffffff, 1.35, [-2.5, 3.5, -5.5]);
    addDirLight(0xd6deea, 0.65, [3.5, -2.0, -4.5]);

    // 3. EXACT BADGE DIMENSIONS & GEOMETRY HELPERS
    const OUTER_W = 2.54;
    const OUTER_H = 1.06;
    const OUTER_R = 0.36;
    const BODY_DEPTH = 0.11;
    const BEVEL_THICKNESS = 0.044;
    const BEVEL_SIZE = 0.034;
    const OUTER_HALF_Z = BODY_DEPTH / 2 + BEVEL_THICKNESS;

    const INNER_W = 2.45;
    const INNER_H = 0.97;
    const INNER_R = 0.33;
    const INNER_DEPTH = 0.008;
    const INNER_BEVEL_T = 0.006;
    const INNER_BEVEL_S = 0.006;
    const INNER_FRONT_Z = OUTER_HALF_Z - 0.002 + INNER_DEPTH + INNER_BEVEL_T;

    function createRoundedRectShape(w, h, r) {
      const hw = w / 2;
      const hh = h / 2;
      const rad = Math.min(r, hw, hh);
      const s = new THREE.Shape();
      s.moveTo(-hw + rad, -hh);
      s.lineTo(hw - rad, -hh);
      s.absarc(hw - rad, -hh + rad, rad, -Math.PI / 2, 0, false);
      s.lineTo(hw, hh - rad);
      s.absarc(hw - rad, hh - rad, rad, 0, Math.PI / 2, false);
      s.lineTo(-hw + rad, hh);
      s.absarc(-hw + rad, hh - rad, rad, Math.PI / 2, Math.PI, false);
      s.lineTo(-hw, -hh + rad);
      s.absarc(-hw + rad, -hh + rad, rad, Math.PI, Math.PI * 1.5, false);
      return s;
    }

    function strokeRoundedRectCanvas(ctx, x, y, w, h, r) {
      const rad = Math.min(r, w / 2, h / 2);
      ctx.beginPath();
      ctx.moveTo(x + rad, y);
      ctx.lineTo(x + w - rad, y);
      ctx.arcTo(x + w, y, x + w, y + rad, rad);
      ctx.lineTo(x + w, y + h - rad);
      ctx.arcTo(x + w, y + h, x + w - rad, y + h, rad);
      ctx.lineTo(x + rad, y + h);
      ctx.arcTo(x, y + h, x, y + h - rad, rad);
      ctx.lineTo(x, y + rad);
      ctx.arcTo(x, y, x + rad, y, rad);
      ctx.closePath();
    }

    // 4. HIGH-DPI PROCEDURAL TEXTURES (SUPERSAMPLED, SAFARI-SAFE)
    const maxAniso = renderer.capabilities.getMaxAnisotropy();

    function createDarkCharcoalTexture() {
      const W = 2450;
      const H = 970;
      const canvas = document.createElement('canvas');
      canvas.width = W;
      canvas.height = H;
      const ctx = canvas.getContext('2d');

      // Smooth Vercel dark slate-to-obsidian vertical gradient
      const bg = ctx.createLinearGradient(0, 0, 0, H);
      bg.addColorStop(0.0, '#22262c');
      bg.addColorStop(0.42, '#15181c');
      bg.addColorStop(0.82, '#0a0b0d');
      bg.addColorStop(1.0, '#060708');
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, W, H);

      // Subtle studio sheen across center-top
      const sheen = ctx.createRadialGradient(W * 0.45, H * 0.18, 40, W * 0.5, H * 0.45, W * 0.62);
      sheen.addColorStop(0, 'rgba(255, 255, 255, 0.045)');
      sheen.addColorStop(0.55, 'rgba(255, 255, 255, 0.012)');
      sheen.addColorStop(1, 'rgba(0, 0, 0, 0.22)');
      ctx.fillStyle = sheen;
      ctx.fillRect(0, 0, W, H);

      const tex = new THREE.CanvasTexture(canvas);
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.anisotropy = maxAniso;
      return tex;
    }

    // Triangle dimensions (equilateral, matching Vercel mark)
    const TRI_H = 0.415;
    const TRI_W = TRI_H / (Math.sqrt(3) / 2); // ~0.4792
    const GAP_X = 0.175;

    function createTypographyLayerTextures() {
      const W = 2450;
      const H = 970;
      const pxPerUnit = W / INNER_W; // 1000 px per 3D unit

      const canvas = document.createElement('canvas');
      canvas.width = W;
      canvas.height = H;
      const ctx = canvas.getContext('2d');

      const bumpCanvas = document.createElement('canvas');
      bumpCanvas.width = W;
      bumpCanvas.height = H;
      const bCtx = bumpCanvas.getContext('2d');

      ctx.clearRect(0, 0, W, H);
      bCtx.fillStyle = '#000000';
      bCtx.fillRect(0, 0, W, H);

      const text = 'Vercel';
      const fontFamily = '"Inter", "SF Pro Display", "Segoe UI", "Roboto", "Helvetica Neue", Arial, sans-serif';
      const fontSize = Math.round(H * 0.435);
      const fontSpec = `600 ${fontSize}px ${fontFamily}`;

      ctx.font = fontSpec;
      ctx.textAlign = 'left';
      ctx.textBaseline = 'alphabetic';

      const textMetrics = ctx.measureText(text);
      const textWUnits = textMetrics.width / pxPerUnit;
      const totalLockupW = TRI_W + GAP_X + textWUnits;

      // Center [Triangle + Gap + Vercel] horizontally on the dark pill
      const lockupStartX = -totalLockupW / 2;
      const triCenterX = lockupStartX + TRI_W / 2;
      const textStartXUnits = lockupStartX + TRI_W + GAP_X;

      const textX = (0.5 + textStartXUnits / INNER_W) * W;

      // Center cap-height vertically
      const capMetrics = ctx.measureText('Vl');
      const capAscent = capMetrics.actualBoundingBoxAscent || fontSize * 0.72;
      const textY = H / 2 + capAscent / 2;

      ctx.save();
      ctx.shadowColor = 'rgba(255, 255, 255, 0.22)';
      ctx.shadowBlur = 10;
      ctx.fillStyle = '#FFFFFF';
      ctx.fillText(text, textX, textY);
      ctx.restore();

      ctx.save();
      ctx.fillStyle = '#FFFFFF';
      ctx.fillText(text, textX, textY);
      ctx.restore();

      bCtx.font = fontSpec;
      bCtx.textAlign = 'left';
      bCtx.textBaseline = 'alphabetic';
      bCtx.shadowColor = 'rgba(210, 210, 210, 0.85)';
      bCtx.shadowBlur = 5;
      bCtx.fillStyle = '#ffffff';
      bCtx.fillText(text, textX, textY);

      const mapTex = new THREE.CanvasTexture(canvas);
      mapTex.colorSpace = THREE.SRGBColorSpace;
      mapTex.anisotropy = maxAniso;

      const bumpTex = new THREE.CanvasTexture(bumpCanvas);
      bumpTex.anisotropy = maxAniso;

      return { mapTex, bumpTex, triCenterX };
    }

    function createShadowHaloTexture() {
      const W = 2048;
      const H = 1024;
      const canvas = document.createElement('canvas');
      canvas.width = W;
      canvas.height = H;
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, W, H);

      const rectW = W * 0.56;
      const rectH = H * 0.48;
      const rectX = (W - rectW) / 2;
      const rectY = (H - rectH) / 2 + H * 0.015;
      const rPx = (OUTER_R / OUTER_H) * rectH;

      const passes = [
        { blur: 110, alpha: 0.12, fill: 'rgba(15, 20, 30, 0.14)' },
        { blur: 64,  alpha: 0.16, fill: 'rgba(15, 20, 30, 0.18)' },
        { blur: 32,  alpha: 0.20, fill: 'rgba(15, 20, 30, 0.22)' },
        { blur: 14,  alpha: 0.24, fill: 'rgba(15, 20, 30, 0.24)' }
      ];

      passes.forEach((p) => {
        ctx.save();
        strokeRoundedRectCanvas(ctx, rectX, rectY, rectW, rectH, rPx);
        ctx.shadowColor = `rgba(10, 14, 22, ${p.alpha})`;
        ctx.shadowBlur = p.blur;
        ctx.fillStyle = p.fill;
        ctx.fill();
        ctx.restore();
      });

      const tex = new THREE.CanvasTexture(canvas);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    function createBillboardAuraTexture() {
      const S = 1024;
      const canvas = document.createElement('canvas');
      canvas.width = S;
      canvas.height = S;
      const ctx = canvas.getContext('2d');

      ctx.save();
      ctx.translate(S / 2, S / 2 + S * 0.03);
      ctx.scale(1.0, 0.56);
      const grad = ctx.createRadialGradient(0, 0, S * 0.12, 0, 0, S * 0.46);
      grad.addColorStop(0, 'rgba(15, 20, 30, 0.16)');
      grad.addColorStop(0.5, 'rgba(15, 20, 30, 0.07)');
      grad.addColorStop(0.8, 'rgba(15, 20, 30, 0.02)');
      grad.addColorStop(1, 'rgba(15, 20, 30, 0.0)');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(0, 0, S * 0.46, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      const tex = new THREE.CanvasTexture(canvas);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    // 5. BUILD PHYSICAL 3D DOUBLE-SIDED VERCEL MODEL
    const badgeRoot = new THREE.Group();
    scene.add(badgeRoot);

    const darkCharcoalTex = createDarkCharcoalTexture();
    const { mapTex: typoColorTex, bumpTex: typoBumpTex, triCenterX } = createTypographyLayerTextures();

    // 5A. Outer White Beveled Pill Body
    const outerBodyShape = createRoundedRectShape(OUTER_W, OUTER_H, OUTER_R);
    const outerBodyGeo = new THREE.ExtrudeGeometry(outerBodyShape, {
      depth: BODY_DEPTH,
      bevelEnabled: true,
      bevelThickness: BEVEL_THICKNESS,
      bevelSize: BEVEL_SIZE,
      bevelSegments: 14,
      curveSegments: 56
    });
    outerBodyGeo.center();

    const whiteFrameMat = new THREE.MeshPhysicalMaterial({
      color: 0xffffff,
      emissive: 0xedf1f7,
      emissiveIntensity: 0.24,
      roughness: 0.18,
      metalness: 0.03,
      clearcoat: 1.0,
      clearcoatRoughness: 0.05,
      ior: 1.48,
      reflectivity: 0.9,
      envMapIntensity: 1.1
    });

    badgeRoot.add(new THREE.Mesh(outerBodyGeo, whiteFrameMat));

    // 5B. Inner Dark Charcoal Pill Plates (Front & Back)
    const innerPlateShape = createRoundedRectShape(INNER_W, INNER_H, INNER_R);
    const innerPlateGeo = new THREE.ExtrudeGeometry(innerPlateShape, {
      depth: INNER_DEPTH,
      bevelEnabled: true,
      bevelThickness: INNER_BEVEL_T,
      bevelSize: INNER_BEVEL_S,
      bevelSegments: 8,
      curveSegments: 52
    });

    {
      const pos = innerPlateGeo.attributes.position;
      const uv = innerPlateGeo.attributes.uv;
      const totalW = INNER_W + INNER_BEVEL_S * 2;
      const totalH = INNER_H + INNER_BEVEL_S * 2;
      for (let i = 0; i < pos.count; i++) {
        uv.setXY(i, (pos.getX(i) / totalW) + 0.5, (pos.getY(i) / totalH) + 0.5);
      }
      uv.needsUpdate = true;
    }

    const darkBodyMat = new THREE.MeshPhysicalMaterial({
      map: darkCharcoalTex,
      color: 0xffffff,
      roughness: 0.22,
      metalness: 0.1,
      clearcoat: 0.92,
      clearcoatRoughness: 0.08,
      ior: 1.5,
      reflectivity: 0.85,
      envMapIntensity: 1.15
    });

    // 5C. Typography Face Plate & 3D Extruded Vercel Triangle
    const typoPlateShape = createRoundedRectShape(INNER_W - 0.02, INNER_H - 0.02, INNER_R - 0.01);
    const typoPlateGeo = new THREE.ShapeGeometry(typoPlateShape, 48);
    {
      const pos = typoPlateGeo.attributes.position;
      const uv = typoPlateGeo.attributes.uv;
      for (let i = 0; i < pos.count; i++) {
        uv.setXY(i, (pos.getX(i) / INNER_W) + 0.5, (pos.getY(i) / INNER_H) + 0.5);
      }
      uv.needsUpdate = true;
    }

    const typoMaterial = new THREE.MeshPhysicalMaterial({
      map: typoColorTex,
      bumpMap: typoBumpTex,
      bumpScale: 0.007,
      emissive: 0xffffff,
      emissiveMap: typoColorTex,
      emissiveIntensity: 0.45,
      transparent: true,
      alphaTest: 0.01,
      roughness: 0.14,
      metalness: 0.02,
      clearcoat: 1.0,
      clearcoatRoughness: 0.05,
      depthWrite: false
    });

    // 3D Vercel Triangle Geometry
    const triShape = new THREE.Shape();
    triShape.moveTo(0, TRI_H / 2);
    triShape.lineTo(-TRI_W / 2, -TRI_H / 2);
    triShape.lineTo(TRI_W / 2, -TRI_H / 2);
    triShape.closePath();

    const triGeo = new THREE.ExtrudeGeometry(triShape, {
      depth: 0.012,
      bevelEnabled: true,
      bevelThickness: 0.003,
      bevelSize: 0.0025,
      bevelSegments: 4
    });

    const triWhiteMat = new THREE.MeshPhysicalMaterial({
      color: 0xffffff,
      emissive: 0xffffff,
      emissiveIntensity: 0.36,
      roughness: 0.14,
      metalness: 0.03,
      clearcoat: 1.0,
      clearcoatRoughness: 0.04,
      envMapIntensity: 1.15
    });

    function createFaceDetailGroup() {
      const group = new THREE.Group();

      const darkPlateMesh = new THREE.Mesh(innerPlateGeo, darkBodyMat);
      darkPlateMesh.position.z = OUTER_HALF_Z - 0.002;
      group.add(darkPlateMesh);

      const typoMesh = new THREE.Mesh(typoPlateGeo, typoMaterial);
      typoMesh.position.z = INNER_FRONT_Z + 0.0025;
      group.add(typoMesh);

      const triMesh = new THREE.Mesh(triGeo, triWhiteMat);
      triMesh.position.set(triCenterX, 0.0, INNER_FRONT_Z - 0.001);
      group.add(triMesh);

      return group;
    }

    badgeRoot.add(createFaceDetailGroup());

    const backFace = createFaceDetailGroup();
    backFace.rotation.y = Math.PI;
    badgeRoot.add(backFace);

    // 5D. Soft Neutral Drop Shadow on Pure #FFFFFF Background
    const haloMat = new THREE.MeshBasicMaterial({
      map: createShadowHaloTexture(),
      transparent: true,
      opacity: 0.9,
      depthWrite: false,
      side: THREE.DoubleSide
    });
    const haloMesh = new THREE.Mesh(new THREE.PlaneGeometry(4.65, 2.32), haloMat);
    haloMesh.position.z = -0.02;
    haloMesh.renderOrder = -2;
    badgeRoot.add(haloMesh);

    const auraMat = new THREE.SpriteMaterial({
      map: createBillboardAuraTexture(),
      transparent: true,
      opacity: 0.45,
      depthWrite: false
    });
    const auraSprite = new THREE.Sprite(auraMat);
    auraSprite.scale.set(4.1, 4.1, 1);
    auraSprite.renderOrder = -3;
    scene.add(auraSprite);

    // 6. 360° ORBIT CONTROLS, IDLE FLOAT, HOVER MICRO-TILT & DOUBLE-CLICK RESET
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.copy(INITIAL_TARGET);
    controls.enableDamping = true;
    controls.dampingFactor = 0.065;
    controls.enablePan = false;
    controls.rotateSpeed = 0.85;
    controls.zoomSpeed = 0.9;
    controls.minDistance = 1.9;
    controls.maxDistance = 8.0;
    controls.update();

    let isDragging = false;
    let isPointerInside = false;
    let pointerNX = 0;
    let pointerNY = 0;
    let isResetting = false;

    const resetStartCam = new THREE.Vector3();
    const resetStartTarget = new THREE.Vector3();
    let resetProgress = 0;

    controls.addEventListener('start', () => {
      isDragging = true;
      isResetting = false;
    });
    controls.addEventListener('end', () => {
      isDragging = false;
    });

    const domEl = renderer.domElement;
    domEl.addEventListener('pointermove', (e) => {
      isPointerInside = true;
      pointerNX = (e.clientX / window.innerWidth) * 2 - 1;
      pointerNY = (e.clientY / window.innerHeight) * 2 - 1;
    });
    domEl.addEventListener('pointerleave', () => {
      isPointerInside = false;
      pointerNX = 0;
      pointerNY = 0;
    });
    domEl.addEventListener('dblclick', () => {
      resetStartCam.copy(camera.position);
      resetStartTarget.copy(controls.target);
      resetProgress = 0;
      isResetting = true;
    });

    // 7. RESIZE & ANIMATION LOOP
    window.addEventListener('resize', () => {
      const w = window.innerWidth;
      const h = window.innerHeight;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    });

    const clock = new THREE.Clock();
    const viewDir = new THREE.Vector3();

    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), 0.05);
      const elapsed = clock.elapsedTime;

      if (isResetting) {
        resetProgress = Math.min(resetProgress + dt * 2.4, 1);
        const ease = 1 - Math.pow(1 - resetProgress, 3);
        camera.position.lerpVectors(resetStartCam, INITIAL_CAM_POS, ease);
        controls.target.lerpVectors(resetStartTarget, INITIAL_TARGET, ease);
        if (resetProgress >= 1) isResetting = false;
      }

      const idleFloatY = Math.sin(elapsed * 1.45) * 0.022;
      const idleRotX = Math.sin(elapsed * 0.95) * 0.012;
      const idleRotY = Math.cos(elapsed * 0.75) * 0.015;

      const targetTiltY = (!isDragging && isPointerInside) ? pointerNX * 0.085 : 0;
      const targetTiltX = (!isDragging && isPointerInside) ? pointerNY * 0.065 : 0;

      badgeRoot.position.y = THREE.MathUtils.lerp(badgeRoot.position.y, idleFloatY, 0.08);
      badgeRoot.rotation.x = THREE.MathUtils.lerp(badgeRoot.rotation.x, targetTiltX + idleRotX, 0.07);
      badgeRoot.rotation.y = THREE.MathUtils.lerp(badgeRoot.rotation.y, targetTiltY + idleRotY, 0.07);

      auraSprite.position.y = badgeRoot.position.y;
      viewDir.subVectors(camera.position, controls.target).normalize();
      const edgeFactor = 1.0 - Math.abs(viewDir.z);
      haloMat.opacity = 0.9 * (1.0 - edgeFactor * 0.7);
      auraMat.opacity = 0.35 + edgeFactor * 0.22;

      controls.update();
      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>

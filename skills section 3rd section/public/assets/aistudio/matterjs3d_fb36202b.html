<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Matter.js — 3D Interactive Model</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #ffffff;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: grab;
      outline: none;
    }
    canvas:active { cursor: grabbing; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // 1. RENDERER, SCENE & CAMERA
    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      alpha: true,
      powerPreference: 'high-performance'
    });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.08;
    renderer.setClearColor(0xffffff, 0);
    document.body.appendChild(renderer.domElement);

    const scene = new THREE.Scene();

    const INITIAL_CAM_POS = new THREE.Vector3(0, 0, 4.25);
    const INITIAL_TARGET = new THREE.Vector3(0, 0, 0);

    const camera = new THREE.PerspectiveCamera(36, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.copy(INITIAL_CAM_POS);

    // 2. PROCEDURAL 360° STUDIO ENVIRONMENT (PMREM) & BALANCED LIGHTING
    function createStudioEnv(glRenderer) {
      const pmrem = new THREE.PMREMGenerator(glRenderer);
      pmrem.compileEquirectangularShader();
      const envScene = new THREE.Scene();
      envScene.background = new THREE.Color(0x071f0c);

      const addPanel = (w, h, color, intensity, pos) => {
        const geo = new THREE.PlaneGeometry(w, h);
        const mat = new THREE.MeshBasicMaterial({
          color: new THREE.Color(color).multiplyScalar(intensity),
          side: THREE.DoubleSide
        });
        const mesh = new THREE.Mesh(geo, mat);
        mesh.position.set(...pos);
        mesh.lookAt(0, 0, 0);
        envScene.add(mesh);
      };

      addPanel(10, 5, 0xffffff, 2.2, [0, 3.2, 8]);
      addPanel(10, 5, 0xccffd8, 1.4, [0, -3.5, 8]);
      addPanel(10, 5, 0xffffff, 2.2, [0, 3.2, -8]);
      addPanel(10, 5, 0xccffd8, 1.4, [0, -3.5, -8]);
      addPanel(12, 6, 0xe8ffec, 2.0, [0, 8.5, 0]);
      addPanel(12, 6, 0x8bff9f, 1.1, [0, -8.5, 0]);
      addPanel(6, 8, 0xb8ffc4, 1.6, [9, 0.5, 0]);
      addPanel(6, 8, 0xb8ffc4, 1.6, [-9, 0.5, 0]);

      const rt = pmrem.fromScene(envScene, 0.04);
      pmrem.dispose();
      return rt.texture;
    }

    scene.environment = createStudioEnv(renderer);
    scene.add(new THREE.AmbientLight(0xdfffe4, 0.85));

    const addDirLight = (color, intensity, pos) => {
      const l = new THREE.DirectionalLight(color, intensity);
      l.position.set(...pos);
      scene.add(l);
    };
    addDirLight(0xffffff, 1.35, [2.5, 3.5, 5.5]);
    addDirLight(0x88ff9e, 0.65, [-3.5, -2.0, 4.5]);
    addDirLight(0xffffff, 1.35, [-2.5, 3.5, -5.5]);
    addDirLight(0x88ff9e, 0.65, [3.5, -2.0, -4.5]);

    // 3. EXACT BADGE DIMENSIONS & GEOMETRY HELPERS
    const BADGE_W = 3.00;
    const BADGE_H = 1.00;
    const CORNER_R = 0.34;
    const BODY_DEPTH = 0.12;
    const BEVEL_THICKNESS = 0.042;
    const BEVEL_SIZE = 0.036;
    const TOTAL_HALF_Z = BODY_DEPTH / 2 + BEVEL_THICKNESS;

    function createRoundedRectShape(w, h, r) {
      const hw = w / 2;
      const hh = h / 2;
      const rad = Math.min(r, hw, hh);
      const s = new THREE.Shape();
      s.moveTo(-hw + rad, -hh);
      s.lineTo(hw - rad, -hh);
      s.absarc(hw - rad, -hh + rad, rad, -Math.PI / 2, 0, false);
      s.lineTo(hw, hh - rad);
      s.absarc(hw - rad, hh - rad, rad, 0, Math.PI / 2, false);
      s.lineTo(-hw + rad, hh);
      s.absarc(-hw + rad, hh - rad, rad, Math.PI / 2, Math.PI, false);
      s.lineTo(-hw, -hh + rad);
      s.absarc(-hw + rad, -hh + rad, rad, Math.PI, Math.PI * 1.5, false);
      return s;
    }

    function createRoundedRectCurvePoints(w, h, r, z = 0) {
      const hw = w / 2;
      const hh = h / 2;
      const rad = Math.min(r, hw, hh);
      const pts = [];
      const cornerSteps = 22;
      const straightSteps = 10;

      const pushLine = (x0, y0, x1, y1) => {
        for (let i = 0; i < straightSteps; i++) {
          const t = i / straightSteps;
          pts.push(new THREE.Vector3(x0 + (x1 - x0) * t, y0 + (y1 - y0) * t, z));
        }
      };
      const pushArc = (cx, cy, a0, a1) => {
        for (let i = 0; i < cornerSteps; i++) {
          const a = a0 + (a1 - a0) * (i / cornerSteps);
          pts.push(new THREE.Vector3(cx + Math.cos(a) * rad, cy + Math.sin(a) * rad, z));
        }
      };

      pushLine(-hw + rad, -hh, hw - rad, -hh);
      pushArc(hw - rad, -hh + rad, -Math.PI / 2, 0);
      pushLine(hw, -hh + rad, hw, hh - rad);
      pushArc(hw - rad, hh - rad, 0, Math.PI / 2);
      pushLine(hw - rad, hh, -hw + rad, hh);
      pushArc(-hw + rad, hh - rad, Math.PI / 2, Math.PI);
      pushLine(-hw, hh - rad, -hw, -hh + rad);
      pushArc(-hw + rad, -hh + rad, Math.PI, Math.PI * 1.5);
      return pts;
    }

    function strokeRoundedRectCanvas(ctx, x, y, w, h, r) {
      const rad = Math.min(r, w / 2, h / 2);
      ctx.beginPath();
      ctx.moveTo(x + rad, y);
      ctx.lineTo(x + w - rad, y);
      ctx.arcTo(x + w, y, x + w, y + rad, rad);
      ctx.lineTo(x + w, y + h - rad);
      ctx.arcTo(x + w, y + h, x + w - rad, y + h, rad);
      ctx.lineTo(x + rad, y + h);
      ctx.arcTo(x, y + h, x, y + h - rad, rad);
      ctx.lineTo(x, y + rad);
      ctx.arcTo(x, y, x + rad, y, rad);
      ctx.closePath();
    }

    // 4. HIGH-DPI PROCEDURAL TEXTURES (2560px SUPERSAMPLED, SAFARI-SAFE)
    const maxAniso = renderer.capabilities.getMaxAnisotropy();

    function createSmokyGreenTexture() {
      const W = 2560;
      const H = 854;
      const canvas = document.createElement('canvas');
      canvas.width = W;
      canvas.height = H;
      const ctx = canvas.getContext('2d');

      const bg = ctx.createLinearGradient(0, 0, W, H);
      bg.addColorStop(0, '#102413');
      bg.addColorStop(0.35, '#152d19');
      bg.addColorStop(0.7, '#0c1c0f');
      bg.addColorStop(1, '#122816');
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, W, H);

      let seed = 4219;
      const rand = () => {
        seed = (seed * 16807) % 2147483647;
        return (seed - 1) / 2147483646;
      };

      for (let i = 0; i < 65; i++) {
        const cx = rand() * W;
        const cy = rand() * H;
        const rx = 160 + rand() * 420;
        const ry = 70 + rand() * 190;
        const angle = (rand() - 0.5) * 0.85;
        const isLight = rand() > 0.44;

        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(angle);
        ctx.scale(1, ry / rx);
        const grad = ctx.createRadialGradient(0, 0, 0, 0, 0, rx);
        if (isLight) {
          grad.addColorStop(0, 'rgba(42, 108, 52, 0.14)');
          grad.addColorStop(0.55, 'rgba(28, 74, 35, 0.06)');
          grad.addColorStop(1, 'rgba(16, 40, 20, 0)');
        } else {
          grad.addColorStop(0, 'rgba(4, 14, 6, 0.24)');
          grad.addColorStop(0.6, 'rgba(8, 22, 10, 0.10)');
          grad.addColorStop(1, 'rgba(8, 22, 10, 0)');
        }
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(0, 0, rx, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      // Soft inner neon green edge glow
      const pad = 22;
      const rPx = (CORNER_R / BADGE_H) * (H - pad * 2);
      ctx.save();
      strokeRoundedRectCanvas(ctx, pad, pad, W - pad * 2, H - pad * 2, rPx);
      ctx.shadowColor = 'rgba(72, 232, 82, 0.85)';
      ctx.shadowBlur = 78;
      ctx.lineWidth = 20;
      ctx.strokeStyle = 'rgba(66, 224, 76, 0.50)';
      ctx.stroke();

      ctx.shadowBlur = 32;
      ctx.lineWidth = 10;
      ctx.strokeStyle = 'rgba(88, 240, 96, 0.68)';
      ctx.stroke();
      ctx.restore();

      const tex = new THREE.CanvasTexture(canvas);
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.anisotropy = maxAniso;
      return tex;
    }

    function createTypographyLayerTextures() {
      const W = 2560;
      const H = 854;

      const canvas = document.createElement('canvas');
      canvas.width = W;
      canvas.height = H;
      const ctx = canvas.getContext('2d');

      const bumpCanvas = document.createElement('canvas');
      bumpCanvas.width = W;
      bumpCanvas.height = H;
      const bCtx = bumpCanvas.getContext('2d');

      ctx.clearRect(0, 0, W, H);
      bCtx.fillStyle = '#000000';
      bCtx.fillRect(0, 0, W, H);

      const fontSize = Math.round(H * 0.44);
      const fontSpec = `600 ${fontSize}px "Inter", "SF Pro Display", "Segoe UI", "Roboto", "Helvetica Neue", Arial, sans-serif`;

      ctx.font = fontSpec;
      ctx.textAlign = 'left';
      ctx.textBaseline = 'alphabetic';

      const text = 'Matter.js';
      const textWidthPx = ctx.measureText(text).width;

      // Dynamically balance [Matter.js Logo + gap + Matter.js] across the pill
      const logoDiamPx = H * 0.62;
      const gapPx = W * 0.042;
      const totalContentW = logoDiamPx + gapPx + textWidthPx;
      const startX = (W - totalContentW) * 0.5 - W * 0.005;
      const logoCenterX = startX + logoDiamPx * 0.5;
      const textX = startX + logoDiamPx + gapPx;
      const textY = H * 0.648;

      // Convert logoCenterX to 3D badge X coordinate
      const logoPosX3D = ((logoCenterX / W) - 0.5) * BADGE_W;

      ctx.save();
      ctx.shadowColor = 'rgba(225, 255, 232, 0.45)';
      ctx.shadowBlur = 14;
      ctx.fillStyle = '#F7FFF8';
      ctx.fillText(text, textX, textY);
      ctx.restore();

      ctx.save();
      ctx.shadowColor = 'rgba(255, 255, 255, 0.40)';
      ctx.shadowBlur = 4;
      ctx.fillStyle = '#FFFFFF';
      ctx.fillText(text, textX, textY);
      ctx.restore();

      bCtx.font = fontSpec;
      bCtx.textAlign = 'left';
      bCtx.textBaseline = 'alphabetic';
      bCtx.shadowColor = 'rgba(200, 200, 200, 0.85)';
      bCtx.shadowBlur = 6;
      bCtx.fillStyle = '#ffffff';
      bCtx.fillText(text, textX, textY);

      const mapTex = new THREE.CanvasTexture(canvas);
      mapTex.colorSpace = THREE.SRGBColorSpace;
      mapTex.anisotropy = maxAniso;

      const bumpTex = new THREE.CanvasTexture(bumpCanvas);
      bumpTex.anisotropy = maxAniso;

      return { mapTex, bumpTex, logoPosX3D };
    }

    function createHaloTexture() {
      const W = 2048;
      const H = 1024;
      const canvas = document.createElement('canvas');
      canvas.width = W;
      canvas.height = H;
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, W, H);

      const rectW = W * 0.65;
      const rectH = H * 0.43;
      const rectX = (W - rectW) / 2;
      const rectY = (H - rectH) / 2;
      const rPx = (CORNER_R / BADGE_H) * rectH;

      const passes = [
        { blur: 130, alpha: 0.25, lw: 34 },
        { blur: 82,  alpha: 0.35, lw: 26 },
        { blur: 46,  alpha: 0.45, lw: 18 },
        { blur: 22,  alpha: 0.54, lw: 12 }
      ];

      passes.forEach((p) => {
        ctx.save();
        strokeRoundedRectCanvas(ctx, rectX, rectY, rectW, rectH, rPx);
        ctx.shadowColor = `rgba(68, 228, 82, ${p.alpha})`;
        ctx.shadowBlur = p.blur;
        ctx.lineWidth = p.lw;
        ctx.strokeStyle = `rgba(82, 238, 96, ${p.alpha * 0.55})`;
        ctx.stroke();
        ctx.restore();
      });

      const tex = new THREE.CanvasTexture(canvas);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    function createBillboardAuraTexture() {
      const S = 1024;
      const canvas = document.createElement('canvas');
      canvas.width = S;
      canvas.height = S;
      const ctx = canvas.getContext('2d');

      ctx.save();
      ctx.translate(S / 2, S / 2);
      ctx.scale(1.0, 0.52);
      const grad = ctx.createRadialGradient(0, 0, S * 0.14, 0, 0, S * 0.48);
      grad.addColorStop(0, 'rgba(68, 226, 82, 0.28)');
      grad.addColorStop(0.45, 'rgba(68, 226, 82, 0.13)');
      grad.addColorStop(0.75, 'rgba(68, 226, 82, 0.04)');
      grad.addColorStop(1, 'rgba(68, 226, 82, 0.0)');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(0, 0, S * 0.48, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      const tex = new THREE.CanvasTexture(canvas);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    function createTealGradientTexture() {
      const W = 512;
      const H = 64;
      const canvas = document.createElement('canvas');
      canvas.width = W;
      canvas.height = H;
      const ctx = canvas.getContext('2d');
      const grad = ctx.createLinearGradient(0, 0, W, 0);
      grad.addColorStop(0, '#3a9ab0');
      grad.addColorStop(0.55, '#3aa59f');
      grad.addColorStop(1, '#3eb289');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, W, H);
      const tex = new THREE.CanvasTexture(canvas);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    // 5. BUILD PHYSICAL 3D DOUBLE-SIDED MODEL
    const badgeRoot = new THREE.Group();
    scene.add(badgeRoot);

    const smokyGreenTex = createSmokyGreenTexture();
    const { mapTex: typoColorTex, bumpTex: typoBumpTex, logoPosX3D } = createTypographyLayerTextures();

    // 5A. Extruded Physical Pill Body with 14-Segment Rounded Bevels
    const bodyShape = createRoundedRectShape(BADGE_W, BADGE_H, CORNER_R);
    const bodyGeo = new THREE.ExtrudeGeometry(bodyShape, {
      depth: BODY_DEPTH,
      bevelEnabled: true,
      bevelThickness: BEVEL_THICKNESS,
      bevelSize: BEVEL_SIZE,
      bevelSegments: 14,
      curveSegments: 56
    });
    bodyGeo.center();

    {
      const pos = bodyGeo.attributes.position;
      const uv = bodyGeo.attributes.uv;
      const totalW = BADGE_W + BEVEL_SIZE * 2;
      const totalH = BADGE_H + BEVEL_SIZE * 2;
      for (let i = 0; i < pos.count; i++) {
        uv.setXY(i, (pos.getX(i) / totalW) + 0.5, (pos.getY(i) / totalH) + 0.5);
      }
      uv.needsUpdate = true;
    }

    const bodyMaterial = new THREE.MeshPhysicalMaterial({
      map: smokyGreenTex,
      color: 0xffffff,
      roughness: 0.16,
      metalness: 0.08,
      clearcoat: 1.0,
      clearcoatRoughness: 0.06,
      ior: 1.52,
      reflectivity: 0.92,
      envMapIntensity: 1.3
    });

    badgeRoot.add(new THREE.Mesh(bodyGeo, bodyMaterial));

    // 5B. 3D Neon Green Perimeter Bevel Tubes (Front, Back & Outer Rim Accent)
    const neonGreenMat = new THREE.MeshPhysicalMaterial({
      color: 0x52eb5c,
      emissive: 0x34cf3e,
      emissiveIntensity: 1.05,
      roughness: 0.14,
      metalness: 0.05,
      clearcoat: 1.0,
      clearcoatRoughness: 0.05,
      envMapIntensity: 1.1
    });

    function createRimTube(w, h, r, zPos, tubeRadius) {
      const pts = createRoundedRectCurvePoints(w, h, r, zPos);
      const curve = new THREE.CatmullRomCurve3(pts, true);
      const geo = new THREE.TubeGeometry(curve, 180, tubeRadius, 14, true);
      return new THREE.Mesh(geo, neonGreenMat);
    }

    const rimZ = BODY_DEPTH / 2 + BEVEL_THICKNESS * 0.64;
    badgeRoot.add(createRimTube(BADGE_W + 0.022, BADGE_H + 0.022, CORNER_R + 0.011, rimZ, 0.022));
    badgeRoot.add(createRimTube(BADGE_W + 0.022, BADGE_H + 0.022, CORNER_R + 0.011, -rimZ, 0.022));
    badgeRoot.add(createRimTube(BADGE_W + BEVEL_SIZE * 1.85, BADGE_H + BEVEL_SIZE * 1.85, CORNER_R + BEVEL_SIZE * 0.92, 0, 0.018));

    // 5C. Front & Back Raised Face Assemblies (3D Extruded Matter.js Logo + Supersampled Typography)
    const facePlateShape = createRoundedRectShape(BADGE_W - 0.04, BADGE_H - 0.04, CORNER_R - 0.02);
    const facePlateGeo = new THREE.ShapeGeometry(facePlateShape, 48);
    {
      const pos = facePlateGeo.attributes.position;
      const uv = facePlateGeo.attributes.uv;
      for (let i = 0; i < pos.count; i++) {
        uv.setXY(i, (pos.getX(i) / BADGE_W) + 0.5, (pos.getY(i) / BADGE_H) + 0.5);
      }
      uv.needsUpdate = true;
    }

    const typoMaterial = new THREE.MeshPhysicalMaterial({
      map: typoColorTex,
      bumpMap: typoBumpTex,
      bumpScale: 0.008,
      emissive: 0xebffef,
      emissiveMap: typoColorTex,
      emissiveIntensity: 0.45,
      transparent: true,
      alphaTest: 0.01,
      roughness: 0.15,
      metalness: 0.02,
      clearcoat: 1.0,
      clearcoatRoughness: 0.05,
      depthWrite: false
    });

    // 3D Extruded Matter.js Geometric Logo (Teal Truss Triangle + Yellow Circle + Coral-Red Square)
    const tealGradTex = createTealGradientTexture();
    const tealMat = new THREE.MeshPhysicalMaterial({
      map: tealGradTex,
      color: 0xffffff,
      emissive: 0x1b635e,
      emissiveIntensity: 0.35,
      roughness: 0.18,
      metalness: 0.04,
      clearcoat: 1.0,
      clearcoatRoughness: 0.06
    });

    const yellowMat = new THREE.MeshPhysicalMaterial({
      color: 0xfcc932,
      emissive: 0xe2a412,
      emissiveIntensity: 0.28,
      roughness: 0.16,
      metalness: 0.03,
      clearcoat: 1.0,
      clearcoatRoughness: 0.05
    });

    const coralMat = new THREE.MeshPhysicalMaterial({
      color: 0xf25835,
      emissive: 0xd43616,
      emissiveIntensity: 0.28,
      roughness: 0.16,
      metalness: 0.03,
      clearcoat: 1.0,
      clearcoatRoughness: 0.05
    });

    function createMatterLogoGeometries() {
      const targetSize = BADGE_H * 0.64;

      // Normalized logo coordinates centered around (0, 0) in [-0.45..0.45]
      const pTop = new THREE.Vector2(-0.265, 0.255);
      const pBot = new THREE.Vector2(-0.355, -0.325);
      const pRight = new THREE.Vector2(0.005, -0.005);
      const nodeR = 0.072;
      const barHalfW = 0.025;

      const minTealX = pBot.x - nodeR;
      const maxTealX = pRight.x + nodeR;
      const applyTealGradientUV = (geo) => {
        const pos = geo.attributes.position;
        const uv = geo.attributes.uv;
        const span = maxTealX - minTealX;
        for (let i = 0; i < pos.count; i++) {
          const u = THREE.MathUtils.clamp((pos.getX(i) - minTealX) / span, 0, 1);
          uv.setXY(i, u, 0.5);
        }
        uv.needsUpdate = true;
      };

      const makeCircleGeo = (cx, cy, r, depth) => {
        const s = new THREE.Shape();
        s.absarc(cx, cy, r, 0, Math.PI * 2, false);
        const geo = new THREE.ExtrudeGeometry(s, {
          depth,
          bevelEnabled: true,
          bevelThickness: 0.0045,
          bevelSize: 0.0028,
          bevelSegments: 3,
          curveSegments: 48
        });
        geo.translate(0, 0, -depth / 2);
        return geo;
      };

      const makeStrutGeo = (a, b, halfW, depth) => {
        const dir = new THREE.Vector2().subVectors(b, a).normalize();
        const perp = new THREE.Vector2(-dir.y, dir.x).multiplyScalar(halfW);
        const s = new THREE.Shape();
        s.moveTo(a.x + perp.x, a.y + perp.y);
        s.lineTo(b.x + perp.x, b.y + perp.y);
        s.lineTo(b.x - perp.x, b.y - perp.y);
        s.lineTo(a.x - perp.x, a.y - perp.y);
        s.closePath();
        const geo = new THREE.ExtrudeGeometry(s, {
          depth,
          bevelEnabled: true,
          bevelThickness: 0.0035,
          bevelSize: 0.002,
          bevelSegments: 2
        });
        geo.translate(0, 0, -depth / 2);
        return geo;
      };

      const makeSquareGeo = (cx, cy, size, depth) => {
        const hs = size / 2;
        const r = 0.008;
        const s = new THREE.Shape();
        s.moveTo(cx - hs + r, cy - hs);
        s.lineTo(cx + hs - r, cy - hs);
        s.absarc(cx + hs - r, cy - hs + r, r, -Math.PI / 2, 0, false);
        s.lineTo(cx + hs, cy + hs - r);
        s.absarc(cx + hs - r, cy + hs - r, r, 0, Math.PI / 2, false);
        s.lineTo(cx - hs + r, cy + hs);
        s.absarc(cx - hs + r, cy + hs - r, r, Math.PI / 2, Math.PI, false);
        s.lineTo(cx - hs, cy - hs + r);
        s.absarc(cx - hs + r, cy - hs + r, r, Math.PI, Math.PI * 1.5, false);
        const geo = new THREE.ExtrudeGeometry(s, {
          depth,
          bevelEnabled: true,
          bevelThickness: 0.0045,
          bevelSize: 0.0028,
          bevelSegments: 3
        });
        geo.translate(0, 0, -depth / 2);
        return geo;
      };

      const tealGeos = [
        makeStrutGeo(pTop, pBot, barHalfW, 0.015),
        makeStrutGeo(pTop, pRight, barHalfW, 0.015),
        makeStrutGeo(pBot, pRight, barHalfW, 0.015),
        makeCircleGeo(pTop.x, pTop.y, nodeR, 0.020),
        makeCircleGeo(pBot.x, pBot.y, nodeR, 0.020),
        makeCircleGeo(pRight.x, pRight.y, nodeR, 0.020)
      ];
      tealGeos.forEach((g) => {
        applyTealGradientUV(g);
        g.scale(targetSize, targetSize, 1);
      });

      const yellowGeo = makeCircleGeo(0.255, 0.285, 0.172, 0.020);
      yellowGeo.scale(targetSize, targetSize, 1);

      const coralGeo = makeSquareGeo(0.255, -0.285, 0.33, 0.020);
      coralGeo.scale(targetSize, targetSize, 1);

      return { tealGeos, yellowGeo, coralGeo };
    }

    const matterGeos = createMatterLogoGeometries();

    function createFaceDetailGroup() {
      const group = new THREE.Group();

      const typoMesh = new THREE.Mesh(facePlateGeo, typoMaterial);
      typoMesh.position.z = TOTAL_HALF_Z + 0.0025;
      group.add(typoMesh);

      const logoGroup = new THREE.Group();
      logoGroup.position.set(logoPosX3D, 0, TOTAL_HALF_Z + 0.007);

      matterGeos.tealGeos.forEach((g) => {
        logoGroup.add(new THREE.Mesh(g, tealMat));
      });
      logoGroup.add(new THREE.Mesh(matterGeos.yellowGeo, yellowMat));
      logoGroup.add(new THREE.Mesh(matterGeos.coralGeo, coralMat));

      group.add(logoGroup);

      return group;
    }

    badgeRoot.add(createFaceDetailGroup());

    const backFace = createFaceDetailGroup();
    backFace.rotation.y = Math.PI;
    badgeRoot.add(backFace);

    // 5D. Outer Green Neon Halo on Pure #FFFFFF Background
    const haloMat = new THREE.MeshBasicMaterial({
      map: createHaloTexture(),
      transparent: true,
      opacity: 0.95,
      depthWrite: false,
      side: THREE.DoubleSide
    });
    const haloMesh = new THREE.Mesh(new THREE.PlaneGeometry(4.6, 2.3), haloMat);
    haloMesh.renderOrder = -2;
    badgeRoot.add(haloMesh);

    const auraMat = new THREE.SpriteMaterial({
      map: createBillboardAuraTexture(),
      transparent: true,
      opacity: 0.45,
      depthWrite: false
    });
    const auraSprite = new THREE.Sprite(auraMat);
    auraSprite.scale.set(4.4, 4.4, 1);
    auraSprite.renderOrder = -3;
    scene.add(auraSprite);

    // 6. 360° ORBIT CONTROLS, IDLE FLOAT, HOVER MICRO-TILT & DOUBLE-CLICK RESET
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.copy(INITIAL_TARGET);
    controls.enableDamping = true;
    controls.dampingFactor = 0.065;
    controls.enablePan = false;
    controls.rotateSpeed = 0.85;
    controls.zoomSpeed = 0.9;
    controls.minDistance = 2.0;
    controls.maxDistance = 8.5;
    controls.update();

    let isDragging = false;
    let isPointerInside = false;
    let pointerNX = 0;
    let pointerNY = 0;
    let isResetting = false;

    const resetStartCam = new THREE.Vector3();
    const resetStartTarget = new THREE.Vector3();
    let resetProgress = 0;

    controls.addEventListener('start', () => {
      isDragging = true;
      isResetting = false;
    });
    controls.addEventListener('end', () => {
      isDragging = false;
    });

    const domEl = renderer.domElement;
    domEl.addEventListener('pointermove', (e) => {
      isPointerInside = true;
      pointerNX = (e.clientX / window.innerWidth) * 2 - 1;
      pointerNY = (e.clientY / window.innerHeight) * 2 - 1;
    });
    domEl.addEventListener('pointerleave', () => {
      isPointerInside = false;
      pointerNX = 0;
      pointerNY = 0;
    });
    domEl.addEventListener('dblclick', () => {
      resetStartCam.copy(camera.position);
      resetStartTarget.copy(controls.target);
      resetProgress = 0;
      isResetting = true;
    });

    // 7. RESIZE & ANIMATION LOOP
    window.addEventListener('resize', () => {
      const w = window.innerWidth;
      const h = window.innerHeight;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    });

    const clock = new THREE.Clock();
    const viewDir = new THREE.Vector3();

    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), 0.05);
      const elapsed = clock.elapsedTime;

      if (isResetting) {
        resetProgress = Math.min(resetProgress + dt * 2.4, 1);
        const ease = 1 - Math.pow(1 - resetProgress, 3);
        camera.position.lerpVectors(resetStartCam, INITIAL_CAM_POS, ease);
        controls.target.lerpVectors(resetStartTarget, INITIAL_TARGET, ease);
        if (resetProgress >= 1) isResetting = false;
      }

      const idleFloatY = Math.sin(elapsed * 1.45) * 0.022;
      const idleRotX = Math.sin(elapsed * 0.95) * 0.012;
      const idleRotY = Math.cos(elapsed * 0.75) * 0.015;

      const targetTiltY = (!isDragging && isPointerInside) ? pointerNX * 0.085 : 0;
      const targetTiltX = (!isDragging && isPointerInside) ? pointerNY * 0.065 : 0;

      badgeRoot.position.y = THREE.MathUtils.lerp(badgeRoot.position.y, idleFloatY, 0.08);
      badgeRoot.rotation.x = THREE.MathUtils.lerp(badgeRoot.rotation.x, targetTiltX + idleRotX, 0.07);
      badgeRoot.rotation.y = THREE.MathUtils.lerp(badgeRoot.rotation.y, targetTiltY + idleRotY, 0.07);

      auraSprite.position.y = badgeRoot.position.y;
      viewDir.subVectors(camera.position, controls.target).normalize();
      const edgeFactor = 1.0 - Math.abs(viewDir.z);
      haloMat.opacity = 0.95 * (1.0 - edgeFactor * 0.65);
      auraMat.opacity = 0.35 + edgeFactor * 0.28;

      controls.update();
      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // 1. RENDERER, SCENE & CAMERA
    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      alpha: true,
      powerPreference: 'high-performance'
    });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.08;
    renderer.setClearColor(0xffffff, 0);
    document.body.appendChild(renderer.domElement);

    const scene = new THREE.Scene();

    const INITIAL_CAM_POS = new THREE.Vector3(0, 0, 4.55);
    const INITIAL_TARGET = new THREE.Vector3(0, 0, 0);

    const camera = new THREE.PerspectiveCamera(36, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.copy(INITIAL_CAM_POS);

    // 2. PROCEDURAL 360° STUDIO ENVIRONMENT (PMREM) & BALANCED LIGHTING
    function createStudioEnv(glRenderer) {
      const pmrem = new THREE.PMREMGenerator(glRenderer);
      pmrem.compileEquirectangularShader();
      const envScene = new THREE.Scene();
      envScene.background = new THREE.Color(0x051c08);

      const addPanel = (w, h, color, intensity, pos) => {
        const geo = new THREE.PlaneGeometry(w, h);
        const mat = new THREE.MeshBasicMaterial({
          color: new THREE.Color(color).multiplyScalar(intensity),
          side: THREE.DoubleSide
        });
        const mesh = new THREE.Mesh(geo, mat);
        mesh.position.set(...pos);
        mesh.lookAt(0, 0, 0);
        envScene.add(mesh);
      };

      addPanel(10, 5, 0xffffff, 2.15, [0, 3.2, 8]);
      addPanel(10, 5, 0xc4ffbe, 1.35, [0, -3.5, 8]);
      addPanel(10, 5, 0xffffff, 2.15, [0, 3.2, -8]);
      addPanel(10, 5, 0xc4ffbe, 1.35, [0, -3.5, -8]);
      addPanel(12, 6, 0xe8ffe6, 1.95, [0, 8.5, 0]);
      addPanel(12, 6, 0x6bff5c, 1.05, [0, -8.5, 0]);
      addPanel(6, 8, 0xa8ff9c, 1.5, [9, 0.5, 0]);
      addPanel(6, 8, 0xa8ff9c, 1.5, [-9, 0.5, 0]);

      const rt = pmrem.fromScene(envScene, 0.04);
      pmrem.dispose();
      return rt.texture;
    }

    scene.environment = createStudioEnv(renderer);
    scene.add(new THREE.AmbientLight(0xdfffe0, 0.85));

    const addDirLight = (color, intensity, pos) => {
      const l = new THREE.DirectionalLight(color, intensity);
      l.position.set(...pos);
      scene.add(l);
    };
    addDirLight(0xffffff, 1.35, [2.5, 3.5, 5.5]);
    addDirLight(0x74ff61, 0.55, [-3.5, -2.0, 4.5]);
    addDirLight(0xffffff, 1.35, [-2.5, 3.5, -5.5]);
    addDirLight(0x74ff61, 0.55, [3.5, -2.0, -4.5]);

    // 3. BADGE DIMENSIONS & GEOMETRY HELPERS
    const BADGE_W = 3.20;
    const BADGE_H = 1.00;
    const CORNER_R = 0.27;
    const BODY_DEPTH = 0.12;
    const BEVEL_THICKNESS = 0.042;
    const BEVEL_SIZE = 0.036;
    const TOTAL_HALF_Z = BODY_DEPTH / 2 + BEVEL_THICKNESS;

    function createRoundedRectShape(w, h, r) {
      const hw = w / 2;
      const hh = h / 2;
      const rad = Math.min(r, hw, hh);
      const s = new THREE.Shape();
      s.moveTo(-hw + rad, -hh);
      s.lineTo(hw - rad, -hh);
      s.absarc(hw - rad, -hh + rad, rad, -Math.PI / 2, 0, false);
      s.lineTo(hw, hh - rad);
      s.absarc(hw - rad, hh - rad, rad, 0, Math.PI / 2, false);
      s.lineTo(-hw + rad, hh);
      s.absarc(-hw + rad, hh - rad, rad, Math.PI / 2, Math.PI, false);
      s.lineTo(-hw, -hh + rad);
      s.absarc(-hw + rad, -hh + rad, rad, Math.PI, Math.PI * 1.5, false);
      return s;
    }

    function createRoundedRectCurvePoints(w, h, r, z = 0) {
      const hw = w / 2;
      const hh = h / 2;
      const rad = Math.min(r, hw, hh);
      const pts = [];
      const cornerSteps = 22;
      const straightSteps = 10;

      const pushLine = (x0, y0, x1, y1) => {
        for (let i = 0; i < straightSteps; i++) {
          const t = i / straightSteps;
          pts.push(new THREE.Vector3(x0 + (x1 - x0) * t, y0 + (y1 - y0) * t, z));
        }
      };
      const pushArc = (cx, cy, a0, a1) => {
        for (let i = 0; i < cornerSteps; i++) {
          const a = a0 + (a1 - a0) * (i / cornerSteps);
          pts.push(new THREE.Vector3(cx + Math.cos(a) * rad, cy + Math.sin(a) * rad, z));
        }
      };

      pushLine(-hw + rad, -hh, hw - rad, -hh);
      pushArc(hw - rad, -hh + rad, -Math.PI / 2, 0);
      pushLine(hw, -hh + rad, hw, hh - rad);
      pushArc(hw - rad, hh - rad, 0, Math.PI / 2);
      pushLine(hw - rad, hh, -hw + rad, hh);
      pushArc(-hw + rad, hh - rad, Math.PI / 2, Math.PI);
      pushLine(-hw, hh - rad, -hw, -hh + rad);
      pushArc(-hw + rad, -hh + rad, Math.PI, Math.PI * 1.5);
      return pts;
    }

    function strokeRoundedRectCanvas(ctx, x, y, w, h, r) {
      const rad = Math.min(r, w / 2, h / 2);
      ctx.beginPath();
      ctx.moveTo(x + rad, y);
      ctx.lineTo(x + w - rad, y);
      ctx.arcTo(x + w, y, x + w, y + rad, rad);
      ctx.lineTo(x + w, y + h - rad);
      ctx.arcTo(x + w, y + h, x + w - rad, y + h, rad);
      ctx.lineTo(x + rad, y + h);
      ctx.arcTo(x, y + h, x, y + h - rad, rad);
      ctx.lineTo(x, y + rad);
      ctx.arcTo(x, y, x + rad, y, rad);
      ctx.closePath();
    }

    // 4. HIGH-DPI PROCEDURAL TEXTURES (SUPERSAMPLED)
    const maxAniso = renderer.capabilities.getMaxAnisotropy();

    function createSmokyGreenTexture() {
      const W = 2560;
      const H = 800;
      const canvas = document.createElement('canvas');
      canvas.width = W;
      canvas.height = H;
      const ctx = canvas.getContext('2d');

      const bg = ctx.createLinearGradient(0, 0, W, H);
      bg.addColorStop(0, '#103c15');
      bg.addColorStop(0.35, '#0b2d0f');
      bg.addColorStop(0.7, '#061c08');
      bg.addColorStop(1, '#0e3613');
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, W, H);

      let seed = 7331;
      const rand = () => {
        seed = (seed * 16807) % 2147483647;
        return (seed - 1) / 2147483646;
      };

      for (let i = 0; i < 65; i++) {
        const cx = rand() * W;
        const cy = rand() * H;
        const rx = 160 + rand() * 420;
        const ry = 70 + rand() * 190;
        const angle = (rand() - 0.5) * 0.85;
        const isLight = rand() > 0.44;

        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(angle);
        ctx.scale(1, ry / rx);
        const grad = ctx.createRadialGradient(0, 0, 0, 0, 0, rx);
        if (isLight) {
          grad.addColorStop(0, 'rgba(42, 138, 48, 0.14)');
          grad.addColorStop(0.55, 'rgba(26, 98, 32, 0.06)');
          grad.addColorStop(1, 'rgba(10, 46, 14, 0)');
        } else {
          grad.addColorStop(0, 'rgba(2, 14, 4, 0.22)');
          grad.addColorStop(0.6, 'rgba(4, 22, 7, 0.10)');
          grad.addColorStop(1, 'rgba(4, 22, 7, 0)');
        }
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(0, 0, rx, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      // Soft inner neon lime-green edge glow
      const pad = 20;
      const rPx = (CORNER_R / BADGE_H) * (H - pad * 2);
      ctx.save();
      strokeRoundedRectCanvas(ctx, pad, pad, W - pad * 2, H - pad * 2, rPx);
      ctx.shadowColor = 'rgba(72, 255, 54, 0.90)';
      ctx.shadowBlur = 74;
      ctx.lineWidth = 20;
      ctx.strokeStyle = 'rgba(72, 255, 54, 0.54)';
      ctx.stroke();

      ctx.shadowBlur = 30;
      ctx.lineWidth = 10;
      ctx.strokeStyle = 'rgba(116, 255, 92, 0.78)';
      ctx.stroke();
      ctx.restore();

      const tex = new THREE.CanvasTexture(canvas);
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.anisotropy = maxAniso;
      return tex;
    }

    function createTypographyLayerTextures() {
      const W = 2560;
      const H = 800;

      const canvas = document.createElement('canvas');
      canvas.width = W;
      canvas.height = H;
      const ctx = canvas.getContext('2d');

      const bumpCanvas = document.createElement('canvas');
      bumpCanvas.width = W;
      bumpCanvas.height = H;
      const bCtx = bumpCanvas.getContext('2d');

      ctx.clearRect(0, 0, W, H);
      bCtx.fillStyle = '#000000';
      bCtx.fillRect(0, 0, W, H);

      const text = 'GSAP & Lenis';
      let fontSize = Math.round(H * 0.345);
      const makeFont = (sz) => `700 ${sz}px "Inter", "SF Pro Display", "Segoe UI", "Roboto", "Helvetica Neue", Arial, sans-serif`;

      ctx.font = makeFont(fontSize);
      const heroBoxW = H * 0.74;
      const gapPx = W * 0.025;
      const maxAllowedW = W * 0.85;

      let textWidthPx = ctx.measureText(text).width;
      if (heroBoxW + gapPx + textWidthPx > maxAllowedW) {
        const scaleDown = (maxAllowedW - heroBoxW - gapPx) / textWidthPx;
        fontSize = Math.floor(fontSize * scaleDown);
        ctx.font = makeFont(fontSize);
        textWidthPx = ctx.measureText(text).width;
      }

      const totalContentW = heroBoxW + gapPx + textWidthPx;
      const startX = (W - totalContentW) * 0.5 - W * 0.012;
      const heroCenterX = startX + heroBoxW * 0.45;
      const textX = startX + heroBoxW + gapPx;
      const textY = H * 0.615;

      const heroPosX3D = ((heroCenterX / W) - 0.5) * BADGE_W;

      // Soft emerald backlight aura behind the superhero & boot shadow
      ctx.save();
      const auraGrad = ctx.createRadialGradient(heroCenterX, H * 0.5, 20, heroCenterX, H * 0.5, H * 0.52);
      auraGrad.addColorStop(0, 'rgba(72, 245, 58, 0.38)');
      auraGrad.addColorStop(0.5, 'rgba(38, 185, 36, 0.16)');
      auraGrad.addColorStop(1, 'rgba(10, 60, 12, 0)');
      ctx.fillStyle = auraGrad;
      ctx.beginPath();
      ctx.arc(heroCenterX, H * 0.5, H * 0.52, 0, Math.PI * 2);
      ctx.fill();

      // Subtle floor shadow beneath boots
      ctx.fillStyle = 'rgba(2, 12, 4, 0.58)';
      ctx.beginPath();
      ctx.ellipse(heroCenterX + H * 0.06, H * 0.875, H * 0.19, H * 0.032, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      // Crisp white "GSAP & Lenis" typography
      ctx.textAlign = 'left';
      ctx.textBaseline = 'alphabetic';

      ctx.save();
      ctx.shadowColor = 'rgba(195, 255, 195, 0.48)';
      ctx.shadowBlur = 14;
      ctx.fillStyle = '#F7FFF7';
      ctx.fillText(text, textX, textY);
      ctx.restore();

      ctx.save();
      ctx.shadowColor = 'rgba(255, 255, 255, 0.35)';
      ctx.shadowBlur = 4;
      ctx.fillStyle = '#FFFFFF';
      ctx.fillText(text, textX, textY);
      ctx.restore();

      bCtx.font = makeFont(fontSize);
      bCtx.textAlign = 'left';
      bCtx.textBaseline = 'alphabetic';
      bCtx.shadowColor = 'rgba(200, 200, 200, 0.85)';
      bCtx.shadowBlur = 6;
      bCtx.fillStyle = '#ffffff';
      bCtx.fillText(text, textX, textY);

      const mapTex = new THREE.CanvasTexture(canvas);
      mapTex.colorSpace = THREE.SRGBColorSpace;
      mapTex.anisotropy = maxAniso;

      const bumpTex = new THREE.CanvasTexture(bumpCanvas);
      bumpTex.anisotropy = maxAniso;

      return { mapTex, bumpTex, heroPosX3D };
    }

    function createHaloTexture() {
      const W = 2048;
      const H = 1024;
      const canvas = document.createElement('canvas');
      canvas.width = W;
      canvas.height = H;
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, W, H);

      const rectW = W * 0.67;
      const rectH = H * 0.43;
      const rectX = (W - rectW) / 2;
      const rectY = (H - rectH) / 2;
      const rPx = (CORNER_R / BADGE_H) * rectH;

      const passes = [
        { blur: 130, alpha: 0.24, lw: 34 },
        { blur: 82,  alpha: 0.34, lw: 26 },
        { blur: 46,  alpha: 0.44, lw: 18 },
        { blur: 22,  alpha: 0.56, lw: 12 }
      ];

      passes.forEach((p) => {
        ctx.save();
        strokeRoundedRectCanvas(ctx, rectX, rectY, rectW, rectH, rPx);
        ctx.shadowColor = `rgba(66, 245, 48, ${p.alpha})`;
        ctx.shadowBlur = p.blur;
        ctx.lineWidth = p.lw;
        ctx.strokeStyle = `rgba(92, 255, 74, ${p.alpha * 0.58})`;
        ctx.stroke();
        ctx.restore();
      });

      const tex = new THREE.CanvasTexture(canvas);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    function createBillboardAuraTexture() {
      const S = 1024;
      const canvas = document.createElement('canvas');
      canvas.width = S;
      canvas.height = S;
      const ctx = canvas.getContext('2d');

      ctx.save();
      ctx.translate(S / 2, S / 2);
      ctx.scale(1.0, 0.50);
      const grad = ctx.createRadialGradient(0, 0, S * 0.14, 0, 0, S * 0.48);
      grad.addColorStop(0, 'rgba(68, 245, 52, 0.28)');
      grad.addColorStop(0.45, 'rgba(68, 245, 52, 0.12)');
      grad.addColorStop(0.75, 'rgba(68, 245, 52, 0.03)');
      grad.addColorStop(1, 'rgba(68, 245, 52, 0.0)');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(0, 0, S * 0.48, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      const tex = new THREE.CanvasTexture(canvas);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    // 5. GSAP SUPERHERO 3D MULTI-LAYERED SCULPTED MODEL (1024x1024 CANONICAL SPACE)
    // Helper: builds both THREE.Shape (Y-up centered) and Canvas 2D path (Y-down 0..1024)
    // from identical bezier segments so 3D geometry & high-DPI comic shading align sub-pixel!
    function buildShapeFromSegments(segments, holesSegments = []) {
      const toThree = (x, y) => [x - 512, 512 - y];
      const shape = new THREE.Shape();
      const applySegs = (target, segs) => {
        segs.forEach((seg) => {
          if (seg[0] === 'M') {
            const [x, y] = toThree(seg[1], seg[2]);
            target.moveTo(x, y);
          } else if (seg[0] === 'L') {
            const [x, y] = toThree(seg[1], seg[2]);
            target.lineTo(x, y);
          } else if (seg[0] === 'Q') {
            const [cx, cy] = toThree(seg[1], seg[2]);
            const [x, y] = toThree(seg[3], seg[4]);
            target.quadraticCurveTo(cx, cy, x, y);
          } else if (seg[0] === 'C') {
            const [c1x, c1y] = toThree(seg[1], seg[2]);
            const [c2x, c2y] = toThree(seg[3], seg[4]);
            const [x, y] = toThree(seg[5], seg[6]);
            target.bezierCurveTo(c1x, c1y, c2x, c2y, x, y);
          }
        });
      };
      applySegs(shape, segments);
      holesSegments.forEach((hSegs) => {
        const hole = new THREE.Path();
        applySegs(hole, hSegs);
        shape.holes.push(hole);
      });
      return shape;
    }

    function traceSegmentsOnCanvas(ctx, segments, scale = 1) {
      ctx.beginPath();
      segments.forEach((seg) => {
        if (seg[0] === 'M') ctx.moveTo(seg[1] * scale, seg[2] * scale);
        else if (seg[0] === 'L') ctx.lineTo(seg[1] * scale, seg[2] * scale);
        else if (seg[0] === 'Q') ctx.quadraticCurveTo(seg[1] * scale, seg[2] * scale, seg[3] * scale, seg[4] * scale);
        else if (seg[0] === 'C') ctx.bezierCurveTo(seg[1] * scale, seg[2] * scale, seg[3] * scale, seg[4] * scale, seg[5] * scale, seg[6] * scale);
      });
      ctx.closePath();
    }

    function makeHeroExtrudeGeo(shape, depth, bevelThick, bevelSize, targetHeight3D) {
      const geo = new THREE.ExtrudeGeometry(shape, {
        depth,
        bevelEnabled: true,
        bevelThickness: bevelThick,
        bevelSize: bevelSize,
        bevelSegments: 4,
        curveSegments: 28
      });

      // Compute exact planar UVs from canonical 1024x1024 space BEFORE scaling
      const pos = geo.attributes.position;
      const uv = geo.attributes.uv;
      for (let i = 0; i < pos.count; i++) {
        uv.setXY(i, (pos.getX(i) + 512) / 1024, (pos.getY(i) + 512) / 1024);
      }
      uv.needsUpdate = true;

      // Scale uniformly from 810px character height (y: 112..922) to targetHeight3D
      const s = targetHeight3D / 815;
      geo.scale(s, s, 1);
      return geo;
    }

      // 5.2 High-DPI Shaded Textures (2048x2048) matching exact coordinates
      const TEX_S = 2048;

      // -- Cape Texture --
      const capeCanvas = document.createElement('canvas');
      capeCanvas.width = TEX_S;
      capeCanvas.height = TEX_S;
      const cCtx = capeCanvas.getContext('2d');
      cCtx.fillStyle = '#5bb810';
      cCtx.fillRect(0, 0, TEX_S, TEX_S);

      cCtx.save();
      traceSegmentsOnCanvas(cCtx, capeSegs, sc);
      cCtx.clip();

      const capeGrad = cCtx.createLinearGradient(110 * sc, 240 * sc, 600 * sc, 700 * sc);
      capeGrad.addColorStop(0, '#aae826');
      capeGrad.addColorStop(0.42, '#7ed316');
      capeGrad.addColorStop(0.78, '#53a80d');
      capeGrad.addColorStop(1, '#397b08');
      cCtx.fillStyle = capeGrad;
      cCtx.fillRect(0, 0, TEX_S, TEX_S);

      // Dramatic cape folds
      cCtx.fillStyle = 'rgba(28, 72, 5, 0.36)';
      cCtx.beginPath();
      cCtx.moveTo(525 * sc, 265 * sc);
      cCtx.bezierCurveTo(420 * sc, 360 * sc, 310 * sc, 455 * sc, 264 * sc, 575 * sc);
      cCtx.lineTo(350 * sc, 645 * sc);
      cCtx.bezierCurveTo(385 * sc, 535 * sc, 465 * sc, 415 * sc, 555 * sc, 290 * sc);
      cCtx.closePath();
      cCtx.fill();

      cCtx.fillStyle = 'rgba(22, 58, 4, 0.42)';
      cCtx.beginPath();
      cCtx.moveTo(540 * sc, 330 * sc);
      cCtx.bezierCurveTo(465 * sc, 465 * sc, 410 * sc, 575 * sc, 445 * sc, 665 * sc);
      cCtx.lineTo(500 * sc, 710 * sc);
      cCtx.lineTo(585 * sc, 560 * sc);
      cCtx.closePath();
      cCtx.fill();

      // Bright top edge rim highlight on cape wing
      cCtx.strokeStyle = 'rgba(218, 255, 110, 0.55)';
      cCtx.lineWidth = 10 * sc;
      cCtx.beginPath();
      cCtx.moveTo(520 * sc, 252 * sc);
      cCtx.bezierCurveTo(340 * sc, 300 * sc, 190 * sc, 386 * sc, 126 * sc, 466 * sc);
      cCtx.stroke();

      cCtx.restore();

      // Comic dark outline on cape
      cCtx.save();
      traceSegmentsOnCanvas(cCtx, capeSegs, sc);
      cCtx.strokeStyle = '#142914';
      cCtx.lineWidth = 10 * sc;
      cCtx.lineJoin = 'round';
      cCtx.stroke();
      cCtx.restore();

      const capeTex = new THREE.CanvasTexture(capeCanvas);
      capeTex.colorSpace = THREE.SRGBColorSpace;
      capeTex.anisotropy = maxAniso;

      // -- Muscular White Body Texture --
      const bodyCanvas = document.createElement('canvas');
      bodyCanvas.width = TEX_S;
      bodyCanvas.height = TEX_S;
      const bCtx = bodyCanvas.getContext('2d');

      bCtx.fillStyle = '#f8fcf8';
      bCtx.fillRect(0, 0, TEX_S, TEX_S);

      // Soft cel/anatomical shading gradient across suit
      const suitGrad = bCtx.createLinearGradient(420 * sc, 120 * sc, 780 * sc, 860 * sc);
      suitGrad.addColorStop(0, '#ffffff');
      suitGrad.addColorStop(0.55, '#eef5ef');
      suitGrad.addColorStop(1, '#d3e3d6');
      bCtx.fillStyle = suitGrad;
      bCtx.fillRect(0, 0, TEX_S, TEX_S);

      const drawMuscleShadow = (fn, color = 'rgba(130, 162, 138, 0.36)') => {
        bCtx.save();
        bCtx.fillStyle = color;
        bCtx.beginPath();
        fn(bCtx);
        bCtx.fill();
        bCtx.restore();
      };

      const drawLineArt = (fn, lw = 4.2, color = '#213624') => {
        bCtx.save();
        bCtx.strokeStyle = color;
        bCtx.lineWidth = lw * sc;
        bCtx.lineCap = 'round';
        bCtx.lineJoin = 'round';
        bCtx.beginPath();
        fn(bCtx);
        bCtx.stroke();
        bCtx.restore();
      };

      // Head shadow & rim
      drawMuscleShadow((c) => {
        c.moveTo(646 * sc, 122 * sc);
        c.bezierCurveTo(672 * sc, 144 * sc, 668 * sc, 198 * sc, 636 * sc, 232 * sc);
        c.bezierCurveTo(656 * sc, 224 * sc, 674 * sc, 192 * sc, 672 * sc, 146 * sc);
        c.closePath();
      }, 'rgba(128, 160, 136, 0.38)');
      drawLineArt((c) => {
        c.moveTo(582 * sc, 186 * sc);
        c.quadraticCurveTo(596 * sc, 224 * sc, 626 * sc, 234 * sc);
        c.quadraticCurveTo(656 * sc, 226 * sc, 668 * sc, 186 * sc);
      }, 4.5);

      // Pectorals shading & lines
      drawMuscleShadow((c) => {
        c.moveTo(540 * sc, 344 * sc);
        c.quadraticCurveTo(585 * sc, 376 * sc, 625 * sc, 355 * sc);
        c.quadraticCurveTo(668 * sc, 376 * sc, 706 * sc, 344 * sc);
        c.lineTo(698 * sc, 386 * sc);
        c.quadraticCurveTo(626 * sc, 396 * sc, 548 * sc, 382 * sc);
        c.closePath();
      }, 'rgba(135, 168, 142, 0.35)');
      drawLineArt((c) => {
        c.moveTo(544 * sc, 342 * sc);
        c.quadraticCurveTo(586 * sc, 372 * sc, 624 * sc, 354 * sc);
        c.moveTo(626 * sc, 314 * sc);
        c.lineTo(625 * sc, 356 * sc);
        c.moveTo(626 * sc, 354 * sc);
        c.quadraticCurveTo(668 * sc, 372 * sc, 704 * sc, 342 * sc);
      }, 4.0);

      // Collarbone & neck muscles
      drawLineArt((c) => {
        c.moveTo(576 * sc, 256 * sc);
        c.quadraticCurveTo(605 * sc, 286 * sc, 625 * sc, 286 * sc);
        c.quadraticCurveTo(648 * sc, 286 * sc, 668 * sc, 258 * sc);
      }, 3.6);

      // 6-pack abs & obliques
      drawMuscleShadow((c) => {
        c.rect(584 * sc, 392 * sc, 82 * sc, 108 * sc);
      }, 'rgba(155, 185, 162, 0.14)');
      drawLineArt((c) => {
        c.moveTo(625 * sc, 374 * sc);
        c.lineTo(625 * sc, 488 * sc);
        // 3 ab rows
        [398, 430, 462].forEach((y) => {
          c.moveTo(592 * sc, y * sc);
          c.quadraticCurveTo(625 * sc, (y + 8) * sc, 658 * sc, y * sc);
        });
        // Oblique contours
        c.moveTo(586 * sc, 382 * sc);
        c.quadraticCurveTo(578 * sc, 442 * sc, 594 * sc, 494 * sc);
        c.moveTo(664 * sc, 382 * sc);
        c.quadraticCurveTo(672 * sc, 442 * sc, 656 * sc, 494 * sc);
      }, 3.2);

      // Deltoids & arms muscle contour
      drawLineArt((c) => {
        c.moveTo(532 * sc, 284 * sc);
        c.quadraticCurveTo(510 * sc, 326 * sc, 526 * sc, 350 * sc);
        c.moveTo(718 * sc, 286 * sc);
        c.quadraticCurveTo(738 * sc, 326 * sc, 718 * sc, 350 * sc);
        // Bicep/forearm fold
        c.moveTo(432 * sc, 386 * sc);
        c.quadraticCurveTo(458 * sc, 394 * sc, 478 * sc, 404 * sc);
        c.moveTo(784 * sc, 396 * sc);
        c.quadraticCurveTo(764 * sc, 406 * sc, 748 * sc, 418 * sc);
      }, 3.6);

      // Thigh quads & knees
      drawLineArt((c) => {
        c.moveTo(562 * sc, 558 * sc);
        c.quadraticCurveTo(548 * sc, 620 * sc, 540 * sc, 668 * sc);
        c.moveTo(678 * sc, 560 * sc);
        c.quadraticCurveTo(674 * sc, 624 * sc, 668 * sc, 672 * sc);
        c.moveTo(526 * sc, 672 * sc);
        c.quadraticCurveTo(542 * sc, 684 * sc, 556 * sc, 670 * sc);
        c.moveTo(646 * sc, 672 * sc);
        c.quadraticCurveTo(664 * sc, 684 * sc, 682 * sc, 670 * sc);
      }, 3.4);

      // Outer body & armpit comic ink outlines
      bCtx.save();
      bCtx.strokeStyle = '#142914';
      bCtx.lineWidth = 9.5 * sc;
      bCtx.lineJoin = 'round';
      traceSegmentsOnCanvas(bCtx, bodySegs, sc);
      bCtx.stroke();
      traceSegmentsOnCanvas(bCtx, leftArmHole, sc);
      bCtx.stroke();
      traceSegmentsOnCanvas(bCtx, rightArmHole, sc);
      bCtx.stroke();
      bCtx.restore();

      const bodyTex = new THREE.CanvasTexture(bodyCanvas);
      bodyTex.colorSpace = THREE.SRGBColorSpace;
      bodyTex.anisotropy = maxAniso;

      // -- Boots & Collar Green Texture --
      const greenAccCanvas = document.createElement('canvas');
      greenAccCanvas.width = TEX_S;
      greenAccCanvas.height = TEX_S;
      const gCtx = greenAccCanvas.getContext('2d');

      const bootGrad = gCtx.createLinearGradient(450 * sc, 720 * sc, 760 * sc, 910 * sc);
      bootGrad.addColorStop(0, '#a8ec26');
      bootGrad.addColorStop(0.45, '#72c912');
      bootGrad.addColorStop(1, '#48930a');
      gCtx.fillStyle = bootGrad;
      gCtx.fillRect(0, 0, TEX_S, TEX_S);

      // Specular vertical shine on boots
      gCtx.fillStyle = 'rgba(225, 255, 130, 0.38)';
      gCtx.beginPath();
      gCtx.ellipse(508 * sc, 818 * sc, 11 * sc, 56 * sc, 0.14, 0, Math.PI * 2);
      gCtx.fill();
      gCtx.beginPath();
      gCtx.ellipse(654 * sc, 816 * sc, 11 * sc, 54 * sc, -0.06, 0, Math.PI * 2);
      gCtx.fill();

      // Outlines on boots & collar
      gCtx.strokeStyle = '#142914';
      gCtx.lineWidth = 9 * sc;
      gCtx.lineJoin = 'round';
      [leftBootSegs, rightBootSegs, leftCollarSegs, rightCollarSegs].forEach((segs) => {
        traceSegmentsOnCanvas(gCtx, segs, sc);
        gCtx.stroke();
      });

      const greenAccTex = new THREE.CanvasTexture(greenAccCanvas);
      greenAccTex.colorSpace = THREE.SRGBColorSpace;
      greenAccTex.anisotropy = maxAniso;

      // 5.3 Build 3D Extruded Geometries for Each Layer
      const capeGeo = makeHeroExtrudeGeo(buildShapeFromSegments(capeSegs), 0.012, 0.005, 0.004, targetHeight3D);
      const bodyGeo = makeHeroExtrudeGeo(buildShapeFromSegments(bodySegs, [leftArmHole, rightArmHole]), 0.018, 0.007, 0.005, targetHeight3D);
      const leftBootGeo = makeHeroExtrudeGeo(buildShapeFromSegments(leftBootSegs), 0.012, 0.005, 0.004, targetHeight3D);
      const rightBootGeo = makeHeroExtrudeGeo(buildShapeFromSegments(rightBootSegs), 0.012, 0.005, 0.004, targetHeight3D);
      const leftCollarGeo = makeHeroExtrudeGeo(buildShapeFromSegments(leftCollarSegs), 0.011, 0.005, 0.004, targetHeight3D);
      const rightCollarGeo = makeHeroExtrudeGeo(buildShapeFromSegments(rightCollarSegs), 0.011, 0.005, 0.004, targetHeight3D);

      const capeMat = new THREE.MeshPhysicalMaterial({
        map: capeTex,
        emissive: 0x266b08,
        emissiveIntensity: 0.22,
        roughness: 0.24,
        metalness: 0.04,
        clearcoat: 0.85,
        clearcoatRoughness: 0.08
      });

      const bodyMat = new THREE.MeshPhysicalMaterial({
        map: bodyTex,
        emissive: 0xdfffe2,
        emissiveIntensity: 0.14,
        roughness: 0.18,
        metalness: 0.02,
        clearcoat: 1.0,
        clearcoatRoughness: 0.06
      });

      const greenAccMat = new THREE.MeshPhysicalMaterial({
        map: greenAccTex,
        emissive: 0x308c0a,
        emissiveIntensity: 0.24,
        roughness: 0.20,
        metalness: 0.05,
        clearcoat: 0.9,
        clearcoatRoughness: 0.07
      });

      return {
        createHeroGroup: () => {
          const hero = new THREE.Group();

          const capeMesh = new THREE.Mesh(capeGeo, capeMat);
          capeMesh.position.z = TOTAL_HALF_Z + 0.002;
          hero.add(capeMesh);

          const bodyMesh = new THREE.Mesh(bodyGeo, bodyMat);
          bodyMesh.position.z = TOTAL_HALF_Z + 0.014;
          hero.add(bodyMesh);

          const lBoot = new THREE.Mesh(leftBootGeo, greenAccMat);
          lBoot.position.z = TOTAL_HALF_Z + 0.024;
          hero.add(lBoot);

          const rBoot = new THREE.Mesh(rightBootGeo, greenAccMat);
          rBoot.position.z = TOTAL_HALF_Z + 0.024;
          hero.add(rBoot);

          const lCollar = new THREE.Mesh(leftCollarGeo, greenAccMat);
          lCollar.position.z = TOTAL_HALF_Z + 0.024;
          hero.add(lCollar);

          const rCollar = new THREE.Mesh(rightCollarGeo, greenAccMat);
          rCollar.position.z = TOTAL_HALF_Z + 0.024;
          hero.add(rCollar);

          return hero;
        }
      };
    }

    // 6. ASSEMBLE DOUBLE-SIDED 3D BADGE MODEL
    const badgeRoot = new THREE.Group();
    scene.add(badgeRoot);

    const smokyGreenTex = createSmokyGreenTexture();
    const { mapTex: typoColorTex, bumpTex: typoBumpTex, heroPosX3D } = createTypographyLayerTextures();

    // 6A. Extruded Physical Pill Body
    const bodyShape = createRoundedRectShape(BADGE_W, BADGE_H, CORNER_R);
    const pillBodyGeo = new THREE.ExtrudeGeometry(bodyShape, {
      depth: BODY_DEPTH,
      bevelEnabled: true,
      bevelThickness: BEVEL_THICKNESS,
      bevelSize: BEVEL_SIZE,
      bevelSegments: 14,
      curveSegments: 56
    });
    pillBodyGeo.center();

    {
      const pos = pillBodyGeo.attributes.position;
      const uv = pillBodyGeo.attributes.uv;
      const totalW = BADGE_W + BEVEL_SIZE * 2;
      const totalH = BADGE_H + BEVEL_SIZE * 2;
      for (let i = 0; i < pos.count; i++) {
        uv.setXY(i, (pos.getX(i) / totalW) + 0.5, (pos.getY(i) / totalH) + 0.5);
      }
      uv.needsUpdate = true;
    }

    const pillBodyMat = new THREE.MeshPhysicalMaterial({
      map: smokyGreenTex,
      color: 0xffffff,
      roughness: 0.16,
      metalness: 0.08,
      clearcoat: 1.0,
      clearcoatRoughness: 0.06,
      ior: 1.52,
      reflectivity: 0.92,
      envMapIntensity: 1.3
    });

    badgeRoot.add(new THREE.Mesh(pillBodyGeo, pillBodyMat));

    // 6B. 3D Neon Lime-Green Perimeter Bevel Tubes
    const neonGreenMat = new THREE.MeshPhysicalMaterial({
      color: 0x62ff47,
      emissive: 0x32e01d,
      emissiveIntensity: 1.15,
      roughness: 0.14,
      metalness: 0.05,
      clearcoat: 1.0,
      clearcoatRoughness: 0.05,
      envMapIntensity: 1.1
    });

    function createRimTube(w, h, r, zPos, tubeRadius) {
      const pts = createRoundedRectCurvePoints(w, h, r, zPos);
      const curve = new THREE.CatmullRomCurve3(pts, true);
      const geo = new THREE.TubeGeometry(curve, 180, tubeRadius, 14, true);
      return new THREE.Mesh(geo, neonGreenMat);
    }

    const rimZ = BODY_DEPTH / 2 + BEVEL_THICKNESS * 0.64;
    badgeRoot.add(createRimTube(BADGE_W + 0.022, BADGE_H + 0.022, CORNER_R + 0.011, rimZ, 0.022));
    badgeRoot.add(createRimTube(BADGE_W + 0.022, BADGE_H + 0.022, CORNER_R + 0.011, -rimZ, 0.022));
    badgeRoot.add(createRimTube(BADGE_W + BEVEL_SIZE * 1.85, BADGE_H + BEVEL_SIZE * 1.85, CORNER_R + BEVEL_SIZE * 0.92, 0, 0.018));

    // 6C. Front & Back Face Details (Typography + Multi-Layered 3D Hero)
    const facePlateShape = createRoundedRectShape(BADGE_W - 0.04, BADGE_H - 0.04, CORNER_R - 0.02);
    const facePlateGeo = new THREE.ShapeGeometry(facePlateShape, 48);
    {
      const pos = facePlateGeo.attributes.position;
      const uv = facePlateGeo.attributes.uv;
      for (let i = 0; i < pos.count; i++) {
        uv.setXY(i, (pos.getX(i) / BADGE_W) + 0.5, (pos.getY(i) / BADGE_H) + 0.5);
      }
      uv.needsUpdate = true;
    }

    const typoMaterial = new THREE.MeshPhysicalMaterial({
      map: typoColorTex,
      bumpMap: typoBumpTex,
      bumpScale: 0.008,
      emissive: 0xeaffea,
      emissiveMap: typoColorTex,
      emissiveIntensity: 0.45,
      transparent: true,
      alphaTest: 0.01,
      roughness: 0.15,
      metalness: 0.02,
      clearcoat: 1.0,
      clearcoatRoughness: 0.05,
      depthWrite: false
    });

    const heroAssets = createHeroAssets(BADGE_H * 0.86);

    function createFaceDetailGroup() {
      const group = new THREE.Group();

      const typoMesh = new THREE.Mesh(facePlateGeo, typoMaterial);
      typoMesh.position.z = TOTAL_HALF_Z + 0.0025;
      group.add(typoMesh);

      const heroMeshGroup = heroAssets.createHeroGroup();
      heroMeshGroup.position.set(heroPosX3D, -0.01, 0);
      group.add(heroMeshGroup);

      return group;
    }

    badgeRoot.add(createFaceDetailGroup());

    const backFace = createFaceDetailGroup();
    backFace.rotation.y = Math.PI;
    badgeRoot.add(backFace);

    // 6D. Outer Green Neon Halo on Pure #FFFFFF Background
    const haloMat = new THREE.MeshBasicMaterial({
      map: createHaloTexture(),
      transparent: true,
      opacity: 0.95,
      depthWrite: false,
      side: THREE.DoubleSide
    });
    const haloMesh = new THREE.Mesh(new THREE.PlaneGeometry(4.8, 2.3), haloMat);
    haloMesh.renderOrder = -2;
    badgeRoot.add(haloMesh);

    const auraMat = new THREE.SpriteMaterial({
      map: createBillboardAuraTexture(),
      transparent: true,
      opacity: 0.42,
      depthWrite: false
    });
    const auraSprite = new THREE.Sprite(auraMat);
    auraSprite.scale.set(4.6, 4.4, 1);
    auraSprite.renderOrder = -3;
    scene.add(auraSprite);

    // 7. 360° ORBIT CONTROLS, IDLE FLOAT, HOVER MICRO-TILT & DOUBLE-CLICK RESET
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.copy(INITIAL_TARGET);
    controls.enableDamping = true;
    controls.dampingFactor = 0.065;
    controls.enablePan = false;
    controls.rotateSpeed = 0.85;
    controls.zoomSpeed = 0.9;
    controls.minDistance = 2.0;
    controls.maxDistance = 8.8;
    controls.update();

    let isDragging = false;
    let isPointerInside = false;
    let pointerNX = 0;
    let pointerNY = 0;
    let isResetting = false;

    const resetStartCam = new THREE.Vector3();
    const resetStartTarget = new THREE.Vector3();
    let resetProgress = 0;

    controls.addEventListener('start', () => {
      isDragging = true;
      isResetting = false;
    });
    controls.addEventListener('end', () => {
      isDragging = false;
    });

    const domEl = renderer.domElement;
    domEl.addEventListener('pointermove', (e) => {
      isPointerInside = true;
      pointerNX = (e.clientX / window.innerWidth) * 2 - 1;
      pointerNY = (e.clientY / window.innerHeight) * 2 - 1;
    });
    domEl.addEventListener('pointerleave', () => {
      isPointerInside = false;
      pointerNX = 0;
      pointerNY = 0;
    });
    domEl.addEventListener('dblclick', () => {
      resetStartCam.copy(camera.position);
      resetStartTarget.copy(controls.target);
      resetProgress = 0;
      isResetting = true;
    });

    // 8. RESIZE & ANIMATION LOOP
    window.addEventListener('resize', () => {
      const w = window.innerWidth;
      const h = window.innerHeight;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    });

    const clock = new THREE.Clock();
    const viewDir = new THREE.Vector3();

    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), 0.05);
      const elapsed = clock.elapsedTime;

      if (isResetting) {
        resetProgress = Math.min(resetProgress + dt * 2.4, 1);
        const ease = 1 - Math.pow(1 - resetProgress, 3);
        camera.position.lerpVectors(resetStartCam, INITIAL_CAM_POS, ease);
        controls.target.lerpVectors(resetStartTarget, INITIAL_TARGET, ease);
        if (resetProgress >= 1) isResetting = false;
      }

      const idleFloatY = Math.sin(elapsed * 1.45) * 0.022;
      const idleRotX = Math.sin(elapsed * 0.95) * 0.012;
      const idleRotY = Math.cos(elapsed * 0.75) * 0.015;

      const targetTiltY = (!isDragging && isPointerInside) ? pointerNX * 0.085 : 0;
      const targetTiltX = (!isDragging && isPointerInside) ? pointerNY * 0.065 : 0;

      badgeRoot.position.y = THREE.MathUtils.lerp(badgeRoot.position.y, idleFloatY, 0.08);
      badgeRoot.rotation.x = THREE.MathUtils.lerp(badgeRoot.rotation.x, targetTiltX + idleRotX, 0.07);
      badgeRoot.rotation.y = THREE.MathUtils.lerp(badgeRoot.rotation.y, targetTiltY + idleRotY, 0.07);

      auraSprite.position.y = badgeRoot.position.y;
      viewDir.subVectors(camera.position, controls.target).normalize();
      const edgeFactor = 1.0 - Math.abs(viewDir.z);
      haloMat.opacity = 0.95 * (1.0 - edgeFactor * 0.65);
      auraMat.opacity = 0.35 + edgeFactor * 0.28;

      controls.update();
      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>

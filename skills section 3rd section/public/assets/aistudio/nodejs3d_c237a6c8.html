<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Node.js — 3D Interactive Model</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #ffffff;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: grab;
      outline: none;
    }
    canvas:active { cursor: grabbing; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // 1. RENDERER, SCENE & CAMERA
    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      alpha: true,
      powerPreference: 'high-performance'
    });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.08;
    renderer.setClearColor(0xffffff, 0);
    document.body.appendChild(renderer.domElement);

    const scene = new THREE.Scene();

    const INITIAL_CAM_POS = new THREE.Vector3(0, 0, 4.25);
    const INITIAL_TARGET = new THREE.Vector3(0, 0, 0);

    const camera = new THREE.PerspectiveCamera(36, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.copy(INITIAL_CAM_POS);

    // 2. PROCEDURAL 360° STUDIO ENVIRONMENT (PMREM) & BALANCED LIGHTING
    function createStudioEnv(glRenderer) {
      const pmrem = new THREE.PMREMGenerator(glRenderer);
      pmrem.compileEquirectangularShader();
      const envScene = new THREE.Scene();
      envScene.background = new THREE.Color(0x062b18);

      const addPanel = (w, h, color, intensity, pos) => {
        const geo = new THREE.PlaneGeometry(w, h);
        const mat = new THREE.MeshBasicMaterial({
          color: new THREE.Color(color).multiplyScalar(intensity),
          side: THREE.DoubleSide
        });
        const mesh = new THREE.Mesh(geo, mat);
        mesh.position.set(...pos);
        mesh.lookAt(0, 0, 0);
        envScene.add(mesh);
      };

      addPanel(10, 5, 0xffffff, 2.2, [0, 3.2, 8]);
      addPanel(10, 5, 0xc8ffda, 1.4, [0, -3.5, 8]);
      addPanel(10, 5, 0xffffff, 2.2, [0, 3.2, -8]);
      addPanel(10, 5, 0xc8ffda, 1.4, [0, -3.5, -8]);
      addPanel(12, 6, 0xe8fff0, 2.0, [0, 8.5, 0]);
      addPanel(12, 6, 0x8bffb4, 1.1, [0, -8.5, 0]);
      addPanel(6, 8, 0xb8ffd0, 1.6, [9, 0.5, 0]);
      addPanel(6, 8, 0xb8ffd0, 1.6, [-9, 0.5, 0]);

      const rt = pmrem.fromScene(envScene, 0.04);
      pmrem.dispose();
      return rt.texture;
    }

    scene.environment = createStudioEnv(renderer);
    scene.add(new THREE.AmbientLight(0xdafce6, 0.8));

    const addDirLight = (color, intensity, pos) => {
      const l = new THREE.DirectionalLight(color, intensity);
      l.position.set(...pos);
      scene.add(l);
    };
    addDirLight(0xffffff, 1.35, [2.5, 3.5, 5.5]);
    addDirLight(0x88ffb4, 0.65, [-3.5, -2.0, 4.5]);
    addDirLight(0xffffff, 1.35, [-2.5, 3.5, -5.5]);
    addDirLight(0x88ffb4, 0.65, [3.5, -2.0, -4.5]);

    // 3. EXACT BADGE DIMENSIONS & GEOMETRY HELPERS
    const BADGE_W = 3.00;
    const BADGE_H = 1.00;
    const CORNER_R = 0.32;
    const BODY_DEPTH = 0.12;
    const BEVEL_THICKNESS = 0.042;
    const BEVEL_SIZE = 0.036;
    const TOTAL_HALF_Z = BODY_DEPTH / 2 + BEVEL_THICKNESS;

    function createRoundedRectShape(w, h, r) {
      const hw = w / 2;
      const hh = h / 2;
      const rad = Math.min(r, hw, hh);
      const s = new THREE.Shape();
      s.moveTo(-hw + rad, -hh);
      s.lineTo(hw - rad, -hh);
      s.absarc(hw - rad, -hh + rad, rad, -Math.PI / 2, 0, false);
      s.lineTo(hw, hh - rad);
      s.absarc(hw - rad, hh - rad, rad, 0, Math.PI / 2, false);
      s.lineTo(-hw + rad, hh);
      s.absarc(-hw + rad, hh - rad, rad, Math.PI / 2, Math.PI, false);
      s.lineTo(-hw, -hh + rad);
      s.absarc(-hw + rad, -hh + rad, rad, Math.PI, Math.PI * 1.5, false);
      return s;
    }

    function createRoundedRectCurvePoints(w, h, r, z = 0) {
      const hw = w / 2;
      const hh = h / 2;
      const rad = Math.min(r, hw, hh);
      const pts = [];
      const cornerSteps = 22;
      const straightSteps = 10;

      const pushLine = (x0, y0, x1, y1) => {
        for (let i = 0; i < straightSteps; i++) {
          const t = i / straightSteps;
          pts.push(new THREE.Vector3(x0 + (x1 - x0) * t, y0 + (y1 - y0) * t, z));
        }
      };
      const pushArc = (cx, cy, a0, a1) => {
        for (let i = 0; i < cornerSteps; i++) {
          const a = a0 + (a1 - a0) * (i / cornerSteps);
          pts.push(new THREE.Vector3(cx + Math.cos(a) * rad, cy + Math.sin(a) * rad, z));
        }
      };

      pushLine(-hw + rad, -hh, hw - rad, -hh);
      pushArc(hw - rad, -hh + rad, -Math.PI / 2, 0);
      pushLine(hw, -hh + rad, hw, hh - rad);
      pushArc(hw - rad, hh - rad, 0, Math.PI / 2);
      pushLine(hw - rad, hh, -hw + rad, hh);
      pushArc(-hw + rad, hh - rad, Math.PI / 2, Math.PI);
      pushLine(-hw, hh - rad, -hw, -hh + rad);
      pushArc(-hw + rad, -hh + rad, Math.PI, Math.PI * 1.5);
      return pts;
    }

    function strokeRoundedRectCanvas(ctx, x, y, w, h, r) {
      const rad = Math.min(r, w / 2, h / 2);
      ctx.beginPath();
      ctx.moveTo(x + rad, y);
      ctx.lineTo(x + w - rad, y);
      ctx.arcTo(x + w, y, x + w, y + rad, rad);
      ctx.lineTo(x + w, y + h - rad);
      ctx.arcTo(x + w, y + h, x + w - rad, y + h, rad);
      ctx.lineTo(x + rad, y + h);
      ctx.arcTo(x, y + h, x, y + h - rad, rad);
      ctx.lineTo(x, y + rad);
      ctx.arcTo(x, y, x + rad, y, rad);
      ctx.closePath();
    }

    // 4. HIGH-DPI PROCEDURAL TEXTURES (2048px+ SUPERSAMPLED, SAFARI-SAFE)
    const maxAniso = renderer.capabilities.getMaxAnisotropy();

    function createSmokyGreenTexture() {
      const W = 2560;
      const H = 854;
      const canvas = document.createElement('canvas');
      canvas.width = W;
      canvas.height = H;
      const ctx = canvas.getContext('2d');

      const bg = ctx.createLinearGradient(0, 0, W, H);
      bg.addColorStop(0, '#056e3b');
      bg.addColorStop(0.35, '#045930');
      bg.addColorStop(0.7, '#034a27');
      bg.addColorStop(1, '#056837');
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, W, H);

      let seed = 4219;
      const rand = () => {
        seed = (seed * 16807) % 2147483647;
        return (seed - 1) / 2147483646;
      };

      for (let i = 0; i < 65; i++) {
        const cx = rand() * W;
        const cy = rand() * H;
        const rx = 160 + rand() * 420;
        const ry = 70 + rand() * 190;
        const angle = (rand() - 0.5) * 0.85;
        const isLight = rand() > 0.44;

        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(angle);
        ctx.scale(1, ry / rx);
        const grad = ctx.createRadialGradient(0, 0, 0, 0, 0, rx);
        if (isLight) {
          grad.addColorStop(0, 'rgba(28, 196, 98, 0.11)');
          grad.addColorStop(0.55, 'rgba(16, 150, 74, 0.045)');
          grad.addColorStop(1, 'rgba(0, 90, 42, 0)');
        } else {
          grad.addColorStop(0, 'rgba(0, 32, 16, 0.16)');
          grad.addColorStop(0.6, 'rgba(0, 44, 22, 0.07)');
          grad.addColorStop(1, 'rgba(0, 44, 22, 0)');
        }
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(0, 0, rx, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      // Soft inner neon green edge glow
      const pad = 22;
      const rPx = (CORNER_R / BADGE_H) * (H - pad * 2);
      ctx.save();
      strokeRoundedRectCanvas(ctx, pad, pad, W - pad * 2, H - pad * 2, rPx);
      ctx.shadowColor = 'rgba(0, 255, 85, 0.85)';
      ctx.shadowBlur = 78;
      ctx.lineWidth = 20;
      ctx.strokeStyle = 'rgba(0, 245, 78, 0.55)';
      ctx.stroke();

      ctx.shadowBlur = 32;
      ctx.lineWidth = 10;
      ctx.strokeStyle = 'rgba(38, 255, 102, 0.72)';
      ctx.stroke();
      ctx.restore();

      const tex = new THREE.CanvasTexture(canvas);
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.anisotropy = maxAniso;
      return tex;
    }

    function createTypographyLayerTextures() {
      const W = 2560;
      const H = 854;

      const canvas = document.createElement('canvas');
      canvas.width = W;
      canvas.height = H;
      const ctx = canvas.getContext('2d');

      const bumpCanvas = document.createElement('canvas');
      bumpCanvas.width = W;
      bumpCanvas.height = H;
      const bCtx = bumpCanvas.getContext('2d');

      ctx.clearRect(0, 0, W, H);
      bCtx.fillStyle = '#000000';
      bCtx.fillRect(0, 0, W, H);

      const fontSize = Math.round(H * 0.495);
      const fontSpec = `600 ${fontSize}px "Inter", "SF Pro Display", "Segoe UI", "Roboto", "Helvetica Neue", Arial, sans-serif`;

      ctx.font = fontSpec;
      ctx.textAlign = 'left';
      ctx.textBaseline = 'alphabetic';

      const text = 'Node.js';
      const textX = W * 0.392;
      const textY = H * 0.642;

      ctx.save();
      ctx.shadowColor = 'rgba(130, 255, 175, 0.50)';
      ctx.shadowBlur = 16;
      ctx.fillStyle = '#ECFFF2';
      ctx.fillText(text, textX, textY);
      ctx.restore();

      ctx.save();
      ctx.shadowColor = 'rgba(255, 255, 255, 0.4)';
      ctx.shadowBlur = 4;
      ctx.fillStyle = '#F3FFF7';
      ctx.fillText(text, textX, textY);
      ctx.restore();

      bCtx.font = fontSpec;
      bCtx.textAlign = 'left';
      bCtx.textBaseline = 'alphabetic';
      bCtx.shadowColor = 'rgba(200, 200, 200, 0.85)';
      bCtx.shadowBlur = 6;
      bCtx.fillStyle = '#ffffff';
      bCtx.fillText(text, textX, textY);

      const mapTex = new THREE.CanvasTexture(canvas);
      mapTex.colorSpace = THREE.SRGBColorSpace;
      mapTex.anisotropy = maxAniso;

      const bumpTex = new THREE.CanvasTexture(bumpCanvas);
      bumpTex.anisotropy = maxAniso;

      return { mapTex, bumpTex };
    }

    function createHaloTexture() {
      const W = 2048;
      const H = 1024;
      const canvas = document.createElement('canvas');
      canvas.width = W;
      canvas.height = H;
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, W, H);

      const rectW = W * 0.65;
      const rectH = H * 0.43;
      const rectX = (W - rectW) / 2;
      const rectY = (H - rectH) / 2;
      const rPx = (CORNER_R / BADGE_H) * rectH;

      const passes = [
        { blur: 130, alpha: 0.24, lw: 34 },
        { blur: 82,  alpha: 0.34, lw: 26 },
        { blur: 46,  alpha: 0.44, lw: 18 },
        { blur: 22,  alpha: 0.52, lw: 12 }
      ];

      passes.forEach((p) => {
        ctx.save();
        strokeRoundedRectCanvas(ctx, rectX, rectY, rectW, rectH, rPx);
        ctx.shadowColor = `rgba(0, 238, 88, ${p.alpha})`;
        ctx.shadowBlur = p.blur;
        ctx.lineWidth = p.lw;
        ctx.strokeStyle = `rgba(0, 238, 88, ${p.alpha * 0.55})`;
        ctx.stroke();
        ctx.restore();
      });

      const tex = new THREE.CanvasTexture(canvas);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    function createBillboardAuraTexture() {
      const S = 1024;
      const canvas = document.createElement('canvas');
      canvas.width = S;
      canvas.height = S;
      const ctx = canvas.getContext('2d');

      ctx.save();
      ctx.translate(S / 2, S / 2);
      ctx.scale(1.0, 0.52);
      const grad = ctx.createRadialGradient(0, 0, S * 0.14, 0, 0, S * 0.48);
      grad.addColorStop(0, 'rgba(0, 240, 90, 0.30)');
      grad.addColorStop(0.45, 'rgba(0, 240, 90, 0.14)');
      grad.addColorStop(0.75, 'rgba(0, 240, 90, 0.04)');
      grad.addColorStop(1, 'rgba(0, 240, 90, 0.0)');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(0, 0, S * 0.48, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      const tex = new THREE.CanvasTexture(canvas);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    // 5. VECTOR HELPERS FOR 3D NODE.JS HEXAGON + JS EMBLEM
    function filletPolyline2D(pts, radii, steps = 10) {
      const out = [pts[0].clone()];
      for (let i = 1; i < pts.length - 1; i++) {
        const p0 = pts[i - 1];
        const p1 = pts[i];
        const p2 = pts[i + 1];
        const r = radii[i - 1];
        const v1 = new THREE.Vector2().subVectors(p0, p1);
        const v2 = new THREE.Vector2().subVectors(p2, p1);
        const l1 = v1.length();
        const l2 = v2.length();
        const u1 = v1.clone().divideScalar(l1);
        const u2 = v2.clone().divideScalar(l2);
        const cosA = THREE.MathUtils.clamp(u1.dot(u2), -0.999, 0.999);
        const ang = Math.acos(cosA);
        const tanHalf = Math.tan(ang / 2);
        const d = Math.min(r / Math.max(tanHalf, 1e-4), l1 * 0.45, l2 * 0.45);
        const aPt = p1.clone().addScaledVector(u1, d);
        const bPt = p1.clone().addScaledVector(u2, d);

        for (let s = 0; s <= steps; s++) {
          const t = s / steps;
          const omt = 1 - t;
          const q = new THREE.Vector2(
            omt * omt * aPt.x + 2 * omt * t * p1.x + t * t * bPt.x,
            omt * omt * aPt.y + 2 * omt * t * p1.y + t * t * bPt.y
          );
          out.push(q);
        }
      }
      out.push(pts[pts.length - 1].clone());
      return out;
    }

    function samplePolyline2D(pts, step) {
      const res = [pts[0].clone()];
      for (let i = 0; i < pts.length - 1; i++) {
        const a = pts[i];
        const b = pts[i + 1];
        const dist = a.distanceTo(b);
        const n = Math.max(1, Math.ceil(dist / step));
        for (let k = 1; k <= n; k++) {
          res.push(new THREE.Vector2().lerpVectors(a, b, k / n));
        }
      }
      return res;
    }

    function sampleCatmullRom2D(pts, samplesPerSeg = 10) {
      const p = [
        pts[0].clone().multiplyScalar(2).sub(pts[1]),
        ...pts,
        pts[pts.length - 1].clone().multiplyScalar(2).sub(pts[pts.length - 2])
      ];
      const out = [];
      for (let i = 1; i < p.length - 2; i++) {
        for (let k = 0; k < samplesPerSeg; k++) {
          const t = k / samplesPerSeg;
          const t2 = t * t;
          const t3 = t2 * t;
          const x = 0.5 * (
            (2 * p[i].x) +
            (-p[i - 1].x + p[i + 1].x) * t +
            (2 * p[i - 1].x - 5 * p[i].x + 4 * p[i + 1].x - p[i + 2].x) * t2 +
            (-p[i - 1].x + 3 * p[i].x - 3 * p[i + 1].x + p[i + 2].x) * t3
          );
          const y = 0.5 * (
            (2 * p[i].y) +
            (-p[i - 1].y + p[i + 1].y) * t +
            (2 * p[i - 1].y - 5 * p[i].y + 4 * p[i + 1].y - p[i + 2].y) * t2 +
            (-p[i - 1].y + 3 * p[i].y - 3 * p[i + 1].y + p[i + 2].y) * t3
          );
          out.push(new THREE.Vector2(x, y));
        }
      }
      out.push(pts[pts.length - 1].clone());
      return out;
    }

    function offsetRibbonToShape(centerPts, halfW, capStart = 'flat', capEnd = 'flat') {
      const n = centerPts.length;
      const left = [];
      const right = [];

      for (let i = 0; i < n; i++) {
        let t;
        if (i === 0) {
          t = new THREE.Vector2().subVectors(centerPts[1], centerPts[0]);
        } else if (i === n - 1) {
          t = new THREE.Vector2().subVectors(centerPts[n - 1], centerPts[n - 2]);
        } else {
          t = new THREE.Vector2().subVectors(centerPts[i + 1], centerPts[i - 1]);
        }
        const tl = t.length();
        if (tl < 1e-8) t.set(1, 0);
        else t.divideScalar(tl);

        const norm = new THREE.Vector2(-t.y, t.x);
        left.push(centerPts[i].clone().addScaledVector(norm, halfW));
        right.push(centerPts[i].clone().addScaledVector(norm, -halfW));
      }

      const poly = [...left];

      const pushRoundCap = (center, fromPt, toPt, tangentDir) => {
        const a0 = Math.atan2(fromPt.y - center.y, fromPt.x - center.x);
        const a1 = Math.atan2(toPt.y - center.y, toPt.x - center.x);
        let da = ((a1 - a0 + Math.PI) % (2 * Math.PI) + 2 * Math.PI) % (2 * Math.PI) - Math.PI;
        const midA = a0 + da / 2;
        if (Math.cos(midA) * tangentDir.x + Math.sin(midA) * tangentDir.y < 0) {
          da = da > 0 ? da - 2 * Math.PI : da + 2 * Math.PI;
        }
        for (let k = 1; k < 8; k++) {
          const a = a0 + da * (k / 8);
          poly.push(new THREE.Vector2(center.x + Math.cos(a) * halfW, center.y + Math.sin(a) * halfW));
        }
      };

      if (capEnd === 'round') {
        const tEnd = new THREE.Vector2().subVectors(centerPts[n - 1], centerPts[n - 2]);
        pushRoundCap(centerPts[n - 1], left[n - 1], right[n - 1], tEnd);
      }

      for (let i = right.length - 1; i >= 0; i--) {
        poly.push(right[i]);
      }

      if (capStart === 'round') {
        const tStart = new THREE.Vector2().subVectors(centerPts[0], centerPts[1]);
        pushRoundCap(centerPts[0], right[0], left[0], tStart);
      }

      const shape = new THREE.Shape();
      shape.moveTo(poly[0].x, poly[0].y);
      for (let i = 1; i < poly.length; i++) {
        shape.lineTo(poly[i].x, poly[i].y);
      }
      shape.closePath();
      return shape;
    }

    function createNodeEmblemGeometries() {
      // Reference unit grid (cx = 30.2, cy = 39.0, R = 32.5) mapped to 3D badge coordinates
      const cx = 30.2;
      const cy = 39.0;
      const R_ref = 32.5;
      const R_3d = 0.342;
      const S = R_3d / R_ref;

      const to3D = (x, y) => new THREE.Vector2((x - cx) * S, -(y - cy) * S);
      const hexPt = (deg) => {
        const a = (deg * Math.PI) / 180;
        return new THREE.Vector2(
          (R_ref * Math.cos(a)) * S,
          -(R_ref * Math.sin(a)) * S
        );
      };

      // Hexagon + J path (from bottom-left gap around clockwise through J stem)
      const pBot = hexPt(90);
      const pBL = hexPt(150);
      const pGap = new THREE.Vector2().lerpVectors(pBot, pBL, 0.34);
      const pJTurn = new THREE.Vector2().lerpVectors(pBL, pBot, 0.43);

      const hexPts = [
        pGap,
        pBot,
        hexPt(30),
        hexPt(-30),
        hexPt(-90),
        hexPt(210),
        pBL,
        pJTurn,
        to3D(cx - 12.4, cy + 19.2),
        to3D(cx - 12.4, cy - 14.0)
      ];
      const radii = [3.5, 3.5, 3.5, 3.5, 3.5, 3.5, 4.2, 4.2].map((r) => r * S);
      const hexSmooth = samplePolyline2D(filletPolyline2D(hexPts, radii, 10), 0.6 * S);
      const hexShape = offsetRibbonToShape(hexSmooth, 2.08 * S, 'round', 'flat');

      // S path
      const sCtrl = [
        to3D(45.6, 31.6),
        to3D(45.1, 29.0),
        to3D(42.2, 26.9),
        to3D(35.8, 26.2),
        to3D(29.6, 28.6),
        to3D(28.5, 33.8),
        to3D(33.8, 37.6),
        to3D(41.2, 39.8),
        to3D(45.8, 43.8),
        to3D(44.5, 48.8),
        to3D(37.0, 51.2),
        to3D(29.6, 49.4),
        to3D(27.4, 47.4),
        to3D(27.0, 45.2)
      ];
      const sSmooth = sampleCatmullRom2D(sCtrl, 10);
      const sShape = offsetRibbonToShape(sSmooth, 2.12 * S, 'flat', 'flat');

      const extrudeOpts = {
        depth: 0.011,
        bevelEnabled: true,
        bevelThickness: 0.0055,
        bevelSize: 0.0028,
        bevelSegments: 5,
        curveSegments: 24
      };

      return {
        hexGeo: new THREE.ExtrudeGeometry(hexShape, extrudeOpts),
        sGeo: new THREE.ExtrudeGeometry(sShape, extrudeOpts)
      };
    }

    // 6. BUILD PHYSICAL 3D DOUBLE-SIDED MODEL
    const badgeRoot = new THREE.Group();
    scene.add(badgeRoot);

    const smokyGreenTex = createSmokyGreenTexture();
    const { mapTex: typoColorTex, bumpTex: typoBumpTex } = createTypographyLayerTextures();

    // 6A. Extruded Physical Pill Body with 14-Segment Rounded Bevels
    const bodyShape = createRoundedRectShape(BADGE_W, BADGE_H, CORNER_R);
    const bodyGeo = new THREE.ExtrudeGeometry(bodyShape, {
      depth: BODY_DEPTH,
      bevelEnabled: true,
      bevelThickness: BEVEL_THICKNESS,
      bevelSize: BEVEL_SIZE,
      bevelSegments: 14,
      curveSegments: 56
    });
    bodyGeo.center();

    {
      const pos = bodyGeo.attributes.position;
      const uv = bodyGeo.attributes.uv;
      const totalW = BADGE_W + BEVEL_SIZE * 2;
      const totalH = BADGE_H + BEVEL_SIZE * 2;
      for (let i = 0; i < pos.count; i++) {
        uv.setXY(i, (pos.getX(i) / totalW) + 0.5, (pos.getY(i) / totalH) + 0.5);
      }
      uv.needsUpdate = true;
    }

    const bodyMaterial = new THREE.MeshPhysicalMaterial({
      map: smokyGreenTex,
      color: 0xffffff,
      roughness: 0.16,
      metalness: 0.08,
      clearcoat: 1.0,
      clearcoatRoughness: 0.06,
      ior: 1.52,
      reflectivity: 0.92,
      envMapIntensity: 1.3
    });

    badgeRoot.add(new THREE.Mesh(bodyGeo, bodyMaterial));

    // 6B. 3D Neon Green Perimeter Bevel Tubes (Front, Back & Outer Rim Accent)
    const neonGreenMat = new THREE.MeshPhysicalMaterial({
      color: 0x26ff5c,
      emissive: 0x00ee3c,
      emissiveIntensity: 1.15,
      roughness: 0.14,
      metalness: 0.05,
      clearcoat: 1.0,
      clearcoatRoughness: 0.05,
      envMapIntensity: 1.1
    });

    function createRimTube(w, h, r, zPos, tubeRadius) {
      const pts = createRoundedRectCurvePoints(w, h, r, zPos);
      const curve = new THREE.CatmullRomCurve3(pts, true);
      const geo = new THREE.TubeGeometry(curve, 180, tubeRadius, 14, true);
      return new THREE.Mesh(geo, neonGreenMat);
    }

    const rimZ = BODY_DEPTH / 2 + BEVEL_THICKNESS * 0.64;
    badgeRoot.add(createRimTube(BADGE_W + 0.022, BADGE_H + 0.022, CORNER_R + 0.011, rimZ, 0.022));
    badgeRoot.add(createRimTube(BADGE_W + 0.022, BADGE_H + 0.022, CORNER_R + 0.011, -rimZ, 0.022));
    badgeRoot.add(createRimTube(BADGE_W + BEVEL_SIZE * 1.85, BADGE_H + BEVEL_SIZE * 1.85, CORNER_R + BEVEL_SIZE * 0.92, 0, 0.018));

    // 6C. Front & Back Raised Face Assemblies (3D Node.js Emblem + Supersampled Typography)
    const facePlateShape = createRoundedRectShape(BADGE_W - 0.04, BADGE_H - 0.04, CORNER_R - 0.02);
    const facePlateGeo = new THREE.ShapeGeometry(facePlateShape, 48);
    {
      const pos = facePlateGeo.attributes.position;
      const uv = facePlateGeo.attributes.uv;
      for (let i = 0; i < pos.count; i++) {
        uv.setXY(i, (pos.getX(i) / BADGE_W) + 0.5, (pos.getY(i) / BADGE_H) + 0.5);
      }
      uv.needsUpdate = true;
    }

    const typoMaterial = new THREE.MeshPhysicalMaterial({
      map: typoColorTex,
      bumpMap: typoBumpTex,
      bumpScale: 0.008,
      emissive: 0xdfffeb,
      emissiveMap: typoColorTex,
      emissiveIntensity: 0.5,
      transparent: true,
      alphaTest: 0.01,
      roughness: 0.15,
      metalness: 0.02,
      clearcoat: 1.0,
      clearcoatRoughness: 0.05,
      depthWrite: false
    });

    const { hexGeo, sGeo } = createNodeEmblemGeometries();

    const emblemLimeMat = new THREE.MeshPhysicalMaterial({
      color: 0x6ef536,
      emissive: 0x45d618,
      emissiveIntensity: 0.95,
      roughness: 0.15,
      metalness: 0.06,
      clearcoat: 1.0,
      clearcoatRoughness: 0.05
    });

    function createFaceDetailGroup() {
      const group = new THREE.Group();

      const typoMesh = new THREE.Mesh(facePlateGeo, typoMaterial);
      typoMesh.position.z = TOTAL_HALF_Z + 0.0025;
      group.add(typoMesh);

      const emblemGroup = new THREE.Group();
      emblemGroup.position.set(-0.87, -0.004, TOTAL_HALF_Z + 0.0015);
      emblemGroup.add(new THREE.Mesh(hexGeo, emblemLimeMat));
      emblemGroup.add(new THREE.Mesh(sGeo, emblemLimeMat));

      group.add(emblemGroup);
      return group;
    }

    badgeRoot.add(createFaceDetailGroup());

    const backFace = createFaceDetailGroup();
    backFace.rotation.y = Math.PI;
    badgeRoot.add(backFace);

    // 6D. Outer Neon Green Halo on Pure #FFFFFF Background
    const haloMat = new THREE.MeshBasicMaterial({
      map: createHaloTexture(),
      transparent: true,
      opacity: 0.95,
      depthWrite: false,
      side: THREE.DoubleSide
    });
    const haloMesh = new THREE.Mesh(new THREE.PlaneGeometry(4.6, 2.3), haloMat);
    haloMesh.renderOrder = -2;
    badgeRoot.add(haloMesh);

    const auraMat = new THREE.SpriteMaterial({
      map: createBillboardAuraTexture(),
      transparent: true,
      opacity: 0.45,
      depthWrite: false
    });
    const auraSprite = new THREE.Sprite(auraMat);
    auraSprite.scale.set(4.4, 4.4, 1);
    auraSprite.renderOrder = -3;
    scene.add(auraSprite);

    // 7. 360° ORBIT CONTROLS, IDLE FLOAT, HOVER MICRO-TILT & DOUBLE-CLICK RESET
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.copy(INITIAL_TARGET);
    controls.enableDamping = true;
    controls.dampingFactor = 0.065;
    controls.enablePan = false;
    controls.rotateSpeed = 0.85;
    controls.zoomSpeed = 0.9;
    controls.minDistance = 2.0;
    controls.maxDistance = 8.5;
    controls.update();

    let isDragging = false;
    let isPointerInside = false;
    let pointerNX = 0;
    let pointerNY = 0;
    let isResetting = false;

    const resetStartCam = new THREE.Vector3();
    const resetStartTarget = new THREE.Vector3();
    let resetProgress = 0;

    controls.addEventListener('start', () => {
      isDragging = true;
      isResetting = false;
    });
    controls.addEventListener('end', () => {
      isDragging = false;
    });

    const domEl = renderer.domElement;
    domEl.addEventListener('pointermove', (e) => {
      isPointerInside = true;
      pointerNX = (e.clientX / window.innerWidth) * 2 - 1;
      pointerNY = (e.clientY / window.innerHeight) * 2 - 1;
    });
    domEl.addEventListener('pointerleave', () => {
      isPointerInside = false;
      pointerNX = 0;
      pointerNY = 0;
    });
    domEl.addEventListener('dblclick', () => {
      resetStartCam.copy(camera.position);
      resetStartTarget.copy(controls.target);
      resetProgress = 0;
      isResetting = true;
    });

    // 8. RESIZE & ANIMATION LOOP
    window.addEventListener('resize', () => {
      const w = window.innerWidth;
      const h = window.innerHeight;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    });

    const clock = new THREE.Clock();
    const viewDir = new THREE.Vector3();

    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), 0.05);
      const elapsed = clock.elapsedTime;

      if (isResetting) {
        resetProgress = Math.min(resetProgress + dt * 2.4, 1);
        const ease = 1 - Math.pow(1 - resetProgress, 3);
        camera.position.lerpVectors(resetStartCam, INITIAL_CAM_POS, ease);
        controls.target.lerpVectors(resetStartTarget, INITIAL_TARGET, ease);
        if (resetProgress >= 1) isResetting = false;
      }

      const idleFloatY = Math.sin(elapsed * 1.45) * 0.022;
      const idleRotX = Math.sin(elapsed * 0.95) * 0.012;
      const idleRotY = Math.cos(elapsed * 0.75) * 0.015;

      const targetTiltY = (!isDragging && isPointerInside) ? pointerNX * 0.085 : 0;
      const targetTiltX = (!isDragging && isPointerInside) ? pointerNY * 0.065 : 0;

      badgeRoot.position.y = THREE.MathUtils.lerp(badgeRoot.position.y, idleFloatY, 0.08);
      badgeRoot.rotation.x = THREE.MathUtils.lerp(badgeRoot.rotation.x, targetTiltX + idleRotX, 0.07);
      badgeRoot.rotation.y = THREE.MathUtils.lerp(badgeRoot.rotation.y, targetTiltY + idleRotY, 0.07);

      auraSprite.position.y = badgeRoot.position.y;
      viewDir.subVectors(camera.position, controls.target).normalize();
      const edgeFactor = 1.0 - Math.abs(viewDir.z);
      haloMat.opacity = 0.95 * (1.0 - edgeFactor * 0.65);
      auraMat.opacity = 0.35 + edgeFactor * 0.28;

      controls.update();
      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>

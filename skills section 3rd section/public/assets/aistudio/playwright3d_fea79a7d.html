<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Playwright — 3D Interactive Model</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #ffffff;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: grab;
      outline: none;
    }
    canvas:active { cursor: grabbing; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // 1. RENDERER, SCENE & CAMERA
    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      alpha: true,
      powerPreference: 'high-performance'
    });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.08;
    renderer.setClearColor(0xffffff, 0);
    document.body.appendChild(renderer.domElement);

    const scene = new THREE.Scene();

    const INITIAL_CAM_POS = new THREE.Vector3(0, 0, 4.25);
    const INITIAL_TARGET = new THREE.Vector3(0, 0, 0);

    const camera = new THREE.PerspectiveCamera(36, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.copy(INITIAL_CAM_POS);

    // 2. PROCEDURAL 360° STUDIO ENVIRONMENT (PMREM) & BALANCED LIGHTING
    function createStudioEnv(glRenderer) {
      const pmrem = new THREE.PMREMGenerator(glRenderer);
      pmrem.compileEquirectangularShader();
      const envScene = new THREE.Scene();
      envScene.background = new THREE.Color(0x052810);

      const addPanel = (w, h, color, intensity, pos) => {
        const geo = new THREE.PlaneGeometry(w, h);
        const mat = new THREE.MeshBasicMaterial({
          color: new THREE.Color(color).multiplyScalar(intensity),
          side: THREE.DoubleSide
        });
        const mesh = new THREE.Mesh(geo, mat);
        mesh.position.set(...pos);
        mesh.lookAt(0, 0, 0);
        envScene.add(mesh);
      };

      addPanel(10, 5, 0xffffff, 2.2, [0, 3.2, 8]);
      addPanel(10, 5, 0xc2ffca, 1.4, [0, -3.5, 8]);
      addPanel(10, 5, 0xffffff, 2.2, [0, 3.2, -8]);
      addPanel(10, 5, 0xc2ffca, 1.4, [0, -3.5, -8]);
      addPanel(12, 6, 0xebffed, 2.0, [0, 8.5, 0]);
      addPanel(12, 6, 0x72f785, 1.1, [0, -8.5, 0]);
      addPanel(6, 8, 0xa8ffb4, 1.6, [9, 0.5, 0]);
      addPanel(6, 8, 0xa8ffb4, 1.6, [-9, 0.5, 0]);

      const rt = pmrem.fromScene(envScene, 0.04);
      pmrem.dispose();
      return rt.texture;
    }

    scene.environment = createStudioEnv(renderer);
    scene.add(new THREE.AmbientLight(0xdcffdf, 0.82));

    const addDirLight = (color, intensity, pos) => {
      const l = new THREE.DirectionalLight(color, intensity);
      l.position.set(...pos);
      scene.add(l);
    };
    addDirLight(0xffffff, 1.35, [2.5, 3.5, 5.5]);
    addDirLight(0x4eff66, 0.65, [-3.5, -2.0, 4.5]);
    addDirLight(0xffffff, 1.35, [-2.5, 3.5, -5.5]);
    addDirLight(0x4eff66, 0.65, [3.5, -2.0, -4.5]);

    // 3. EXACT BADGE DIMENSIONS & GEOMETRY HELPERS
    const BADGE_W = 3.00;
    const BADGE_H = 1.00;
    const CORNER_R = 0.32;
    const BODY_DEPTH = 0.12;
    const BEVEL_THICKNESS = 0.042;
    const BEVEL_SIZE = 0.036;
    const TOTAL_HALF_Z = BODY_DEPTH / 2 + BEVEL_THICKNESS;

    function createRoundedRectShape(w, h, r) {
      const hw = w / 2;
      const hh = h / 2;
      const rad = Math.min(r, hw, hh);
      const s = new THREE.Shape();
      s.moveTo(-hw + rad, -hh);
      s.lineTo(hw - rad, -hh);
      s.absarc(hw - rad, -hh + rad, rad, -Math.PI / 2, 0, false);
      s.lineTo(hw, hh - rad);
      s.absarc(hw - rad, hh - rad, rad, 0, Math.PI / 2, false);
      s.lineTo(-hw + rad, hh);
      s.absarc(-hw + rad, hh - rad, rad, Math.PI / 2, Math.PI, false);
      s.lineTo(-hw, -hh + rad);
      s.absarc(-hw + rad, -hh + rad, rad, Math.PI, Math.PI * 1.5, false);
      return s;
    }

    function createRoundedRectCurvePoints(w, h, r, z = 0) {
      const hw = w / 2;
      const hh = h / 2;
      const rad = Math.min(r, hw, hh);
      const pts = [];
      const cornerSteps = 22;
      const straightSteps = 10;

      const pushLine = (x0, y0, x1, y1) => {
        for (let i = 0; i < straightSteps; i++) {
          const t = i / straightSteps;
          pts.push(new THREE.Vector3(x0 + (x1 - x0) * t, y0 + (y1 - y0) * t, z));
        }
      };
      const pushArc = (cx, cy, a0, a1) => {
        for (let i = 0; i < cornerSteps; i++) {
          const a = a0 + (a1 - a0) * (i / cornerSteps);
          pts.push(new THREE.Vector3(cx + Math.cos(a) * rad, cy + Math.sin(a) * rad, z));
        }
      };

      pushLine(-hw + rad, -hh, hw - rad, -hh);
      pushArc(hw - rad, -hh + rad, -Math.PI / 2, 0);
      pushLine(hw, -hh + rad, hw, hh - rad);
      pushArc(hw - rad, hh - rad, 0, Math.PI / 2);
      pushLine(hw - rad, hh, -hw + rad, hh);
      pushArc(-hw + rad, hh - rad, Math.PI / 2, Math.PI);
      pushLine(-hw, hh - rad, -hw, -hh + rad);
      pushArc(-hw + rad, -hh + rad, Math.PI, Math.PI * 1.5);
      return pts;
    }

    function strokeRoundedRectCanvas(ctx, x, y, w, h, r) {
      const rad = Math.min(r, w / 2, h / 2);
      ctx.beginPath();
      ctx.moveTo(x + rad, y);
      ctx.lineTo(x + w - rad, y);
      ctx.arcTo(x + w, y, x + w, y + rad, rad);
      ctx.lineTo(x + w, y + h - rad);
      ctx.arcTo(x + w, y + h, x + w - rad, y + h, rad);
      ctx.lineTo(x + rad, y + h);
      ctx.arcTo(x, y + h, x, y + h - rad, rad);
      ctx.lineTo(x, y + rad);
      ctx.arcTo(x, y, x + rad, y, rad);
      ctx.closePath();
    }

    function applyNormalizedPlanarUVs(geo, width, height) {
      const pos = geo.attributes.position;
      const uv = geo.attributes.uv;
      for (let i = 0; i < pos.count; i++) {
        uv.setXY(i, (pos.getX(i) / width) + 0.5, (pos.getY(i) / height) + 0.5);
      }
      uv.needsUpdate = true;
    }

    // 4. HIGH-DPI PROCEDURAL TEXTURES (2560x854 SUPERSAMPLED)
    const maxAniso = renderer.capabilities.getMaxAnisotropy();

    function createSmokyForestTexture() {
      const W = 2560;
      const H = 854;
      const canvas = document.createElement('canvas');
      canvas.width = W;
      canvas.height = H;
      const ctx = canvas.getContext('2d');

      const bg = ctx.createLinearGradient(0, 0, W, H);
      bg.addColorStop(0, '#0a4a1d');
      bg.addColorStop(0.35, '#073c17');
      bg.addColorStop(0.7, '#042a10');
      bg.addColorStop(1, '#08421a');
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, W, H);

      let seed = 7319;
      const rand = () => {
        seed = (seed * 16807) % 2147483647;
        return (seed - 1) / 2147483646;
      };

      for (let i = 0; i < 68; i++) {
        const cx = rand() * W;
        const cy = rand() * H;
        const rx = 160 + rand() * 420;
        const ry = 70 + rand() * 190;
        const angle = (rand() - 0.5) * 0.85;
        const isLight = rand() > 0.44;

        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(angle);
        ctx.scale(1, ry / rx);
        const grad = ctx.createRadialGradient(0, 0, 0, 0, 0, rx);
        if (isLight) {
          grad.addColorStop(0, 'rgba(26, 175, 62, 0.12)');
          grad.addColorStop(0.55, 'rgba(14, 125, 42, 0.05)');
          grad.addColorStop(1, 'rgba(6, 68, 22, 0)');
        } else {
          grad.addColorStop(0, 'rgba(2, 24, 8, 0.22)');
          grad.addColorStop(0.6, 'rgba(3, 34, 12, 0.09)');
          grad.addColorStop(1, 'rgba(3, 34, 12, 0)');
        }
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(0, 0, rx, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      // Inner vibrant Playwright lime-green edge glow
      const pad = 22;
      const rPx = (CORNER_R / BADGE_H) * (H - pad * 2);
      ctx.save();
      strokeRoundedRectCanvas(ctx, pad, pad, W - pad * 2, H - pad * 2, rPx);
      ctx.shadowColor = 'rgba(46, 238, 72, 0.90)';
      ctx.shadowBlur = 78;
      ctx.lineWidth = 20;
      ctx.strokeStyle = 'rgba(42, 232, 68, 0.58)';
      ctx.stroke();

      ctx.shadowBlur = 32;
      ctx.lineWidth = 10;
      ctx.strokeStyle = 'rgba(62, 248, 88, 0.76)';
      ctx.stroke();
      ctx.restore();

      const tex = new THREE.CanvasTexture(canvas);
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.anisotropy = maxAniso;
      return tex;
    }

    function createTwoToneMaskTexture(leftColor, rightColor) {
      const S = 512;
      const canvas = document.createElement('canvas');
      canvas.width = S;
      canvas.height = S;
      const ctx = canvas.getContext('2d');

      ctx.fillStyle = leftColor;
      ctx.fillRect(0, 0, S / 2, S);

      ctx.fillStyle = rightColor;
      ctx.fillRect(S / 2, 0, S / 2, S);

      const tex = new THREE.CanvasTexture(canvas);
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.anisotropy = maxAniso;
      return tex;
    }

    function createTypographyLayerTextures() {
      const W = 2560;
      const H = 854;

      const canvas = document.createElement('canvas');
      canvas.width = W;
      canvas.height = H;
      const ctx = canvas.getContext('2d');

      const bumpCanvas = document.createElement('canvas');
      bumpCanvas.width = W;
      bumpCanvas.height = H;
      const bCtx = bumpCanvas.getContext('2d');

      ctx.clearRect(0, 0, W, H);
      bCtx.fillStyle = '#000000';
      bCtx.fillRect(0, 0, W, H);

      const text = 'Playwright';
      const fontFamily = '"Inter", "SF Pro Display", "Segoe UI", "Roboto", "Helvetica Neue", Arial, sans-serif';
      let fontSize = Math.round(H * 0.43);
      const maxTextWidth = W * 0.545;

      ctx.font = `600 ${fontSize}px ${fontFamily}`;
      const measuredW = ctx.measureText(text).width;
      if (measuredW > maxTextWidth) {
        fontSize = Math.round(fontSize * (maxTextWidth / measuredW));
      }

      const fontSpec = `600 ${fontSize}px ${fontFamily}`;
      ctx.font = fontSpec;
      ctx.textAlign = 'left';
      ctx.textBaseline = 'alphabetic';

      const textX = W * 0.362;
      const textY = H * 0.62;

      ctx.save();
      ctx.shadowColor = 'rgba(135, 255, 155, 0.45)';
      ctx.shadowBlur = 14;
      ctx.fillStyle = '#F3FFF5';
      ctx.fillText(text, textX, textY);
      ctx.restore();

      ctx.save();
      ctx.shadowColor = 'rgba(255, 255, 255, 0.45)';
      ctx.shadowBlur = 4;
      ctx.fillStyle = '#FFFFFF';
      ctx.fillText(text, textX, textY);
      ctx.restore();

      bCtx.font = fontSpec;
      bCtx.textAlign = 'left';
      bCtx.textBaseline = 'alphabetic';
      bCtx.shadowColor = 'rgba(200, 200, 200, 0.85)';
      bCtx.shadowBlur = 6;
      bCtx.fillStyle = '#ffffff';
      bCtx.fillText(text, textX, textY);

      const mapTex = new THREE.CanvasTexture(canvas);
      mapTex.colorSpace = THREE.SRGBColorSpace;
      mapTex.anisotropy = maxAniso;

      const bumpTex = new THREE.CanvasTexture(bumpCanvas);
      bumpTex.anisotropy = maxAniso;

      return { mapTex, bumpTex };
    }

    function createHaloTexture() {
      const W = 2048;
      const H = 1024;
      const canvas = document.createElement('canvas');
      canvas.width = W;
      canvas.height = H;
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, W, H);

      const rectW = W * 0.65;
      const rectH = H * 0.43;
      const rectX = (W - rectW) / 2;
      const rectY = (H - rectH) / 2;
      const rPx = (CORNER_R / BADGE_H) * rectH;

      const passes = [
        { blur: 130, alpha: 0.24, lw: 34 },
        { blur: 82,  alpha: 0.34, lw: 26 },
        { blur: 46,  alpha: 0.44, lw: 18 },
        { blur: 22,  alpha: 0.52, lw: 12 }
      ];

      passes.forEach((p) => {
        ctx.save();
        strokeRoundedRectCanvas(ctx, rectX, rectY, rectW, rectH, rPx);
        ctx.shadowColor = `rgba(38, 228, 65, ${p.alpha})`;
        ctx.shadowBlur = p.blur;
        ctx.lineWidth = p.lw;
        ctx.strokeStyle = `rgba(38, 228, 65, ${p.alpha * 0.55})`;
        ctx.stroke();
        ctx.restore();
      });

      const tex = new THREE.CanvasTexture(canvas);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    function createBillboardAuraTexture() {
      const S = 1024;
      const canvas = document.createElement('canvas');
      canvas.width = S;
      canvas.height = S;
      const ctx = canvas.getContext('2d');

      ctx.save();
      ctx.translate(S / 2, S / 2);
      ctx.scale(1.0, 0.52);
      const grad = ctx.createRadialGradient(0, 0, S * 0.14, 0, 0, S * 0.48);
      grad.addColorStop(0, 'rgba(38, 228, 65, 0.30)');
      grad.addColorStop(0.45, 'rgba(38, 228, 65, 0.14)');
      grad.addColorStop(0.75, 'rgba(38, 228, 65, 0.04)');
      grad.addColorStop(1, 'rgba(38, 228, 65, 0.0)');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(0, 0, S * 0.48, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      const tex = new THREE.CanvasTexture(canvas);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    // 5. BUILD PHYSICAL 3D DOUBLE-SIDED MODEL
    const badgeRoot = new THREE.Group();
    scene.add(badgeRoot);

    const smokyForestTex = createSmokyForestTexture();
    const { mapTex: typoColorTex, bumpTex: typoBumpTex } = createTypographyLayerTextures();

    // 5A. Extruded Physical Pill Body with 14-Segment Rounded Bevels
    const bodyShape = createRoundedRectShape(BADGE_W, BADGE_H, CORNER_R);
    const bodyGeo = new THREE.ExtrudeGeometry(bodyShape, {
      depth: BODY_DEPTH,
      bevelEnabled: true,
      bevelThickness: BEVEL_THICKNESS,
      bevelSize: BEVEL_SIZE,
      bevelSegments: 14,
      curveSegments: 56
    });
    bodyGeo.center();
    applyNormalizedPlanarUVs(bodyGeo, BADGE_W + BEVEL_SIZE * 2, BADGE_H + BEVEL_SIZE * 2);

    const bodyMaterial = new THREE.MeshPhysicalMaterial({
      map: smokyForestTex,
      color: 0xffffff,
      roughness: 0.16,
      metalness: 0.08,
      clearcoat: 1.0,
      clearcoatRoughness: 0.06,
      ior: 1.52,
      reflectivity: 0.92,
      envMapIntensity: 1.3
    });

    badgeRoot.add(new THREE.Mesh(bodyGeo, bodyMaterial));

    // 5B. 3D Neon Lime-Green Perimeter Bevel Tubes
    const neonGreenMat = new THREE.MeshPhysicalMaterial({
      color: 0x3bf24e,
      emissive: 0x1fd935,
      emissiveIntensity: 1.12,
      roughness: 0.14,
      metalness: 0.05,
      clearcoat: 1.0,
      clearcoatRoughness: 0.05,
      envMapIntensity: 1.1
    });

    function createRimTube(w, h, r, zPos, tubeRadius) {
      const pts = createRoundedRectCurvePoints(w, h, r, zPos);
      const curve = new THREE.CatmullRomCurve3(pts, true);
      const geo = new THREE.TubeGeometry(curve, 180, tubeRadius, 14, true);
      return new THREE.Mesh(geo, neonGreenMat);
    }

    const rimZ = BODY_DEPTH / 2 + BEVEL_THICKNESS * 0.64;
    badgeRoot.add(createRimTube(BADGE_W + 0.022, BADGE_H + 0.022, CORNER_R + 0.011, rimZ, 0.022));
    badgeRoot.add(createRimTube(BADGE_W + 0.022, BADGE_H + 0.022, CORNER_R + 0.011, -rimZ, 0.022));
    badgeRoot.add(createRimTube(BADGE_W + BEVEL_SIZE * 1.85, BADGE_H + BEVEL_SIZE * 1.85, CORNER_R + BEVEL_SIZE * 0.92, 0, 0.018));

    // 5C. Front & Back Raised Face Assemblies (3D Playwright Masks + Supersampled Typography)
    const facePlateShape = createRoundedRectShape(BADGE_W - 0.04, BADGE_H - 0.04, CORNER_R - 0.02);
    const facePlateGeo = new THREE.ShapeGeometry(facePlateShape, 48);
    applyNormalizedPlanarUVs(facePlateGeo, BADGE_W, BADGE_H);

    const typoMaterial = new THREE.MeshPhysicalMaterial({
      map: typoColorTex,
      bumpMap: typoBumpTex,
      bumpScale: 0.008,
      emissive: 0xeaffed,
      emissiveMap: typoColorTex,
      emissiveIntensity: 0.48,
      transparent: true,
      alphaTest: 0.01,
      roughness: 0.15,
      metalness: 0.02,
      clearcoat: 1.0,
      clearcoatRoughness: 0.05,
      depthWrite: false
    });

    // Helper: Base Theater Mask Silhouette
    function createMaskBaseShape() {
      const s = new THREE.Shape();
      s.moveTo(0, 0.31);
      s.bezierCurveTo(0.16, 0.31, 0.31, 0.36, 0.41, 0.43);
      s.bezierCurveTo(0.45, 0.45, 0.46, 0.41, 0.45, 0.32);
      s.bezierCurveTo(0.42, 0.02, 0.33, -0.26, 0.16, -0.43);
      s.bezierCurveTo(0.06, -0.52, -0.06, -0.52, -0.16, -0.43);
      s.bezierCurveTo(-0.33, -0.26, -0.42, 0.02, -0.45, 0.32);
      s.bezierCurveTo(-0.46, 0.41, -0.45, 0.45, -0.41, 0.43);
      s.bezierCurveTo(-0.31, 0.36, -0.16, 0.31, 0, 0.31);
      return s;
    }

    // Green Comedy Mask (Happy Arching Eyes + Smile)
    const greenMaskShape = createMaskBaseShape();
    {
      const leftEye = new THREE.Path();
      leftEye.moveTo(-0.29, 0.03);
      leftEye.bezierCurveTo(-0.24, 0.09, -0.12, 0.10, -0.07, 0.06);
      leftEye.bezierCurveTo(-0.11, 0.18, -0.25, 0.17, -0.29, 0.03);
      greenMaskShape.holes.push(leftEye);

      const rightEye = new THREE.Path();
      rightEye.moveTo(0.07, 0.06);
      rightEye.bezierCurveTo(0.12, 0.10, 0.24, 0.09, 0.29, 0.03);
      rightEye.bezierCurveTo(0.25, 0.17, 0.11, 0.18, 0.07, 0.06);
      greenMaskShape.holes.push(rightEye);

      const smile = new THREE.Path();
      smile.moveTo(-0.21, -0.10);
      smile.bezierCurveTo(-0.18, -0.32, 0.18, -0.32, 0.21, -0.10);
      smile.bezierCurveTo(0.08, -0.12, -0.08, -0.12, -0.21, -0.10);
      greenMaskShape.holes.push(smile);
    }

    // Red Tragedy Mask (Droopy Sad Eyes + Frown)
    const redMaskShape = createMaskBaseShape();
    {
      const leftEye = new THREE.Path();
      leftEye.moveTo(-0.28, 0.07);
      leftEye.bezierCurveTo(-0.24, -0.03, -0.11, -0.02, -0.07, 0.10);
      leftEye.bezierCurveTo(-0.12, 0.05, -0.22, 0.04, -0.28, 0.07);
      redMaskShape.holes.push(leftEye);

      const rightEye = new THREE.Path();
      rightEye.moveTo(0.07, 0.10);
      rightEye.bezierCurveTo(0.11, -0.02, 0.24, -0.03, 0.28, 0.07);
      rightEye.bezierCurveTo(0.22, 0.04, 0.12, 0.05, 0.07, 0.10);
      redMaskShape.holes.push(rightEye);

      const frown = new THREE.Path();
      frown.moveTo(-0.19, -0.26);
      frown.bezierCurveTo(-0.08, -0.19, 0.08, -0.19, 0.19, -0.26);
      frown.bezierCurveTo(0.10, -0.11, -0.10, -0.11, -0.19, -0.26);
      redMaskShape.holes.push(frown);
    }

    const maskExtrudeOpts = {
      depth: 0.015,
      bevelEnabled: true,
      bevelThickness: 0.005,
      bevelSize: 0.004,
      bevelSegments: 8,
      curveSegments: 36
    };

    const greenMaskGeo = new THREE.ExtrudeGeometry(greenMaskShape, maskExtrudeOpts);
    applyNormalizedPlanarUVs(greenMaskGeo, 0.94, 0.98);

    const redMaskGeo = new THREE.ExtrudeGeometry(redMaskShape, maskExtrudeOpts);
    applyNormalizedPlanarUVs(redMaskGeo, 0.94, 0.98);

    const greenMaskTex = createTwoToneMaskTexture('#43c74f', '#259433');
    const redMaskTex = createTwoToneMaskTexture('#e35a4b', '#c9483b');

    const greenMaskMat = new THREE.MeshPhysicalMaterial({
      map: greenMaskTex,
      color: 0xffffff,
      emissive: 0x0b4a16,
      emissiveIntensity: 0.25,
      roughness: 0.18,
      metalness: 0.05,
      clearcoat: 1.0,
      clearcoatRoughness: 0.06
    });

    const redMaskMat = new THREE.MeshPhysicalMaterial({
      map: redMaskTex,
      color: 0xffffff,
      emissive: 0x45120d,
      emissiveIntensity: 0.22,
      roughness: 0.2,
      metalness: 0.05,
      clearcoat: 1.0,
      clearcoatRoughness: 0.07
    });

    function createFaceDetailGroup() {
      const group = new THREE.Group();

      const typoMesh = new THREE.Mesh(facePlateGeo, typoMaterial);
      typoMesh.position.z = TOTAL_HALF_Z + 0.0025;
      group.add(typoMesh);

      const masksGroup = new THREE.Group();

      // Back/Left Coral-Red Tragedy Mask
      const redMesh = new THREE.Mesh(redMaskGeo, redMaskMat);
      redMesh.position.set(-1.05, 0.02, TOTAL_HALF_Z + 0.004);
      redMesh.rotation.z = 0.28;
      redMesh.scale.set(0.43, 0.43, 1.0);
      masksGroup.add(redMesh);

      // Front/Right Two-Tone Green Comedy Mask
      const greenMesh = new THREE.Mesh(greenMaskGeo, greenMaskMat);
      greenMesh.position.set(-0.74, -0.02, TOTAL_HALF_Z + 0.029);
      greenMesh.rotation.z = -0.19;
      greenMesh.scale.set(0.54, 0.54, 1.0);
      masksGroup.add(greenMesh);

      group.add(masksGroup);
      return group;
    }

    badgeRoot.add(createFaceDetailGroup());

    const backFace = createFaceDetailGroup();
    backFace.rotation.y = Math.PI;
    badgeRoot.add(backFace);

    // 5D. Outer Playwright Green Neon Halo on Pure #FFFFFF Background
    const haloMat = new THREE.MeshBasicMaterial({
      map: createHaloTexture(),
      transparent: true,
      opacity: 0.95,
      depthWrite: false,
      side: THREE.DoubleSide
    });
    const haloMesh = new THREE.Mesh(new THREE.PlaneGeometry(4.6, 2.3), haloMat);
    haloMesh.renderOrder = -2;
    badgeRoot.add(haloMesh);

    const auraMat = new THREE.SpriteMaterial({
      map: createBillboardAuraTexture(),
      transparent: true,
      opacity: 0.45,
      depthWrite: false
    });
    const auraSprite = new THREE.Sprite(auraMat);
    auraSprite.scale.set(4.4, 4.4, 1);
    auraSprite.renderOrder = -3;
    scene.add(auraSprite);

    // 6. 360° ORBIT CONTROLS, IDLE FLOAT, HOVER MICRO-TILT & DOUBLE-CLICK RESET
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.copy(INITIAL_TARGET);
    controls.enableDamping = true;
    controls.dampingFactor = 0.065;
    controls.enablePan = false;
    controls.rotateSpeed = 0.85;
    controls.zoomSpeed = 0.9;
    controls.minDistance = 2.0;
    controls.maxDistance = 8.5;
    controls.update();

    let isDragging = false;
    let isPointerInside = false;
    let pointerNX = 0;
    let pointerNY = 0;
    let isResetting = false;

    const resetStartCam = new THREE.Vector3();
    const resetStartTarget = new THREE.Vector3();
    let resetProgress = 0;

    controls.addEventListener('start', () => {
      isDragging = true;
      isResetting = false;
    });
    controls.addEventListener('end', () => {
      isDragging = false;
    });

    const domEl = renderer.domElement;
    domEl.addEventListener('pointermove', (e) => {
      isPointerInside = true;
      pointerNX = (e.clientX / window.innerWidth) * 2 - 1;
      pointerNY = (e.clientY / window.innerHeight) * 2 - 1;
    });
    domEl.addEventListener('pointerleave', () => {
      isPointerInside = false;
      pointerNX = 0;
      pointerNY = 0;
    });
    domEl.addEventListener('dblclick', () => {
      resetStartCam.copy(camera.position);
      resetStartTarget.copy(controls.target);
      resetProgress = 0;
      isResetting = true;
    });

    // 7. RESIZE & ANIMATION LOOP
    window.addEventListener('resize', () => {
      const w = window.innerWidth;
      const h = window.innerHeight;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    });

    const clock = new THREE.Clock();
    const viewDir = new THREE.Vector3();

    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), 0.05);
      const elapsed = clock.elapsedTime;

      if (isResetting) {
        resetProgress = Math.min(resetProgress + dt * 2.4, 1);
        const ease = 1 - Math.pow(1 - resetProgress, 3);
        camera.position.lerpVectors(resetStartCam, INITIAL_CAM_POS, ease);
        controls.target.lerpVectors(resetStartTarget, INITIAL_TARGET, ease);
        if (resetProgress >= 1) isResetting = false;
      }

      const idleFloatY = Math.sin(elapsed * 1.45) * 0.022;
      const idleRotX = Math.sin(elapsed * 0.95) * 0.012;
      const idleRotY = Math.cos(elapsed * 0.75) * 0.015;

      const targetTiltY = (!isDragging && isPointerInside) ? pointerNX * 0.085 : 0;
      const targetTiltX = (!isDragging && isPointerInside) ? pointerNY * 0.065 : 0;

      badgeRoot.position.y = THREE.MathUtils.lerp(badgeRoot.position.y, idleFloatY, 0.08);
      badgeRoot.rotation.x = THREE.MathUtils.lerp(badgeRoot.rotation.x, targetTiltX + idleRotX, 0.07);
      badgeRoot.rotation.y = THREE.MathUtils.lerp(badgeRoot.rotation.y, targetTiltY + idleRotY, 0.07);

      auraSprite.position.y = badgeRoot.position.y;
      viewDir.subVectors(camera.position, controls.target).normalize();
      const edgeFactor = 1.0 - Math.abs(viewDir.z);
      haloMat.opacity = 0.95 * (1.0 - edgeFactor * 0.65);
      auraMat.opacity = 0.35 + edgeFactor * 0.28;

      controls.update();
      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>React Query — 3D Interactive Model</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #ffffff;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: grab;
      outline: none;
    }
    canvas:active { cursor: grabbing; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // 1. RENDERER, SCENE & CAMERA
    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      alpha: true,
      powerPreference: 'high-performance'
    });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.08;
    renderer.setClearColor(0xffffff, 0);
    document.body.appendChild(renderer.domElement);

    const scene = new THREE.Scene();

    const INITIAL_CAM_POS = new THREE.Vector3(0, 0, 4.45);
    const INITIAL_TARGET = new THREE.Vector3(0, 0, 0);

    const camera = new THREE.PerspectiveCamera(36, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.copy(INITIAL_CAM_POS);

    // 2. PROCEDURAL 360° STUDIO ENVIRONMENT (PMREM) & BALANCED LIGHTING
    function createStudioEnv(glRenderer) {
      const pmrem = new THREE.PMREMGenerator(glRenderer);
      pmrem.compileEquirectangularShader();
      const envScene = new THREE.Scene();
      envScene.background = new THREE.Color(0x280908);

      const addPanel = (w, h, color, intensity, pos) => {
        const geo = new THREE.PlaneGeometry(w, h);
        const mat = new THREE.MeshBasicMaterial({
          color: new THREE.Color(color).multiplyScalar(intensity),
          side: THREE.DoubleSide
        });
        const mesh = new THREE.Mesh(geo, mat);
        mesh.position.set(...pos);
        mesh.lookAt(0, 0, 0);
        envScene.add(mesh);
      };

      addPanel(10, 5, 0xffffff, 2.2, [0, 3.2, 8]);
      addPanel(10, 5, 0xffbca8, 1.4, [0, -3.5, 8]);
      addPanel(10, 5, 0xffffff, 2.2, [0, 3.2, -8]);
      addPanel(10, 5, 0xffbca8, 1.4, [0, -3.5, -8]);
      addPanel(12, 6, 0xfff0ec, 2.0, [0, 8.5, 0]);
      addPanel(12, 6, 0xff7b63, 1.1, [0, -8.5, 0]);
      addPanel(6, 8, 0xff9e8a, 1.6, [9, 0.5, 0]);
      addPanel(6, 8, 0xff9e8a, 1.6, [-9, 0.5, 0]);

      const rt = pmrem.fromScene(envScene, 0.04);
      pmrem.dispose();
      return rt.texture;
    }

    scene.environment = createStudioEnv(renderer);
    scene.add(new THREE.AmbientLight(0xffe0d6, 0.85));

    const addDirLight = (color, intensity, pos) => {
      const l = new THREE.DirectionalLight(color, intensity);
      l.position.set(...pos);
      scene.add(l);
    };
    addDirLight(0xffffff, 1.35, [2.5, 3.5, 5.5]);
    addDirLight(0xff6b52, 0.65, [-3.5, -2.0, 4.5]);
    addDirLight(0xffffff, 1.35, [-2.5, 3.5, -5.5]);
    addDirLight(0xff6b52, 0.65, [3.5, -2.0, -4.5]);

    // 3. EXACT BADGE DIMENSIONS & GEOMETRY HELPERS
    const BADGE_W = 3.24;
    const BADGE_H = 1.00;
    const CORNER_R = 0.32;
    const BODY_DEPTH = 0.12;
    const BEVEL_THICKNESS = 0.042;
    const BEVEL_SIZE = 0.036;
    const TOTAL_HALF_Z = BODY_DEPTH / 2 + BEVEL_THICKNESS;

    function createRoundedRectShape(w, h, r) {
      const hw = w / 2;
      const hh = h / 2;
      const rad = Math.min(r, hw, hh);
      const s = new THREE.Shape();
      s.moveTo(-hw + rad, -hh);
      s.lineTo(hw - rad, -hh);
      s.absarc(hw - rad, -hh + rad, rad, -Math.PI / 2, 0, false);
      s.lineTo(hw, hh - rad);
      s.absarc(hw - rad, hh - rad, rad, 0, Math.PI / 2, false);
      s.lineTo(-hw + rad, hh);
      s.absarc(-hw + rad, hh - rad, rad, Math.PI / 2, Math.PI, false);
      s.lineTo(-hw, -hh + rad);
      s.absarc(-hw + rad, -hh + rad, rad, Math.PI, Math.PI * 1.5, false);
      return s;
    }

    function createRoundedRectCurvePoints(w, h, r, z = 0) {
      const hw = w / 2;
      const hh = h / 2;
      const rad = Math.min(r, hw, hh);
      const pts = [];
      const cornerSteps = 22;
      const straightSteps = 10;

      const pushLine = (x0, y0, x1, y1) => {
        for (let i = 0; i < straightSteps; i++) {
          const t = i / straightSteps;
          pts.push(new THREE.Vector3(x0 + (x1 - x0) * t, y0 + (y1 - y0) * t, z));
        }
      };
      const pushArc = (cx, cy, a0, a1) => {
        for (let i = 0; i < cornerSteps; i++) {
          const a = a0 + (a1 - a0) * (i / cornerSteps);
          pts.push(new THREE.Vector3(cx + Math.cos(a) * rad, cy + Math.sin(a) * rad, z));
        }
      };

      pushLine(-hw + rad, -hh, hw - rad, -hh);
      pushArc(hw - rad, -hh + rad, -Math.PI / 2, 0);
      pushLine(hw, -hh + rad, hw, hh - rad);
      pushArc(hw - rad, hh - rad, 0, Math.PI / 2);
      pushLine(hw - rad, hh, -hw + rad, hh);
      pushArc(-hw + rad, hh - rad, Math.PI / 2, Math.PI);
      pushLine(-hw, hh - rad, -hw, -hh + rad);
      pushArc(-hw + rad, -hh + rad, Math.PI, Math.PI * 1.5);
      return pts;
    }

    function strokeRoundedRectCanvas(ctx, x, y, w, h, r) {
      const rad = Math.min(r, w / 2, h / 2);
      ctx.beginPath();
      ctx.moveTo(x + rad, y);
      ctx.lineTo(x + w - rad, y);
      ctx.arcTo(x + w, y, x + w, y + rad, rad);
      ctx.lineTo(x + w, y + h - rad);
      ctx.arcTo(x + w, y + h, x + w - rad, y + h, rad);
      ctx.lineTo(x + rad, y + h);
      ctx.arcTo(x, y + h, x, y + h - rad, rad);
      ctx.lineTo(x, y + rad);
      ctx.arcTo(x, y, x + rad, y, rad);
      ctx.closePath();
    }

    // 4. HIGH-DPI PROCEDURAL TEXTURES (SUPERSAMPLED, SAFARI-SAFE)
    const maxAniso = renderer.capabilities.getMaxAnisotropy();

    function createSmokyBurgundyTexture() {
      const W = 2560;
      const H = 790;
      const canvas = document.createElement('canvas');
      canvas.width = W;
      canvas.height = H;
      const ctx = canvas.getContext('2d');

      const bg = ctx.createLinearGradient(0, 0, W, H);
      bg.addColorStop(0, '#441714');
      bg.addColorStop(0.35, '#381210');
      bg.addColorStop(0.7, '#2b0d0c');
      bg.addColorStop(1, '#3e1512');
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, W, H);

      let seed = 7391;
      const rand = () => {
        seed = (seed * 16807) % 2147483647;
        return (seed - 1) / 2147483646;
      };

      for (let i = 0; i < 68; i++) {
        const cx = rand() * W;
        const cy = rand() * H;
        const rx = 160 + rand() * 420;
        const ry = 70 + rand() * 190;
        const angle = (rand() - 0.5) * 0.85;
        const isLight = rand() > 0.44;

        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(angle);
        ctx.scale(1, ry / rx);
        const grad = ctx.createRadialGradient(0, 0, 0, 0, 0, rx);
        if (isLight) {
          grad.addColorStop(0, 'rgba(138, 44, 34, 0.14)');
          grad.addColorStop(0.55, 'rgba(104, 32, 25, 0.06)');
          grad.addColorStop(1, 'rgba(56, 18, 16, 0)');
        } else {
          grad.addColorStop(0, 'rgba(20, 5, 5, 0.22)');
          grad.addColorStop(0.6, 'rgba(28, 7, 7, 0.09)');
          grad.addColorStop(1, 'rgba(28, 7, 7, 0)');
        }
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(0, 0, rx, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      // Soft inner warm coral-orange edge glow
      const pad = 22;
      const rPx = (CORNER_R / BADGE_H) * (H - pad * 2);
      ctx.save();
      strokeRoundedRectCanvas(ctx, pad, pad, W - pad * 2, H - pad * 2, rPx);
      ctx.shadowColor = 'rgba(255, 102, 74, 0.86)';
      ctx.shadowBlur = 78;
      ctx.lineWidth = 20;
      ctx.strokeStyle = 'rgba(255, 96, 68, 0.52)';
      ctx.stroke();

      ctx.shadowBlur = 32;
      ctx.lineWidth = 10;
      ctx.strokeStyle = 'rgba(255, 124, 92, 0.72)';
      ctx.stroke();
      ctx.restore();

      const tex = new THREE.CanvasTexture(canvas);
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.anisotropy = maxAniso;
      return tex;
    }

    function createTypographyLayerTextures() {
      const W = 2560;
      const H = 790;

      const canvas = document.createElement('canvas');
      canvas.width = W;
      canvas.height = H;
      const ctx = canvas.getContext('2d');

      const bumpCanvas = document.createElement('canvas');
      bumpCanvas.width = W;
      bumpCanvas.height = H;
      const bCtx = bumpCanvas.getContext('2d');

      ctx.clearRect(0, 0, W, H);
      bCtx.fillStyle = '#000000';
      bCtx.fillRect(0, 0, W, H);

      const text = 'React Query';
      const fontFamily = '"Inter", "SF Pro Display", "Segoe UI", "Roboto", "Helvetica Neue", Arial, sans-serif';
      let fontSize = Math.round(H * 0.415);
      const maxTextWidth = W * 0.595;

      ctx.font = `600 ${fontSize}px ${fontFamily}`;
      const measuredW = ctx.measureText(text).width;
      if (measuredW > maxTextWidth) {
        fontSize = Math.round(fontSize * (maxTextWidth / measuredW));
      }

      const fontSpec = `600 ${fontSize}px ${fontFamily}`;
      ctx.font = fontSpec;
      ctx.textAlign = 'left';
      ctx.textBaseline = 'alphabetic';

      const textX = W * 0.308;
      const textY = H * 0.625;

      ctx.save();
      ctx.shadowColor = 'rgba(255, 175, 155, 0.42)';
      ctx.shadowBlur = 16;
      ctx.fillStyle = '#FFF9F7';
      ctx.fillText(text, textX, textY);
      ctx.restore();

      ctx.save();
      ctx.shadowColor = 'rgba(255, 255, 255, 0.45)';
      ctx.shadowBlur = 4;
      ctx.fillStyle = '#FFFFFF';
      ctx.fillText(text, textX, textY);
      ctx.restore();

      bCtx.font = fontSpec;
      bCtx.textAlign = 'left';
      bCtx.textBaseline = 'alphabetic';
      bCtx.shadowColor = 'rgba(200, 200, 200, 0.85)';
      bCtx.shadowBlur = 6;
      bCtx.fillStyle = '#ffffff';
      bCtx.fillText(text, textX, textY);

      const mapTex = new THREE.CanvasTexture(canvas);
      mapTex.colorSpace = THREE.SRGBColorSpace;
      mapTex.anisotropy = maxAniso;

      const bumpTex = new THREE.CanvasTexture(bumpCanvas);
      bumpTex.anisotropy = maxAniso;

      return { mapTex, bumpTex };
    }

    function createHaloTexture() {
      const W = 2048;
      const H = 1024;
      const canvas = document.createElement('canvas');
      canvas.width = W;
      canvas.height = H;
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, W, H);

      const rectW = W * 0.675;
      const rectH = H * 0.425;
      const rectX = (W - rectW) / 2;
      const rectY = (H - rectH) / 2;
      const rPx = (CORNER_R / BADGE_H) * rectH;

      const passes = [
        { blur: 130, alpha: 0.24, lw: 34 },
        { blur: 82,  alpha: 0.34, lw: 26 },
        { blur: 46,  alpha: 0.44, lw: 18 },
        { blur: 22,  alpha: 0.52, lw: 12 }
      ];

      passes.forEach((p) => {
        ctx.save();
        strokeRoundedRectCanvas(ctx, rectX, rectY, rectW, rectH, rPx);
        ctx.shadowColor = `rgba(255, 92, 62, ${p.alpha})`;
        ctx.shadowBlur = p.blur;
        ctx.lineWidth = p.lw;
        ctx.strokeStyle = `rgba(255, 92, 62, ${p.alpha * 0.55})`;
        ctx.stroke();
        ctx.restore();
      });

      const tex = new THREE.CanvasTexture(canvas);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    function createBillboardAuraTexture() {
      const S = 1024;
      const canvas = document.createElement('canvas');
      canvas.width = S;
      canvas.height = S;
      const ctx = canvas.getContext('2d');

      ctx.save();
      ctx.translate(S / 2, S / 2);
      ctx.scale(1.0, 0.52);
      const grad = ctx.createRadialGradient(0, 0, S * 0.14, 0, 0, S * 0.48);
      grad.addColorStop(0, 'rgba(255, 92, 62, 0.28)');
      grad.addColorStop(0.45, 'rgba(255, 92, 62, 0.13)');
      grad.addColorStop(0.75, 'rgba(255, 92, 62, 0.04)');
      grad.addColorStop(1, 'rgba(255, 92, 62, 0.0)');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(0, 0, S * 0.48, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      const tex = new THREE.CanvasTexture(canvas);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    // 5. BUILD PHYSICAL 3D DOUBLE-SIDED MODEL
    const badgeRoot = new THREE.Group();
    scene.add(badgeRoot);

    const smokyBurgundyTex = createSmokyBurgundyTexture();
    const { mapTex: typoColorTex, bumpTex: typoBumpTex } = createTypographyLayerTextures();

    // 5A. Extruded Physical Pill Body with 14-Segment Rounded Bevels
    const bodyShape = createRoundedRectShape(BADGE_W, BADGE_H, CORNER_R);
    const bodyGeo = new THREE.ExtrudeGeometry(bodyShape, {
      depth: BODY_DEPTH,
      bevelEnabled: true,
      bevelThickness: BEVEL_THICKNESS,
      bevelSize: BEVEL_SIZE,
      bevelSegments: 14,
      curveSegments: 56
    });
    bodyGeo.center();

    {
      const pos = bodyGeo.attributes.position;
      const uv = bodyGeo.attributes.uv;
      const totalW = BADGE_W + BEVEL_SIZE * 2;
      const totalH = BADGE_H + BEVEL_SIZE * 2;
      for (let i = 0; i < pos.count; i++) {
        uv.setXY(i, (pos.getX(i) / totalW) + 0.5, (pos.getY(i) / totalH) + 0.5);
      }
      uv.needsUpdate = true;
    }

    const bodyMaterial = new THREE.MeshPhysicalMaterial({
      map: smokyBurgundyTex,
      color: 0xffffff,
      roughness: 0.16,
      metalness: 0.08,
      clearcoat: 1.0,
      clearcoatRoughness: 0.06,
      ior: 1.52,
      reflectivity: 0.92,
      envMapIntensity: 1.3
    });

    badgeRoot.add(new THREE.Mesh(bodyGeo, bodyMaterial));

    // 5B. 3D Coral-Orange Perimeter Bevel Tubes
    const neonCoralMat = new THREE.MeshPhysicalMaterial({
      color: 0xff6e54,
      emissive: 0xf24a34,
      emissiveIntensity: 0.98,
      roughness: 0.15,
      metalness: 0.05,
      clearcoat: 1.0,
      clearcoatRoughness: 0.05,
      envMapIntensity: 1.15
    });

    function createRimTube(w, h, r, zPos, tubeRadius) {
      const pts = createRoundedRectCurvePoints(w, h, r, zPos);
      const curve = new THREE.CatmullRomCurve3(pts, true);
      const geo = new THREE.TubeGeometry(curve, 180, tubeRadius, 14, true);
      return new THREE.Mesh(geo, neonCoralMat);
    }

    const rimZ = BODY_DEPTH / 2 + BEVEL_THICKNESS * 0.64;
    badgeRoot.add(createRimTube(BADGE_W + 0.022, BADGE_H + 0.022, CORNER_R + 0.011, rimZ, 0.022));
    badgeRoot.add(createRimTube(BADGE_W + 0.022, BADGE_H + 0.022, CORNER_R + 0.011, -rimZ, 0.022));
    badgeRoot.add(createRimTube(BADGE_W + BEVEL_SIZE * 1.85, BADGE_H + BEVEL_SIZE * 1.85, CORNER_R + BEVEL_SIZE * 0.92, 0, 0.018));

    // 5C. Front & Back Raised Face Assemblies (3D React Query Emblem + Supersampled Typography)
    const facePlateShape = createRoundedRectShape(BADGE_W - 0.04, BADGE_H - 0.04, CORNER_R - 0.02);
    const facePlateGeo = new THREE.ShapeGeometry(facePlateShape, 48);
    {
      const pos = facePlateGeo.attributes.position;
      const uv = facePlateGeo.attributes.uv;
      for (let i = 0; i < pos.count; i++) {
        uv.setXY(i, (pos.getX(i) / BADGE_W) + 0.5, (pos.getY(i) / BADGE_H) + 0.5);
      }
      uv.needsUpdate = true;
    }

    const typoMaterial = new THREE.MeshPhysicalMaterial({
      map: typoColorTex,
      bumpMap: typoBumpTex,
      bumpScale: 0.008,
      emissive: 0xfff5f2,
      emissiveMap: typoColorTex,
      emissiveIntensity: 0.42,
      transparent: true,
      alphaTest: 0.01,
      roughness: 0.15,
      metalness: 0.02,
      clearcoat: 1.0,
      clearcoatRoughness: 0.05,
      depthWrite: false
    });

    // Helper: Rounded Polygon Shape (for the flat-top central hexagon)
    function createRoundedPolygonShape(sides, radius, cornerRadius, rotation = 0) {
      const shape = new THREE.Shape();
      const step = (Math.PI * 2) / sides;
      const cr = Math.min(cornerRadius, radius * 0.45);
      const dist = radius - cr / Math.cos(Math.PI / sides);

      for (let i = 0; i < sides; i++) {
        const a = rotation + i * step;
        const cx = Math.cos(a) * dist;
        const cy = Math.sin(a) * dist;
        const startA = a - step / 2;
        const endA = a + step / 2;
        if (i === 0) {
          shape.moveTo(cx + Math.cos(startA) * cr, cy + Math.sin(startA) * cr);
        }
        shape.absarc(cx, cy, cr, startA, endA, false);
      }
      shape.closePath();
      return shape;
    }

    // Helpers for the 6-fold swirling React Query petals (matching the reference icon)
    function cubicBezier2D(p0, p1, p2, p3, t) {
      const u = 1 - t;
      const u2 = u * u;
      const t2 = t * t;
      return {
        x: u2 * u * p0.x + 3 * u2 * t * p1.x + 3 * u * t2 * p2.x + t2 * t * p3.x,
        y: u2 * u * p0.y + 3 * u2 * t * p1.y + 3 * u * t2 * p2.y + t2 * t * p3.y
      };
    }

    function rotatePt2D(pt, ang) {
      const c = Math.cos(ang);
      const s = Math.sin(ang);
      return { x: pt.x * c - pt.y * s, y: pt.x * s + pt.y * c };
    }

    // Offset a counter-clockwise closed polygon (dist > 0 shifts inward, dist < 0 shifts outward)
    function offsetClosedPolygon(pts, dist) {
      const n = pts.length;
      const out = [];
      for (let i = 0; i < n; i++) {
        const prev = pts[(i - 1 + n) % n];
        const curr = pts[i];
        const next = pts[(i + 1) % n];

        let dx1 = curr.x - prev.x;
        let dy1 = curr.y - prev.y;
        const l1 = Math.hypot(dx1, dy1) || 1;
        dx1 /= l1; dy1 /= l1;

        let dx2 = next.x - curr.x;
        let dy2 = next.y - curr.y;
        const l2 = Math.hypot(dx2, dy2) || 1;
        dx2 /= l2; dy2 /= l2;

        // Left-hand inward normals
        const nx1 = -dy1, ny1 = dx1;
        const nx2 = -dy2, ny2 = dx2;
        let nx = nx1 + nx2;
        let ny = ny1 + ny2;
        const nl = Math.hypot(nx, ny);
        if (nl < 1e-4) {
          nx = nx1; ny = ny1;
        } else {
          nx /= nl; ny /= nl;
        }
        const dot = Math.max(0.55, nx * nx1 + ny * ny1);
        const scale = Math.min(1.45, 1 / dot);
        out.push({ x: curr.x + nx * dist * scale, y: curr.y + ny * dist * scale });
      }
      return out;
    }

    const SEAM_P0 = { x: 0.059, y: -0.102 };
    const SEAM_P1 = { x: 0.145, y: -0.165 };
    const SEAM_P2 = { x: 0.280, y: -0.115 };
    const SEAM_P3 = { x: 0.285, y: -0.025 };
    const NOTCH_T = 0.38;
    const NOTCH_PT = rotatePt2D(cubicBezier2D(SEAM_P0, SEAM_P1, SEAM_P2, SEAM_P3, NOTCH_T), Math.PI / 3);
    const BACK_Q1 = { x: 0.288, y: 0.018 };
    const BACK_Q2 = { x: 0.242, y: 0.060 };

    // Single interlocking red petal (inset along seams so dark outline backing shows cleanly)
    function createSwirlPetalShape() {
      const pts = [];
      const cwSteps = 22;
      for (let i = 0; i < cwSteps; i++) {
        pts.push(cubicBezier2D(SEAM_P0, SEAM_P1, SEAM_P2, SEAM_P3, i / cwSteps));
      }
      const backSteps = 16;
      for (let i = 0; i < backSteps; i++) {
        pts.push(cubicBezier2D(SEAM_P3, BACK_Q1, BACK_Q2, NOTCH_PT, i / backSteps));
      }
      const ccwSteps = 12;
      for (let i = 0; i <= ccwSteps; i++) {
        const t = NOTCH_T * (1 - i / ccwSteps);
        pts.push(rotatePt2D(cubicBezier2D(SEAM_P0, SEAM_P1, SEAM_P2, SEAM_P3, t), Math.PI / 3));
      }
      // Hidden inner closure tucked cleanly beneath the central hexagon
      pts.push({ x: 0.072, y: 0.0 });
      pts.push({ x: 0.036, y: -0.062 });

      const insetPts = offsetClosedPolygon(pts, 0.0072);
      const shape = new THREE.Shape();
      insetPts.forEach((p, idx) => {
        if (idx === 0) shape.moveTo(p.x, p.y);
        else shape.lineTo(p.x, p.y);
      });
      shape.closePath();
      return shape;
    }

    // Unified 6-petal dark outline base plate (zero cracks, uniform outer silhouette)
    function createFlowerOutlineShape() {
      const rawPts = [];
      const outerSteps = 18;
      const backSteps = 16;
      for (let sector = 0; sector < 6; sector++) {
        const ang = sector * (Math.PI / 3);
        for (let i = 0; i < outerSteps; i++) {
          const t = NOTCH_T + (1 - NOTCH_T) * (i / outerSteps);
          rawPts.push(rotatePt2D(cubicBezier2D(SEAM_P0, SEAM_P1, SEAM_P2, SEAM_P3, t), ang));
        }
        for (let i = 0; i < backSteps; i++) {
          rawPts.push(rotatePt2D(cubicBezier2D(SEAM_P3, BACK_Q1, BACK_Q2, NOTCH_PT, i / backSteps), ang));
        }
      }

      const outerPts = offsetClosedPolygon(rawPts, -0.0095);
      const shape = new THREE.Shape();
      outerPts.forEach((p, idx) => {
        if (idx === 0) shape.moveTo(p.x, p.y);
        else shape.lineTo(p.x, p.y);
      });
      shape.closePath();
      return shape;
    }

    // Helper: Dark Inner Ring + Core Query Detail inside Yellow Hexagon
    function createCenterRingShape(outerR, innerR) {
      const shape = new THREE.Shape();
      shape.absarc(0, 0, outerR, 0, Math.PI * 2, false);
      const hole = new THREE.Path();
      hole.absarc(0, 0, innerR, 0, Math.PI * 2, true);
      shape.holes.push(hole);
      return shape;
    }

    // Build shared 3D geometries for the React Query Emblem
    const petalOutlineGeo = new THREE.ExtrudeGeometry(createFlowerOutlineShape(), {
      depth: 0.010,
      bevelEnabled: true,
      bevelThickness: 0.004,
      bevelSize: 0.003,
      bevelSegments: 6,
      curveSegments: 32
    });

    const petalRedGeo = new THREE.ExtrudeGeometry(createSwirlPetalShape(), {
      depth: 0.011,
      bevelEnabled: true,
      bevelThickness: 0.004,
      bevelSize: 0.003,
      bevelSegments: 8,
      curveSegments: 32
    });

    // Flat-top central hexagon (rotation = 0)
    const hexDarkGeo = new THREE.ExtrudeGeometry(
      createRoundedPolygonShape(6, 0.132, 0.022, 0),
      {
        depth: 0.014,
        bevelEnabled: true,
        bevelThickness: 0.004,
        bevelSize: 0.0035,
        bevelSegments: 6
      }
    );

    const hexYellowGeo = new THREE.ExtrudeGeometry(
      createRoundedPolygonShape(6, 0.106, 0.018, 0),
      {
        depth: 0.010,
        bevelEnabled: true,
        bevelThickness: 0.0035,
        bevelSize: 0.003,
        bevelSegments: 6
      }
    );

    const centerRingGeo = new THREE.ExtrudeGeometry(
      createCenterRingShape(0.056, 0.034),
      {
        depth: 0.005,
        bevelEnabled: true,
        bevelThickness: 0.002,
        bevelSize: 0.0018,
        bevelSegments: 4,
        curveSegments: 28
      }
    );

    const centerCoreShape = new THREE.Shape();
    centerCoreShape.absarc(0, 0, 0.012, 0, Math.PI * 2, false);
    const centerCoreGeo = new THREE.ExtrudeGeometry(centerCoreShape, {
      depth: 0.005,
      bevelEnabled: true,
      bevelThickness: 0.002,
      bevelSize: 0.0018,
      bevelSegments: 4,
      curveSegments: 20
    });

    const centerTickShape = createRoundedRectShape(0.011, 0.026, 0.004);
    const centerTickGeo = new THREE.ExtrudeGeometry(centerTickShape, {
      depth: 0.005,
      bevelEnabled: true,
      bevelThickness: 0.002,
      bevelSize: 0.0015,
      bevelSegments: 4
    });

    // Materials for the 3D React Query Emblem
    const darkOutlineMat = new THREE.MeshPhysicalMaterial({
      color: 0x18091f,
      emissive: 0x09030e,
      emissiveIntensity: 0.3,
      roughness: 0.22,
      metalness: 0.15,
      clearcoat: 1.0,
      clearcoatRoughness: 0.08
    });

    const petalRedMat = new THREE.MeshPhysicalMaterial({
      color: 0xff5252,
      emissive: 0xe63638,
      emissiveIntensity: 0.78,
      roughness: 0.16,
      metalness: 0.05,
      clearcoat: 1.0,
      clearcoatRoughness: 0.05
    });

    const hexYellowMat = new THREE.MeshPhysicalMaterial({
      color: 0xf6d564,
      emissive: 0xdba828,
      emissiveIntensity: 0.58,
      roughness: 0.16,
      metalness: 0.06,
      clearcoat: 1.0,
      clearcoatRoughness: 0.05
    });

    function createReactQueryIcon3D() {
      const iconGroup = new THREE.Group();

      const outlineMesh = new THREE.Mesh(petalOutlineGeo, darkOutlineMat);
      outlineMesh.position.z = 0.004;
      iconGroup.add(outlineMesh);

      for (let i = 0; i < 6; i++) {
        const redMesh = new THREE.Mesh(petalRedGeo, petalRedMat);
        redMesh.rotation.z = i * (Math.PI / 3);
        redMesh.position.z = 0.009;
        iconGroup.add(redMesh);
      }

      const hexDarkMesh = new THREE.Mesh(hexDarkGeo, darkOutlineMat);
      hexDarkMesh.position.z = 0.011;
      iconGroup.add(hexDarkMesh);

      const hexYellowMesh = new THREE.Mesh(hexYellowGeo, hexYellowMat);
      hexYellowMesh.position.z = 0.0205;
      iconGroup.add(hexYellowMesh);

      const ringMesh = new THREE.Mesh(centerRingGeo, darkOutlineMat);
      ringMesh.position.z = 0.031;
      iconGroup.add(ringMesh);

      const coreMesh = new THREE.Mesh(centerCoreGeo, darkOutlineMat);
      coreMesh.position.z = 0.031;
      iconGroup.add(coreMesh);

      const tickMesh = new THREE.Mesh(centerTickGeo, darkOutlineMat);
      tickMesh.position.set(0, 0.018, 0.031);
      iconGroup.add(tickMesh);

      return iconGroup;
    }

    function createFaceDetailGroup() {
      const group = new THREE.Group();

      const typoMesh = new THREE.Mesh(facePlateGeo, typoMaterial);
      typoMesh.position.z = TOTAL_HALF_Z + 0.0025;
      group.add(typoMesh);

      const iconGroup = createReactQueryIcon3D();
      iconGroup.position.set(-1.04, 0.0, TOTAL_HALF_Z + 0.0005);
      group.add(iconGroup);

      return group;
    }

    badgeRoot.add(createFaceDetailGroup());

    const backFace = createFaceDetailGroup();
    backFace.rotation.y = Math.PI;
    badgeRoot.add(backFace);

    // 5D. Outer Coral-Orange Neon Halo on Pure #FFFFFF Background
    const haloMat = new THREE.MeshBasicMaterial({
      map: createHaloTexture(),
      transparent: true,
      opacity: 0.95,
      depthWrite: false,
      side: THREE.DoubleSide
    });
    const haloMesh = new THREE.Mesh(new THREE.PlaneGeometry(4.8, 2.35), haloMat);
    haloMesh.renderOrder = -2;
    badgeRoot.add(haloMesh);

    const auraMat = new THREE.SpriteMaterial({
      map: createBillboardAuraTexture(),
      transparent: true,
      opacity: 0.45,
      depthWrite: false
    });
    const auraSprite = new THREE.Sprite(auraMat);
    auraSprite.scale.set(4.6, 4.6, 1);
    auraSprite.renderOrder = -3;
    scene.add(auraSprite);

    // 6. 360° ORBIT CONTROLS, IDLE FLOAT, HOVER MICRO-TILT & DOUBLE-CLICK RESET
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.copy(INITIAL_TARGET);
    controls.enableDamping = true;
    controls.dampingFactor = 0.065;
    controls.enablePan = false;
    controls.rotateSpeed = 0.85;
    controls.zoomSpeed = 0.9;
    controls.minDistance = 2.0;
    controls.maxDistance = 8.5;
    controls.update();

    let isDragging = false;
    let isPointerInside = false;
    let pointerNX = 0;
    let pointerNY = 0;
    let isResetting = false;

    const resetStartCam = new THREE.Vector3();
    const resetStartTarget = new THREE.Vector3();
    let resetProgress = 0;

    controls.addEventListener('start', () => {
      isDragging = true;
      isResetting = false;
    });
    controls.addEventListener('end', () => {
      isDragging = false;
    });

    const domEl = renderer.domElement;
    domEl.addEventListener('pointermove', (e) => {
      isPointerInside = true;
      pointerNX = (e.clientX / window.innerWidth) * 2 - 1;
      pointerNY = (e.clientY / window.innerHeight) * 2 - 1;
    });
    domEl.addEventListener('pointerleave', () => {
      isPointerInside = false;
      pointerNX = 0;
      pointerNY = 0;
    });
    domEl.addEventListener('dblclick', () => {
      resetStartCam.copy(camera.position);
      resetStartTarget.copy(controls.target);
      resetProgress = 0;
      isResetting = true;
    });

    // 7. RESIZE & ANIMATION LOOP
    window.addEventListener('resize', () => {
      const w = window.innerWidth;
      const h = window.innerHeight;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    });

    const clock = new THREE.Clock();
    const viewDir = new THREE.Vector3();

    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), 0.05);
      const elapsed = clock.elapsedTime;

      if (isResetting) {
        resetProgress = Math.min(resetProgress + dt * 2.4, 1);
        const ease = 1 - Math.pow(1 - resetProgress, 3);
        camera.position.lerpVectors(resetStartCam, INITIAL_CAM_POS, ease);
        controls.target.lerpVectors(resetStartTarget, INITIAL_TARGET, ease);
        if (resetProgress >= 1) isResetting = false;
      }

      const idleFloatY = Math.sin(elapsed * 1.45) * 0.022;
      const idleRotX = Math.sin(elapsed * 0.95) * 0.012;
      const idleRotY = Math.cos(elapsed * 0.75) * 0.015;

      const targetTiltY = (!isDragging && isPointerInside) ? pointerNX * 0.085 : 0;
      const targetTiltX = (!isDragging && isPointerInside) ? pointerNY * 0.065 : 0;

      badgeRoot.position.y = THREE.MathUtils.lerp(badgeRoot.position.y, idleFloatY, 0.08);
      badgeRoot.rotation.x = THREE.MathUtils.lerp(badgeRoot.rotation.x, targetTiltX + idleRotX, 0.07);
      badgeRoot.rotation.y = THREE.MathUtils.lerp(badgeRoot.rotation.y, targetTiltY + idleRotY, 0.07);

      auraSprite.position.y = badgeRoot.position.y;
      viewDir.subVectors(camera.position, controls.target).normalize();
      const edgeFactor = 1.0 - Math.abs(viewDir.z);
      haloMat.opacity = 0.95 * (1.0 - edgeFactor * 0.65);
      auraMat.opacity = 0.35 + edgeFactor * 0.28;

      controls.update();
      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>

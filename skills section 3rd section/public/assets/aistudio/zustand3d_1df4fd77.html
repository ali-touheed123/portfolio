<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Zustand — 3D Interactive Model</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #ffffff;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: grab;
      outline: none;
    }
    canvas:active { cursor: grabbing; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // 1. RENDERER, SCENE & CAMERA
    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      alpha: true,
      powerPreference: 'high-performance'
    });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.06;
    renderer.setClearColor(0xffffff, 0);
    document.body.appendChild(renderer.domElement);

    const scene = new THREE.Scene();

    const INITIAL_CAM_POS = new THREE.Vector3(0, 0, 4.25);
    const INITIAL_TARGET = new THREE.Vector3(0, 0, 0);

    const camera = new THREE.PerspectiveCamera(36, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.copy(INITIAL_CAM_POS);

    // 2. PROCEDURAL 360° WARM STUDIO ENVIRONMENT (PMREM) & BALANCED LIGHTING
    function createStudioEnv(glRenderer) {
      const pmrem = new THREE.PMREMGenerator(glRenderer);
      pmrem.compileEquirectangularShader();
      const envScene = new THREE.Scene();
      envScene.background = new THREE.Color(0x241306);

      const addPanel = (w, h, color, intensity, pos) => {
        const geo = new THREE.PlaneGeometry(w, h);
        const mat = new THREE.MeshBasicMaterial({
          color: new THREE.Color(color).multiplyScalar(intensity),
          side: THREE.DoubleSide
        });
        const mesh = new THREE.Mesh(geo, mat);
        mesh.position.set(...pos);
        mesh.lookAt(0, 0, 0);
        envScene.add(mesh);
      };

      addPanel(10, 5, 0xffffff, 2.1, [0, 3.2, 8]);
      addPanel(10, 5, 0xffd7ad, 1.35, [0, -3.5, 8]);
      addPanel(10, 5, 0xffffff, 2.1, [0, 3.2, -8]);
      addPanel(10, 5, 0xffd7ad, 1.35, [0, -3.5, -8]);
      addPanel(12, 6, 0xfff3e4, 1.9, [0, 8.5, 0]);
      addPanel(12, 6, 0xffaa4f, 1.05, [0, -8.5, 0]);
      addPanel(6, 8, 0xffcfa0, 1.5, [9, 0.5, 0]);
      addPanel(6, 8, 0xffcfa0, 1.5, [-9, 0.5, 0]);

      const rt = pmrem.fromScene(envScene, 0.04);
      pmrem.dispose();
      return rt.texture;
    }

    scene.environment = createStudioEnv(renderer);
    scene.add(new THREE.AmbientLight(0xffe9d1, 0.85));

    const addDirLight = (color, intensity, pos) => {
      const l = new THREE.DirectionalLight(color, intensity);
      l.position.set(...pos);
      scene.add(l);
    };
    addDirLight(0xffffff, 1.35, [2.5, 3.5, 5.5]);
    addDirLight(0xffa94d, 0.65, [-3.5, -2.0, 4.5]);
    addDirLight(0xffffff, 1.35, [-2.5, 3.5, -5.5]);
    addDirLight(0xffa94d, 0.65, [3.5, -2.0, -4.5]);

    // 3. EXACT BADGE DIMENSIONS & GEOMETRY HELPERS
    const BADGE_W = 3.00;
    const BADGE_H = 1.00;
    const CORNER_R = 0.33;
    const BODY_DEPTH = 0.12;
    const BEVEL_THICKNESS = 0.042;
    const BEVEL_SIZE = 0.036;
    const TOTAL_HALF_Z = BODY_DEPTH / 2 + BEVEL_THICKNESS;

    function createRoundedRectShape(w, h, r) {
      const hw = w / 2;
      const hh = h / 2;
      const rad = Math.min(r, hw, hh);
      const s = new THREE.Shape();
      s.moveTo(-hw + rad, -hh);
      s.lineTo(hw - rad, -hh);
      s.absarc(hw - rad, -hh + rad, rad, -Math.PI / 2, 0, false);
      s.lineTo(hw, hh - rad);
      s.absarc(hw - rad, hh - rad, rad, 0, Math.PI / 2, false);
      s.lineTo(-hw + rad, hh);
      s.absarc(-hw + rad, hh - rad, rad, Math.PI / 2, Math.PI, false);
      s.lineTo(-hw, -hh + rad);
      s.absarc(-hw + rad, -hh + rad, rad, Math.PI, Math.PI * 1.5, false);
      return s;
    }

    function createRoundedRectCurvePoints(w, h, r, z = 0) {
      const hw = w / 2;
      const hh = h / 2;
      const rad = Math.min(r, hw, hh);
      const pts = [];
      const cornerSteps = 22;
      const straightSteps = 10;

      const pushLine = (x0, y0, x1, y1) => {
        for (let i = 0; i < straightSteps; i++) {
          const t = i / straightSteps;
          pts.push(new THREE.Vector3(x0 + (x1 - x0) * t, y0 + (y1 - y0) * t, z));
        }
      };
      const pushArc = (cx, cy, a0, a1) => {
        for (let i = 0; i < cornerSteps; i++) {
          const a = a0 + (a1 - a0) * (i / cornerSteps);
          pts.push(new THREE.Vector3(cx + Math.cos(a) * rad, cy + Math.sin(a) * rad, z));
        }
      };

      pushLine(-hw + rad, -hh, hw - rad, -hh);
      pushArc(hw - rad, -hh + rad, -Math.PI / 2, 0);
      pushLine(hw, -hh + rad, hw, hh - rad);
      pushArc(hw - rad, hh - rad, 0, Math.PI / 2);
      pushLine(hw - rad, hh, -hw + rad, hh);
      pushArc(-hw + rad, hh - rad, Math.PI / 2, Math.PI);
      pushLine(-hw, hh - rad, -hw, -hh + rad);
      pushArc(-hw + rad, -hh + rad, Math.PI, Math.PI * 1.5);
      return pts;
    }

    function strokeRoundedRectCanvas(ctx, x, y, w, h, r) {
      const rad = Math.min(r, w / 2, h / 2);
      ctx.beginPath();
      ctx.moveTo(x + rad, y);
      ctx.lineTo(x + w - rad, y);
      ctx.arcTo(x + w, y, x + w, y + rad, rad);
      ctx.lineTo(x + w, y + h - rad);
      ctx.arcTo(x + w, y + h, x + w - rad, y + h, rad);
      ctx.lineTo(x + rad, y + h);
      ctx.arcTo(x, y + h, x, y + h - rad, rad);
      ctx.lineTo(x, y + rad);
      ctx.arcTo(x, y, x + rad, y, rad);
      ctx.closePath();
    }

    // 4. HIGH-DPI PROCEDURAL TEXTURES (2560x854 SUPERSAMPLED)
    const maxAniso = renderer.capabilities.getMaxAnisotropy();

    function createSmokyBrownTexture() {
      const W = 2560;
      const H = 854;
      const canvas = document.createElement('canvas');
      canvas.width = W;
      canvas.height = H;
      const ctx = canvas.getContext('2d');

      const bg = ctx.createLinearGradient(0, 0, W, H);
      bg.addColorStop(0, '#4c2f14');
      bg.addColorStop(0.35, '#3b230d');
      bg.addColorStop(0.7, '#2b1808');
      bg.addColorStop(1, '#462a10');
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, W, H);

      let seed = 7391;
      const rand = () => {
        seed = (seed * 16807) % 2147483647;
        return (seed - 1) / 2147483646;
      };

      for (let i = 0; i < 68; i++) {
        const cx = rand() * W;
        const cy = rand() * H;
        const rx = 160 + rand() * 420;
        const ry = 70 + rand() * 190;
        const angle = (rand() - 0.5) * 0.85;
        const isLight = rand() > 0.44;

        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(angle);
        ctx.scale(1, ry / rx);
        const grad = ctx.createRadialGradient(0, 0, 0, 0, 0, rx);
        if (isLight) {
          grad.addColorStop(0, 'rgba(165, 102, 42, 0.14)');
          grad.addColorStop(0.55, 'rgba(120, 70, 24, 0.06)');
          grad.addColorStop(1, 'rgba(60, 32, 10, 0)');
        } else {
          grad.addColorStop(0, 'rgba(20, 10, 3, 0.22)');
          grad.addColorStop(0.6, 'rgba(30, 16, 6, 0.09)');
          grad.addColorStop(1, 'rgba(30, 16, 6, 0)');
        }
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(0, 0, rx, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      // Soft inner warm amber-orange edge glow
      const pad = 22;
      const rPx = (CORNER_R / BADGE_H) * (H - pad * 2);
      ctx.save();
      strokeRoundedRectCanvas(ctx, pad, pad, W - pad * 2, H - pad * 2, rPx);
      ctx.shadowColor = 'rgba(255, 164, 68, 0.85)';
      ctx.shadowBlur = 78;
      ctx.lineWidth = 20;
      ctx.strokeStyle = 'rgba(245, 152, 54, 0.56)';
      ctx.stroke();

      ctx.shadowBlur = 32;
      ctx.lineWidth = 10;
      ctx.strokeStyle = 'rgba(255, 184, 96, 0.72)';
      ctx.stroke();
      ctx.restore();

      const tex = new THREE.CanvasTexture(canvas);
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.anisotropy = maxAniso;
      return tex;
    }

    function createTypographyLayerTextures() {
      const W = 2560;
      const H = 854;

      const canvas = document.createElement('canvas');
      canvas.width = W;
      canvas.height = H;
      const ctx = canvas.getContext('2d');

      const bumpCanvas = document.createElement('canvas');
      bumpCanvas.width = W;
      bumpCanvas.height = H;
      const bCtx = bumpCanvas.getContext('2d');

      ctx.clearRect(0, 0, W, H);
      bCtx.fillStyle = '#000000';
      bCtx.fillRect(0, 0, W, H);

      const text = 'Zustand';
      const fontFamily = '"Inter", "SF Pro Display", "Segoe UI", "Roboto", "Helvetica Neue", Arial, sans-serif';
      let fontSize = Math.round(H * 0.45);
      const maxTextWidth = W * 0.51;

      ctx.font = `700 ${fontSize}px ${fontFamily}`;
      const measuredW = ctx.measureText(text).width;
      if (measuredW > maxTextWidth) {
        fontSize = Math.round(fontSize * (maxTextWidth / measuredW));
      }

      const fontSpec = `700 ${fontSize}px ${fontFamily}`;
      ctx.font = fontSpec;
      ctx.textAlign = 'left';
      ctx.textBaseline = 'middle';

      const textX = W * 0.375;
      const textY = H * 0.515;

      ctx.save();
      ctx.shadowColor = 'rgba(255, 232, 200, 0.48)';
      ctx.shadowBlur = 14;
      ctx.fillStyle = '#FFFFFF';
      ctx.fillText(text, textX, textY);
      ctx.restore();

      ctx.save();
      ctx.shadowColor = 'rgba(255, 255, 255, 0.35)';
      ctx.shadowBlur = 4;
      ctx.fillStyle = '#FFFFFF';
      ctx.fillText(text, textX, textY);
      ctx.restore();

      bCtx.font = fontSpec;
      bCtx.textAlign = 'left';
      bCtx.textBaseline = 'middle';
      bCtx.shadowColor = 'rgba(220, 220, 220, 0.85)';
      bCtx.shadowBlur = 6;
      bCtx.fillStyle = '#ffffff';
      bCtx.fillText(text, textX, textY);

      const mapTex = new THREE.CanvasTexture(canvas);
      mapTex.colorSpace = THREE.SRGBColorSpace;
      mapTex.anisotropy = maxAniso;

      const bumpTex = new THREE.CanvasTexture(bumpCanvas);
      bumpTex.anisotropy = maxAniso;

      return { mapTex, bumpTex };
    }

    // Bear Mascot High-DPI Color + Bump Textures (mapped 1:1 onto 3D extruded bear shapes)
    const BEAR_SIZE = 0.82;
    const BEAR_OUTLINE_HEX = '#241108';

    const BEAR_CONTOUR = [
      [0.425, 0.165],
      [0.495, 0.155], [0.525, 0.085], [0.605, 0.075], [0.672, 0.118], [0.675, 0.195], [0.635, 0.245],
      [0.658, 0.305], [0.652, 0.405], [0.595, 0.482],
      [0.670, 0.480], [0.742, 0.440], [0.778, 0.392], [0.808, 0.425], [0.788, 0.495], [0.710, 0.558], [0.618, 0.578],
      [0.632, 0.665], [0.616, 0.785], [0.562, 0.885],
      [0.430, 0.905], [0.290, 0.892],
      [0.218, 0.840], [0.195, 0.720], [0.212, 0.580], [0.246, 0.490],
      [0.194, 0.410], [0.190, 0.310], [0.216, 0.245],
      [0.175, 0.195], [0.178, 0.118], [0.245, 0.075], [0.325, 0.085], [0.355, 0.155]
    ];

    function createBearTextures() {
      const S = 1024;
      const canvas = document.createElement('canvas');
      canvas.width = S;
      canvas.height = S;
      const ctx = canvas.getContext('2d');

      const bumpCanvas = document.createElement('canvas');
      bumpCanvas.width = S;
      bumpCanvas.height = S;
      const bCtx = bumpCanvas.getContext('2d');

      const px = (nx) => nx * S;
      const py = (ny) => ny * S;

      // Fill background with dark outline color so UV borders never bleed light colors
      ctx.fillStyle = BEAR_OUTLINE_HEX;
      ctx.fillRect(0, 0, S, S);

      bCtx.fillStyle = '#202020';
      bCtx.fillRect(0, 0, S, S);

      // Helper: draw circle/ellipse
      const ellipse = (c, nx, ny, rx, ry, rot = 0) => {
        c.beginPath();
        c.ellipse(px(nx), py(ny), px(rx), py(ry), rot, 0, Math.PI * 2);
      };

      // Fur radial gradient
      const furGrad = ctx.createRadialGradient(px(0.41), py(0.32), px(0.05), px(0.44), py(0.55), px(0.45));
      furGrad.addColorStop(0, '#82573b');
      furGrad.addColorStop(0.55, '#6b452c');
      furGrad.addColorStop(1, '#52321e');

      // 1. Ears
      const drawEar = (cx, cy, rot) => {
        ellipse(ctx, cx, cy, 0.088, 0.084, rot);
        ctx.fillStyle = furGrad;
        ctx.fill();
        ctx.lineWidth = px(0.022);
        ctx.strokeStyle = BEAR_OUTLINE_HEX;
        ctx.stroke();

        // Inner cream-tan ear
        ellipse(ctx, cx, cy + 0.006, 0.048, 0.045, rot);
        ctx.fillStyle = '#d7b089';
        ctx.fill();
        ctx.lineWidth = px(0.011);
        ctx.strokeStyle = '#3b1e10';
        ctx.stroke();

        ellipse(bCtx, cx, cy, 0.075, 0.072, rot);
        bCtx.fillStyle = '#888888';
        bCtx.fill();
      };
      drawEar(0.255, 0.160, -0.25);
      drawEar(0.595, 0.160, 0.25);

      // 2. Torso & Left Arm
      ellipse(ctx, 0.425, 0.695, 0.215, 0.215, 0);
      ctx.fillStyle = furGrad;
      ctx.fill();
      ctx.lineWidth = px(0.024);
      ctx.strokeStyle = BEAR_OUTLINE_HEX;
      ctx.stroke();

      // Cream belly patch
      const bellyGrad = ctx.createRadialGradient(px(0.44), py(0.71), px(0.02), px(0.44), py(0.73), px(0.16));
      bellyGrad.addColorStop(0, '#e8c7a3');
      bellyGrad.addColorStop(1, '#c89d73');
      ellipse(ctx, 0.445, 0.725, 0.125, 0.145, 0);
      ctx.fillStyle = bellyGrad;
      ctx.fill();

      // Left curved arm/paw
      ctx.beginPath();
      ctx.moveTo(px(0.275), py(0.50));
      ctx.bezierCurveTo(px(0.195), py(0.58), px(0.195), py(0.76), px(0.255), py(0.845));
      ctx.bezierCurveTo(px(0.295), py(0.885), px(0.355), py(0.855), px(0.345), py(0.795));
      ctx.bezierCurveTo(px(0.335), py(0.745), px(0.285), py(0.685), px(0.305), py(0.57));
      ctx.closePath();
      ctx.fillStyle = furGrad;
      ctx.fill();
      ctx.lineWidth = px(0.020);
      ctx.strokeStyle = BEAR_OUTLINE_HEX;
      ctx.stroke();

      // 3. Raised Right Arm & Paw
      ctx.beginPath();
      ctx.moveTo(px(0.575), py(0.50));
      ctx.bezierCurveTo(px(0.655), py(0.49), px(0.720), py(0.46), px(0.750), py(0.415));
      ctx.bezierCurveTo(px(0.775), py(0.382), px(0.812), py(0.405), px(0.798), py(0.455));
      ctx.bezierCurveTo(px(0.785), py(0.505), px(0.715), py(0.558), px(0.595), py(0.578));
      ctx.closePath();
      ctx.fillStyle = furGrad;
      ctx.fill();
      ctx.lineWidth = px(0.020);
      ctx.strokeStyle = BEAR_OUTLINE_HEX;
      ctx.stroke();

      // Cute little paw pad / finger creases on raised paw
      ctx.beginPath();
      ctx.arc(px(0.768), py(0.438), px(0.015), 0, Math.PI * 2);
      ctx.fillStyle = '#d7b089';
      ctx.fill();

      // 4. Head
      ellipse(ctx, 0.425, 0.325, 0.225, 0.188, 0);
      ctx.fillStyle = furGrad;
      ctx.fill();
      ctx.lineWidth = px(0.024);
      ctx.strokeStyle = BEAR_OUTLINE_HEX;
      ctx.stroke();

      // Subtle brow/cheek highlights on head
      ellipse(ctx, 0.41, 0.23, 0.13, 0.055, -0.05);
      ctx.fillStyle = 'rgba(255, 222, 185, 0.14)';
      ctx.fill();

      // 5. Snout / Muzzle
      const snoutGrad = ctx.createRadialGradient(px(0.45), py(0.37), px(0.01), px(0.455), py(0.395), px(0.11));
      snoutGrad.addColorStop(0, '#edd0ae');
      snoutGrad.addColorStop(1, '#cea479');
      ellipse(ctx, 0.455, 0.395, 0.095, 0.072, 0.04);
      ctx.fillStyle = snoutGrad;
      ctx.fill();
      ctx.lineWidth = px(0.012);
      ctx.strokeStyle = '#3b1e10';
      ctx.stroke();

      // Nose
      ellipse(ctx, 0.468, 0.365, 0.032, 0.022, 0.04);
      ctx.fillStyle = BEAR_OUTLINE_HEX;
      ctx.fill();
      ellipse(ctx, 0.460, 0.358, 0.010, 0.005, -0.2);
      ctx.fillStyle = '#ffffff';
      ctx.fill();

      // Smile
      ctx.beginPath();
      ctx.moveTo(px(0.468), py(0.386));
      ctx.lineTo(px(0.468), py(0.408));
      ctx.moveTo(px(0.428), py(0.408));
      ctx.quadraticCurveTo(px(0.465), py(0.436), px(0.506), py(0.406));
      ctx.lineCap = 'round';
      ctx.lineWidth = px(0.013);
      ctx.strokeStyle = BEAR_OUTLINE_HEX;
      ctx.stroke();

      // 6. Eyes
      const drawEye = (ex, ey) => {
        ellipse(ctx, ex, ey, 0.024, 0.029, 0);
        ctx.fillStyle = BEAR_OUTLINE_HEX;
        ctx.fill();
        ellipse(ctx, ex - 0.007, ey - 0.009, 0.008, 0.009, 0);
        ctx.fillStyle = '#ffffff';
        ctx.fill();
      };
      drawEye(0.355, 0.302);
      drawEye(0.525, 0.298);

      // Tiny friendly brows
      ctx.lineCap = 'round';
      ctx.lineWidth = px(0.011);
      ctx.strokeStyle = BEAR_OUTLINE_HEX;
      ctx.beginPath();
      ctx.arc(px(0.355), py(0.285), px(0.032), Math.PI * 1.15, Math.PI * 1.72);
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(px(0.525), py(0.282), px(0.032), Math.PI * 1.28, Math.PI * 1.85);
      ctx.stroke();

      // 7. Held Cream Oval / Spoon-Acorn above raised paw
      const acX = 0.822;
      const acY = 0.305;
      // Tiny stem
      ctx.beginPath();
      ctx.moveTo(px(0.806), py(0.358));
      ctx.lineTo(px(0.794), py(0.392));
      ctx.lineWidth = px(0.018);
      ctx.strokeStyle = BEAR_OUTLINE_HEX;
      ctx.stroke();

      const acornGrad = ctx.createRadialGradient(px(acX - 0.014), py(acY - 0.020), px(0.006), px(acX), py(acY), px(0.07));
      acornGrad.addColorStop(0, '#fff4e2');
      acornGrad.addColorStop(0.55, '#e8cfa9');
      acornGrad.addColorStop(1, '#bfa078');
      ellipse(ctx, acX, acY, 0.046, 0.064, 0.24);
      ctx.fillStyle = acornGrad;
      ctx.fill();
      ctx.lineWidth = px(0.018);
      ctx.strokeStyle = BEAR_OUTLINE_HEX;
      ctx.stroke();

      // Bump map for 3D sculpted relief on head, snout, belly, paws & held oval
      ellipse(bCtx, 0.425, 0.695, 0.195, 0.195, 0);
      bCtx.fillStyle = '#a0a0a0';
      bCtx.fill();
      ellipse(bCtx, 0.445, 0.725, 0.115, 0.135, 0);
      bCtx.fillStyle = '#c4c4c4';
      bCtx.fill();
      ellipse(bCtx, 0.425, 0.325, 0.210, 0.175, 0);
      bCtx.fillStyle = '#c8c8c8';
      bCtx.fill();
      ellipse(bCtx, 0.455, 0.395, 0.092, 0.068, 0.04);
      bCtx.fillStyle = '#f2f2f2';
      bCtx.fill();
      ellipse(bCtx, acX, acY, 0.042, 0.058, 0.24);
      bCtx.fillStyle = '#efefef';
      bCtx.fill();

      const mapTex = new THREE.CanvasTexture(canvas);
      mapTex.colorSpace = THREE.SRGBColorSpace;
      mapTex.anisotropy = maxAniso;

      const bumpTex = new THREE.CanvasTexture(bumpCanvas);
      bumpTex.anisotropy = maxAniso;

      return { mapTex, bumpTex };
    }

    function createHaloTexture() {
      const W = 2048;
      const H = 1024;
      const canvas = document.createElement('canvas');
      canvas.width = W;
      canvas.height = H;
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, W, H);

      const rectW = W * 0.65;
      const rectH = H * 0.43;
      const rectX = (W - rectW) / 2;
      const rectY = (H - rectH) / 2;
      const rPx = (CORNER_R / BADGE_H) * rectH;

      const passes = [
        { blur: 130, alpha: 0.24, lw: 34 },
        { blur: 82,  alpha: 0.34, lw: 26 },
        { blur: 46,  alpha: 0.44, lw: 18 },
        { blur: 22,  alpha: 0.52, lw: 12 }
      ];

      passes.forEach((p) => {
        ctx.save();
        strokeRoundedRectCanvas(ctx, rectX, rectY, rectW, rectH, rPx);
        ctx.shadowColor = `rgba(244, 150, 56, ${p.alpha})`;
        ctx.shadowBlur = p.blur;
        ctx.lineWidth = p.lw;
        ctx.strokeStyle = `rgba(244, 150, 56, ${p.alpha * 0.55})`;
        ctx.stroke();
        ctx.restore();
      });

      const tex = new THREE.CanvasTexture(canvas);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    function createBillboardAuraTexture() {
      const S = 1024;
      const canvas = document.createElement('canvas');
      canvas.width = S;
      canvas.height = S;
      const ctx = canvas.getContext('2d');

      ctx.save();
      ctx.translate(S / 2, S / 2);
      ctx.scale(1.0, 0.52);
      const grad = ctx.createRadialGradient(0, 0, S * 0.14, 0, 0, S * 0.48);
      grad.addColorStop(0, 'rgba(244, 152, 58, 0.28)');
      grad.addColorStop(0.45, 'rgba(244, 152, 58, 0.12)');
      grad.addColorStop(0.75, 'rgba(244, 152, 58, 0.035)');
      grad.addColorStop(1, 'rgba(244, 152, 58, 0.0)');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(0, 0, S * 0.48, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      const tex = new THREE.CanvasTexture(canvas);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    // 5. BUILD PHYSICAL 3D DOUBLE-SIDED MODEL
    const badgeRoot = new THREE.Group();
    scene.add(badgeRoot);

    const smokyBrownTex = createSmokyBrownTexture();
    const { mapTex: typoColorTex, bumpTex: typoBumpTex } = createTypographyLayerTextures();
    const { mapTex: bearColorTex, bumpTex: bearBumpTex } = createBearTextures();

    // 5A. Extruded Physical Pill Body with 14-Segment Rounded Bevels
    const bodyShape = createRoundedRectShape(BADGE_W, BADGE_H, CORNER_R);
    const bodyGeo = new THREE.ExtrudeGeometry(bodyShape, {
      depth: BODY_DEPTH,
      bevelEnabled: true,
      bevelThickness: BEVEL_THICKNESS,
      bevelSize: BEVEL_SIZE,
      bevelSegments: 14,
      curveSegments: 56
    });
    bodyGeo.center();

    {
      const pos = bodyGeo.attributes.position;
      const uv = bodyGeo.attributes.uv;
      const totalW = BADGE_W + BEVEL_SIZE * 2;
      const totalH = BADGE_H + BEVEL_SIZE * 2;
      for (let i = 0; i < pos.count; i++) {
        uv.setXY(i, (pos.getX(i) / totalW) + 0.5, (pos.getY(i) / totalH) + 0.5);
      }
      uv.needsUpdate = true;
    }

    const bodyMaterial = new THREE.MeshPhysicalMaterial({
      map: smokyBrownTex,
      color: 0xffffff,
      roughness: 0.18,
      metalness: 0.08,
      clearcoat: 1.0,
      clearcoatRoughness: 0.06,
      ior: 1.52,
      reflectivity: 0.92,
      envMapIntensity: 1.25
    });

    badgeRoot.add(new THREE.Mesh(bodyGeo, bodyMaterial));

    // 5B. 3D Warm Amber-Tan Perimeter Bevel Tubes
    const amberRimMat = new THREE.MeshPhysicalMaterial({
      color: 0xf4a046,
      emissive: 0xd97518,
      emissiveIntensity: 0.72,
      roughness: 0.15,
      metalness: 0.06,
      clearcoat: 1.0,
      clearcoatRoughness: 0.05,
      envMapIntensity: 1.1
    });

    function createRimTube(w, h, r, zPos, tubeRadius) {
      const pts = createRoundedRectCurvePoints(w, h, r, zPos);
      const curve = new THREE.CatmullRomCurve3(pts, true);
      const geo = new THREE.TubeGeometry(curve, 180, tubeRadius, 14, true);
      return new THREE.Mesh(geo, amberRimMat);
    }

    const rimZ = BODY_DEPTH / 2 + BEVEL_THICKNESS * 0.64;
    badgeRoot.add(createRimTube(BADGE_W + 0.022, BADGE_H + 0.022, CORNER_R + 0.011, rimZ, 0.022));
    badgeRoot.add(createRimTube(BADGE_W + 0.022, BADGE_H + 0.022, CORNER_R + 0.011, -rimZ, 0.022));
    badgeRoot.add(createRimTube(BADGE_W + BEVEL_SIZE * 1.85, BADGE_H + BEVEL_SIZE * 1.85, CORNER_R + BEVEL_SIZE * 0.92, 0, 0.018));

    // 5C. Front & Back Raised Face Assemblies (3D Sculpted Zustand Bear + Supersampled Typography)
    const facePlateShape = createRoundedRectShape(BADGE_W - 0.04, BADGE_H - 0.04, CORNER_R - 0.02);
    const facePlateGeo = new THREE.ShapeGeometry(facePlateShape, 48);
    {
      const pos = facePlateGeo.attributes.position;
      const uv = facePlateGeo.attributes.uv;
      for (let i = 0; i < pos.count; i++) {
        uv.setXY(i, (pos.getX(i) / BADGE_W) + 0.5, (pos.getY(i) / BADGE_H) + 0.5);
      }
      uv.needsUpdate = true;
    }

    const typoMaterial = new THREE.MeshPhysicalMaterial({
      map: typoColorTex,
      bumpMap: typoBumpTex,
      bumpScale: 0.008,
      emissive: 0xffffff,
      emissiveMap: typoColorTex,
      emissiveIntensity: 0.42,
      transparent: true,
      alphaTest: 0.01,
      roughness: 0.14,
      metalness: 0.02,
      clearcoat: 1.0,
      clearcoatRoughness: 0.05,
      depthWrite: false
    });

    // Build 3D Bear Silhouette Geometry + Held Oval Geometry
    const toLocalX = (nx) => (nx - 0.5) * BEAR_SIZE;
    const toLocalY = (ny) => (0.5 - ny) * BEAR_SIZE;

    const bearCurvePts = BEAR_CONTOUR.map(([nx, ny]) => new THREE.Vector2(toLocalX(nx), toLocalY(ny)));
    const bearSpline = new THREE.SplineCurve(bearCurvePts);
    const sampledBearPts = bearSpline.getPoints(160);
    const bearShape = new THREE.Shape(sampledBearPts);

    const acornShape = new THREE.Shape();
    const acSteps = 36;
    for (let i = 0; i < acSteps; i++) {
      const a = (i / acSteps) * Math.PI * 2;
      const rx = 0.046 * Math.cos(a);
      const ry = 0.064 * Math.sin(a);
      const rot = 0.24;
      const nx = 0.822 + rx * Math.cos(rot) - ry * Math.sin(rot);
      const ny = 0.305 + rx * Math.sin(rot) + ry * Math.cos(rot);
      const lx = toLocalX(nx);
      const ly = toLocalY(ny);
      if (i === 0) acornShape.moveTo(lx, ly);
      else acornShape.lineTo(lx, ly);
    }
    acornShape.closePath();

    const bearExtrudeOpts = {
      depth: 0.014,
      bevelEnabled: true,
      bevelThickness: 0.006,
      bevelSize: 0.004,
      bevelSegments: 6,
      curveSegments: 24
    };

    const normalizeBearUVs = (geo) => {
      const pos = geo.attributes.position;
      const uv = geo.attributes.uv;
      for (let i = 0; i < pos.count; i++) {
        uv.setXY(i, (pos.getX(i) / BEAR_SIZE) + 0.5, (pos.getY(i) / BEAR_SIZE) + 0.5);
      }
      uv.needsUpdate = true;
    };

    const bearGeo = new THREE.ExtrudeGeometry(bearShape, bearExtrudeOpts);
    normalizeBearUVs(bearGeo);

    const acornGeo = new THREE.ExtrudeGeometry(acornShape, bearExtrudeOpts);
    normalizeBearUVs(acornGeo);

    const bearFaceMat = new THREE.MeshPhysicalMaterial({
      map: bearColorTex,
      bumpMap: bearBumpTex,
      bumpScale: 0.012,
      roughness: 0.22,
      metalness: 0.04,
      clearcoat: 0.9,
      clearcoatRoughness: 0.08
    });

    const bearSideMat = new THREE.MeshPhysicalMaterial({
      color: 0x241108,
      roughness: 0.28,
      metalness: 0.05,
      clearcoat: 0.75,
      clearcoatRoughness: 0.12
    });

    function createFaceDetailGroup() {
      const group = new THREE.Group();

      const typoMesh = new THREE.Mesh(facePlateGeo, typoMaterial);
      typoMesh.position.z = TOTAL_HALF_Z + 0.0025;
      group.add(typoMesh);

      const bearGroup = new THREE.Group();
      bearGroup.position.set(-0.80, 0.0, TOTAL_HALF_Z + 0.002);

      bearGroup.add(new THREE.Mesh(bearGeo, [bearFaceMat, bearSideMat]));
      bearGroup.add(new THREE.Mesh(acornGeo, [bearFaceMat, bearSideMat]));

      group.add(bearGroup);
      return group;
    }

    badgeRoot.add(createFaceDetailGroup());

    const backFace = createFaceDetailGroup();
    backFace.rotation.y = Math.PI;
    badgeRoot.add(backFace);

    // 5D. Outer Warm Amber-Orange Halo on Pure #FFFFFF Background
    const haloMat = new THREE.MeshBasicMaterial({
      map: createHaloTexture(),
      transparent: true,
      opacity: 0.95,
      depthWrite: false,
      side: THREE.DoubleSide
    });
    const haloMesh = new THREE.Mesh(new THREE.PlaneGeometry(4.6, 2.3), haloMat);
    haloMesh.renderOrder = -2;
    badgeRoot.add(haloMesh);

    const auraMat = new THREE.SpriteMaterial({
      map: createBillboardAuraTexture(),
      transparent: true,
      opacity: 0.45,
      depthWrite: false
    });
    const auraSprite = new THREE.Sprite(auraMat);
    auraSprite.scale.set(4.4, 4.4, 1);
    auraSprite.renderOrder = -3;
    scene.add(auraSprite);

    // 6. 360° ORBIT CONTROLS, IDLE FLOAT, HOVER MICRO-TILT & DOUBLE-CLICK RESET
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.copy(INITIAL_TARGET);
    controls.enableDamping = true;
    controls.dampingFactor = 0.065;
    controls.enablePan = false;
    controls.rotateSpeed = 0.85;
    controls.zoomSpeed = 0.9;
    controls.minDistance = 2.0;
    controls.maxDistance = 8.5;
    controls.update();

    let isDragging = false;
    let isPointerInside = false;
    let pointerNX = 0;
    let pointerNY = 0;
    let isResetting = false;

    const resetStartCam = new THREE.Vector3();
    const resetStartTarget = new THREE.Vector3();
    let resetProgress = 0;

    controls.addEventListener('start', () => {
      isDragging = true;
      isResetting = false;
    });
    controls.addEventListener('end', () => {
      isDragging = false;
    });

    const domEl = renderer.domElement;
    domEl.addEventListener('pointermove', (e) => {
      isPointerInside = true;
      pointerNX = (e.clientX / window.innerWidth) * 2 - 1;
      pointerNY = (e.clientY / window.innerHeight) * 2 - 1;
    });
    domEl.addEventListener('pointerleave', () => {
      isPointerInside = false;
      pointerNX = 0;
      pointerNY = 0;
    });
    domEl.addEventListener('dblclick', () => {
      resetStartCam.copy(camera.position);
      resetStartTarget.copy(controls.target);
      resetProgress = 0;
      isResetting = true;
    });

    // 7. RESIZE & ANIMATION LOOP
    window.addEventListener('resize', () => {
      const w = window.innerWidth;
      const h = window.innerHeight;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    });

    const clock = new THREE.Clock();
    const viewDir = new THREE.Vector3();

    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), 0.05);
      const elapsed = clock.elapsedTime;

      if (isResetting) {
        resetProgress = Math.min(resetProgress + dt * 2.4, 1);
        const ease = 1 - Math.pow(1 - resetProgress, 3);
        camera.position.lerpVectors(resetStartCam, INITIAL_CAM_POS, ease);
        controls.target.lerpVectors(resetStartTarget, INITIAL_TARGET, ease);
        if (resetProgress >= 1) isResetting = false;
      }

      const idleFloatY = Math.sin(elapsed * 1.45) * 0.022;
      const idleRotX = Math.sin(elapsed * 0.95) * 0.012;
      const idleRotY = Math.cos(elapsed * 0.75) * 0.015;

      const targetTiltY = (!isDragging && isPointerInside) ? pointerNX * 0.085 : 0;
      const targetTiltX = (!isDragging && isPointerInside) ? pointerNY * 0.065 : 0;

      badgeRoot.position.y = THREE.MathUtils.lerp(badgeRoot.position.y, idleFloatY, 0.08);
      badgeRoot.rotation.x = THREE.MathUtils.lerp(badgeRoot.rotation.x, targetTiltX + idleRotX, 0.07);
      badgeRoot.rotation.y = THREE.MathUtils.lerp(badgeRoot.rotation.y, targetTiltY + idleRotY, 0.07);

      auraSprite.position.y = badgeRoot.position.y;
      viewDir.subVectors(camera.position, controls.target).normalize();
      const edgeFactor = 1.0 - Math.abs(viewDir.z);
      haloMat.opacity = 0.95 * (1.0 - edgeFactor * 0.65);
      auraMat.opacity = 0.35 + edgeFactor * 0.28;

      controls.update();
      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>

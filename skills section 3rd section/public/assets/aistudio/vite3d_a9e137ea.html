<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Vite — 3D Interactive Model</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #ffffff;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: grab;
      outline: none;
    }
    canvas:active { cursor: grabbing; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // 1. RENDERER, SCENE & CAMERA
    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      alpha: true,
      powerPreference: 'high-performance'
    });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.08;
    renderer.setClearColor(0xffffff, 0);
    document.body.appendChild(renderer.domElement);

    const scene = new THREE.Scene();

    const INITIAL_CAM_POS = new THREE.Vector3(0, 0, 4.05);
    const INITIAL_TARGET = new THREE.Vector3(0, 0, 0);

    const camera = new THREE.PerspectiveCamera(36, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.copy(INITIAL_CAM_POS);

    // 2. PROCEDURAL 360° STUDIO ENVIRONMENT (PMREM) & BALANCED LIGHTING
    function createStudioEnv(glRenderer) {
      const pmrem = new THREE.PMREMGenerator(glRenderer);
      pmrem.compileEquirectangularShader();
      const envScene = new THREE.Scene();
      envScene.background = new THREE.Color(0x161224);

      const addPanel = (w, h, color, intensity, pos) => {
        const geo = new THREE.PlaneGeometry(w, h);
        const mat = new THREE.MeshBasicMaterial({
          color: new THREE.Color(color).multiplyScalar(intensity),
          side: THREE.DoubleSide
        });
        const mesh = new THREE.Mesh(geo, mat);
        mesh.position.set(...pos);
        mesh.lookAt(0, 0, 0);
        envScene.add(mesh);
      };

      addPanel(10, 5, 0xffffff, 2.2, [0, 3.2, 8]);
      addPanel(10, 5, 0xd8ccff, 1.3, [0, -3.5, 8]);
      addPanel(10, 5, 0xffffff, 2.2, [0, 3.2, -8]);
      addPanel(10, 5, 0xffe4a8, 1.3, [0, -3.5, -8]);
      addPanel(12, 6, 0xf6f2ff, 2.0, [0, 8.5, 0]);
      addPanel(12, 6, 0x9c82e8, 1.0, [0, -8.5, 0]);
      addPanel(6, 8, 0xffe194, 1.7, [9, 0.5, 0]);
      addPanel(6, 8, 0xc79aff, 1.7, [-9, 0.5, 0]);

      const rt = pmrem.fromScene(envScene, 0.04);
      pmrem.dispose();
      return rt.texture;
    }

    scene.environment = createStudioEnv(renderer);
    scene.add(new THREE.AmbientLight(0xeae6ff, 0.85));

    const addDirLight = (color, intensity, pos) => {
      const l = new THREE.DirectionalLight(color, intensity);
      l.position.set(...pos);
      scene.add(l);
    };
    addDirLight(0xffffff, 1.4, [2.5, 3.5, 5.5]);
    addDirLight(0xa855f7, 0.6, [-4.0, -1.5, 4.5]);
    addDirLight(0xffcb45, 0.55, [4.0, -1.5, 4.5]);
    addDirLight(0xffffff, 1.4, [-2.5, 3.5, -5.5]);
    addDirLight(0xffcb45, 0.6, [-4.0, -1.5, -4.5]);
    addDirLight(0xa855f7, 0.55, [4.0, -1.5, -4.5]);

    // 3. EXACT BADGE DIMENSIONS & GEOMETRY HELPERS
    const BADGE_W = 2.50;
    const BADGE_H = 1.00;
    const CORNER_R = 0.34;
    const BODY_DEPTH = 0.12;
    const BEVEL_THICKNESS = 0.042;
    const BEVEL_SIZE = 0.036;
    const TOTAL_HALF_Z = BODY_DEPTH / 2 + BEVEL_THICKNESS;

    function createRoundedRectShape(w, h, r) {
      const hw = w / 2;
      const hh = h / 2;
      const rad = Math.min(r, hw, hh);
      const s = new THREE.Shape();
      s.moveTo(-hw + rad, -hh);
      s.lineTo(hw - rad, -hh);
      s.absarc(hw - rad, -hh + rad, rad, -Math.PI / 2, 0, false);
      s.lineTo(hw, hh - rad);
      s.absarc(hw - rad, hh - rad, rad, 0, Math.PI / 2, false);
      s.lineTo(-hw + rad, hh);
      s.absarc(-hw + rad, hh - rad, rad, Math.PI / 2, Math.PI, false);
      s.lineTo(-hw, -hh + rad);
      s.absarc(-hw + rad, -hh + rad, rad, Math.PI, Math.PI * 1.5, false);
      return s;
    }

    function createRoundedRectCurvePoints(w, h, r, z = 0) {
      const hw = w / 2;
      const hh = h / 2;
      const rad = Math.min(r, hw, hh);
      const pts = [];
      const cornerSteps = 22;
      const straightSteps = 10;

      const pushLine = (x0, y0, x1, y1) => {
        for (let i = 0; i < straightSteps; i++) {
          const t = i / straightSteps;
          pts.push(new THREE.Vector3(x0 + (x1 - x0) * t, y0 + (y1 - y0) * t, z));
        }
      };
      const pushArc = (cx, cy, a0, a1) => {
        for (let i = 0; i < cornerSteps; i++) {
          const a = a0 + (a1 - a0) * (i / cornerSteps);
          pts.push(new THREE.Vector3(cx + Math.cos(a) * rad, cy + Math.sin(a) * rad, z));
        }
      };

      pushLine(-hw + rad, -hh, hw - rad, -hh);
      pushArc(hw - rad, -hh + rad, -Math.PI / 2, 0);
      pushLine(hw, -hh + rad, hw, hh - rad);
      pushArc(hw - rad, hh - rad, 0, Math.PI / 2);
      pushLine(hw - rad, hh, -hw + rad, hh);
      pushArc(-hw + rad, hh - rad, Math.PI / 2, Math.PI);
      pushLine(-hw, hh - rad, -hw, -hh + rad);
      pushArc(-hw + rad, -hh + rad, Math.PI, Math.PI * 1.5);
      return pts;
    }

    function strokeRoundedRectCanvas(ctx, x, y, w, h, r) {
      const rad = Math.min(r, w / 2, h / 2);
      ctx.beginPath();
      ctx.moveTo(x + rad, y);
      ctx.lineTo(x + w - rad, y);
      ctx.arcTo(x + w, y, x + w, y + rad, rad);
      ctx.lineTo(x + w, y + h - rad);
      ctx.arcTo(x + w, y + h, x + w - rad, y + h, rad);
      ctx.lineTo(x + rad, y + h);
      ctx.arcTo(x, y + h, x, y + h - rad, rad);
      ctx.lineTo(x, y + rad);
      ctx.arcTo(x, y, x + rad, y, rad);
      ctx.closePath();
    }

    // 4. HIGH-DPI PROCEDURAL TEXTURES (2560x1024 SUPERSAMPLED, SAFARI-SAFE)
    const maxAniso = renderer.capabilities.getMaxAnisotropy();

    function addRimStops(grad, alpha = 1.0) {
      grad.addColorStop(0.00, `rgba(155, 77, 255, ${alpha})`);
      grad.addColorStop(0.26, `rgba(168, 85, 247, ${alpha})`);
      grad.addColorStop(0.48, `rgba(207, 124, 224, ${alpha})`);
      grad.addColorStop(0.66, `rgba(243, 179, 76, ${alpha})`);
      grad.addColorStop(0.86, `rgba(255, 208, 56, ${alpha})`);
      grad.addColorStop(1.00, `rgba(255, 204, 41, ${alpha})`);
      return grad;
    }

    function createSmokyViteTexture() {
      const W = 2560;
      const H = 1024;
      const canvas = document.createElement('canvas');
      canvas.width = W;
      canvas.height = H;
      const ctx = canvas.getContext('2d');

      const bg = ctx.createLinearGradient(0, 0, W, H);
      bg.addColorStop(0.0, '#2a2247');
      bg.addColorStop(0.32, '#221f38');
      bg.addColorStop(0.68, '#1e1c2f');
      bg.addColorStop(1.0, '#2b242c');
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, W, H);

      let seed = 7919;
      const rand = () => {
        seed = (seed * 16807) % 2147483647;
        return (seed - 1) / 2147483646;
      };

      for (let i = 0; i < 64; i++) {
        const cx = rand() * W;
        const cy = rand() * H;
        const rx = 180 + rand() * 440;
        const ry = 80 + rand() * 210;
        const angle = (rand() - 0.5) * 0.85;
        const isLight = rand() > 0.45;

        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(angle);
        ctx.scale(1, ry / rx);
        const grad = ctx.createRadialGradient(0, 0, 0, 0, 0, rx);
        if (isLight) {
          grad.addColorStop(0, 'rgba(84, 68, 134, 0.11)');
          grad.addColorStop(0.55, 'rgba(56, 46, 92, 0.05)');
          grad.addColorStop(1, 'rgba(30, 26, 48, 0)');
        } else {
          grad.addColorStop(0, 'rgba(10, 8, 20, 0.22)');
          grad.addColorStop(0.6, 'rgba(14, 12, 26, 0.08)');
          grad.addColorStop(1, 'rgba(14, 12, 26, 0)');
        }
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(0, 0, rx, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      // Safari-safe inner gradient edge glow (purple left -> golden yellow right)
      const glowCanvas = document.createElement('canvas');
      glowCanvas.width = W;
      glowCanvas.height = H;
      const gCtx = glowCanvas.getContext('2d');
      const pad = 24;
      const rPx = (CORNER_R / BADGE_H) * (H - pad * 2);

      gCtx.save();
      strokeRoundedRectCanvas(gCtx, pad, pad, W - pad * 2, H - pad * 2, rPx);
      gCtx.shadowColor = 'rgba(255, 255, 255, 0.88)';
      gCtx.shadowBlur = 78;
      gCtx.lineWidth = 22;
      gCtx.strokeStyle = 'rgba(255, 255, 255, 0.56)';
      gCtx.stroke();

      gCtx.shadowBlur = 32;
      gCtx.lineWidth = 10;
      gCtx.strokeStyle = 'rgba(255, 255, 255, 0.78)';
      gCtx.stroke();
      gCtx.restore();

      gCtx.globalCompositeOperation = 'source-in';
      const rimGrad = addRimStops(gCtx.createLinearGradient(0, 0, W, 0), 1.0);
      gCtx.fillStyle = rimGrad;
      gCtx.fillRect(0, 0, W, H);

      ctx.drawImage(glowCanvas, 0, 0);

      const tex = new THREE.CanvasTexture(canvas);
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.anisotropy = maxAniso;
      return tex;
    }

    function createRimGradientTexture() {
      const W = 1024;
      const H = 64;
      const canvas = document.createElement('canvas');
      canvas.width = W;
      canvas.height = H;
      const ctx = canvas.getContext('2d');

      const grad = addRimStops(ctx.createLinearGradient(0, 0, W, 0), 1.0);
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, W, H);

      const tex = new THREE.CanvasTexture(canvas);
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.anisotropy = maxAniso;
      return tex;
    }

    function createViteTriangleGradientTexture() {
      const S = 512;
      const canvas = document.createElement('canvas');
      canvas.width = S;
      canvas.height = S;
      const ctx = canvas.getContext('2d');

      const grad = ctx.createLinearGradient(
        S * -0.00828, S * 0.07652,
        S * 0.57636, S * 0.78411
      );
      grad.addColorStop(0.0, '#41D1FF');
      grad.addColorStop(0.52, '#7C7CFF');
      grad.addColorStop(1.0, '#BD34FE');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, S, S);

      const tex = new THREE.CanvasTexture(canvas);
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.anisotropy = maxAniso;
      return tex;
    }

    function createViteBoltGradientTexture() {
      const S = 512;
      const canvas = document.createElement('canvas');
      canvas.width = S;
      canvas.height = S;
      const ctx = canvas.getContext('2d');

      const grad = ctx.createLinearGradient(
        S * 0.43376, S * 0.02242,
        S * 0.50316, S * 0.8903
      );
      grad.addColorStop(0.0, '#FFEA83');
      grad.addColorStop(0.12, '#FFDD35');
      grad.addColorStop(1.0, '#FFA800');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, S, S);

      const tex = new THREE.CanvasTexture(canvas);
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.anisotropy = maxAniso;
      return tex;
    }

    function createTypographyLayerTextures() {
      const W = 2560;
      const H = 1024;

      const canvas = document.createElement('canvas');
      canvas.width = W;
      canvas.height = H;
      const ctx = canvas.getContext('2d');

      const bumpCanvas = document.createElement('canvas');
      bumpCanvas.width = W;
      bumpCanvas.height = H;
      const bCtx = bumpCanvas.getContext('2d');

      ctx.clearRect(0, 0, W, H);
      bCtx.fillStyle = '#000000';
      bCtx.fillRect(0, 0, W, H);

      const text = 'Vite';
      const fontFamily = '"Inter", "SF Pro Display", "Segoe UI", "Roboto", "Helvetica Neue", Arial, sans-serif';
      const fontSize = Math.round(H * 0.47);
      const fontSpec = `600 ${fontSize}px ${fontFamily}`;

      ctx.font = fontSpec;
      ctx.textAlign = 'left';
      ctx.textBaseline = 'middle';

      const textX = W * 0.445;
      const textY = H * 0.515;

      ctx.save();
      ctx.shadowColor = 'rgba(255, 255, 255, 0.45)';
      ctx.shadowBlur = 16;
      ctx.fillStyle = '#F7FAFF';
      ctx.fillText(text, textX, textY);
      ctx.restore();

      ctx.save();
      ctx.shadowColor = 'rgba(255, 255, 255, 0.35)';
      ctx.shadowBlur = 4;
      ctx.fillStyle = '#FFFFFF';
      ctx.fillText(text, textX, textY);
      ctx.restore();

      bCtx.font = fontSpec;
      bCtx.textAlign = 'left';
      bCtx.textBaseline = 'middle';
      bCtx.shadowColor = 'rgba(200, 200, 200, 0.85)';
      bCtx.shadowBlur = 6;
      bCtx.fillStyle = '#ffffff';
      bCtx.fillText(text, textX, textY);

      const mapTex = new THREE.CanvasTexture(canvas);
      mapTex.colorSpace = THREE.SRGBColorSpace;
      mapTex.anisotropy = maxAniso;

      const bumpTex = new THREE.CanvasTexture(bumpCanvas);
      bumpTex.anisotropy = maxAniso;

      return { mapTex, bumpTex };
    }

    function createHaloTexture() {
      const W = 2048;
      const H = 1024;
      const canvas = document.createElement('canvas');
      canvas.width = W;
      canvas.height = H;
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, W, H);

      const rectW = W * 0.58;
      const rectH = H * 0.46;
      const rectX = (W - rectW) / 2;
      const rectY = (H - rectH) / 2;
      const rPx = (CORNER_R / BADGE_H) * rectH;

      const passes = [
        { blur: 130, alpha: 0.24, lw: 34 },
        { blur: 82,  alpha: 0.34, lw: 26 },
        { blur: 46,  alpha: 0.44, lw: 18 },
        { blur: 22,  alpha: 0.52, lw: 12 }
      ];

      passes.forEach((p) => {
        ctx.save();
        strokeRoundedRectCanvas(ctx, rectX, rectY, rectW, rectH, rPx);
        ctx.shadowColor = `rgba(255, 255, 255, ${p.alpha})`;
        ctx.shadowBlur = p.blur;
        ctx.lineWidth = p.lw;
        ctx.strokeStyle = `rgba(255, 255, 255, ${p.alpha * 0.55})`;
        ctx.stroke();
        ctx.restore();
      });

      ctx.globalCompositeOperation = 'source-in';
      const grad = addRimStops(ctx.createLinearGradient(rectX - 160, 0, rectX + rectW + 160, 0), 1.0);
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, W, H);

      const tex = new THREE.CanvasTexture(canvas);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    function createBillboardAuraTexture() {
      const S = 1024;
      const canvas = document.createElement('canvas');
      canvas.width = S;
      canvas.height = S;
      const ctx = canvas.getContext('2d');

      ctx.save();
      ctx.translate(S / 2, S / 2);
      ctx.scale(1.0, 0.54);
      const maskGrad = ctx.createRadialGradient(0, 0, S * 0.12, 0, 0, S * 0.48);
      maskGrad.addColorStop(0.0, 'rgba(255, 255, 255, 0.32)');
      maskGrad.addColorStop(0.45, 'rgba(255, 255, 255, 0.14)');
      maskGrad.addColorStop(0.75, 'rgba(255, 255, 255, 0.04)');
      maskGrad.addColorStop(1.0, 'rgba(255, 255, 255, 0.0)');
      ctx.fillStyle = maskGrad;
      ctx.beginPath();
      ctx.arc(0, 0, S * 0.48, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      ctx.globalCompositeOperation = 'source-in';
      ctx.fillStyle = addRimStops(ctx.createLinearGradient(S * 0.1, 0, S * 0.9, 0), 1.0);
      ctx.fillRect(0, 0, S, S);

      const tex = new THREE.CanvasTexture(canvas);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    // 5. BUILD PHYSICAL 3D DOUBLE-SIDED MODEL
    const badgeRoot = new THREE.Group();
    scene.add(badgeRoot);

    const smokyViteTex = createSmokyViteTexture();
    const rimGradientTex = createRimGradientTexture();
    const { mapTex: typoColorTex, bumpTex: typoBumpTex } = createTypographyLayerTextures();

    // 5A. Extruded Physical Pill Body with 14-Segment Rounded Bevels
    const bodyShape = createRoundedRectShape(BADGE_W, BADGE_H, CORNER_R);
    const bodyGeo = new THREE.ExtrudeGeometry(bodyShape, {
      depth: BODY_DEPTH,
      bevelEnabled: true,
      bevelThickness: BEVEL_THICKNESS,
      bevelSize: BEVEL_SIZE,
      bevelSegments: 14,
      curveSegments: 56
    });
    bodyGeo.center();

    {
      const pos = bodyGeo.attributes.position;
      const uv = bodyGeo.attributes.uv;
      const totalW = BADGE_W + BEVEL_SIZE * 2;
      const totalH = BADGE_H + BEVEL_SIZE * 2;
      for (let i = 0; i < pos.count; i++) {
        uv.setXY(i, (pos.getX(i) / totalW) + 0.5, (pos.getY(i) / totalH) + 0.5);
      }
      uv.needsUpdate = true;
    }

    const bodyMaterial = new THREE.MeshPhysicalMaterial({
      map: smokyViteTex,
      color: 0xffffff,
      roughness: 0.16,
      metalness: 0.08,
      clearcoat: 1.0,
      clearcoatRoughness: 0.06,
      ior: 1.52,
      reflectivity: 0.92,
      envMapIntensity: 1.3
    });

    badgeRoot.add(new THREE.Mesh(bodyGeo, bodyMaterial));

    // 5B. 3D Purple-to-Gold Neon Perimeter Bevel Tubes
    const rimMaterial = new THREE.MeshPhysicalMaterial({
      map: rimGradientTex,
      color: 0xffffff,
      emissive: 0xffffff,
      emissiveMap: rimGradientTex,
      emissiveIntensity: 1.08,
      roughness: 0.14,
      metalness: 0.05,
      clearcoat: 1.0,
      clearcoatRoughness: 0.05,
      envMapIntensity: 1.15
    });

    function createRimTube(w, h, r, zPos, tubeRadius) {
      const pts = createRoundedRectCurvePoints(w, h, r, zPos);
      const curve = new THREE.CatmullRomCurve3(pts, true);
      const geo = new THREE.TubeGeometry(curve, 180, tubeRadius, 14, true);

      const pos = geo.attributes.position;
      const uv = geo.attributes.uv;
      const spanW = BADGE_W + BEVEL_SIZE * 2;
      for (let i = 0; i < pos.count; i++) {
        const u = THREE.MathUtils.clamp((pos.getX(i) / spanW) + 0.5, 0, 1);
        uv.setXY(i, u, 0.5);
      }
      uv.needsUpdate = true;

      return new THREE.Mesh(geo, rimMaterial);
    }

    const rimZ = BODY_DEPTH / 2 + BEVEL_THICKNESS * 0.64;
    badgeRoot.add(createRimTube(BADGE_W + 0.022, BADGE_H + 0.022, CORNER_R + 0.011, rimZ, 0.022));
    badgeRoot.add(createRimTube(BADGE_W + 0.022, BADGE_H + 0.022, CORNER_R + 0.011, -rimZ, 0.022));
    badgeRoot.add(createRimTube(BADGE_W + BEVEL_SIZE * 1.85, BADGE_H + BEVEL_SIZE * 1.85, CORNER_R + BEVEL_SIZE * 0.92, 0, 0.018));

    // 5C. Front & Back Raised Face Assemblies (3D Vite Logo + Supersampled Typography)
    const facePlateShape = createRoundedRectShape(BADGE_W - 0.04, BADGE_H - 0.04, CORNER_R - 0.02);
    const facePlateGeo = new THREE.ShapeGeometry(facePlateShape, 48);
    {
      const pos = facePlateGeo.attributes.position;
      const uv = facePlateGeo.attributes.uv;
      for (let i = 0; i < pos.count; i++) {
        uv.setXY(i, (pos.getX(i) / BADGE_W) + 0.5, (pos.getY(i) / BADGE_H) + 0.5);
      }
      uv.needsUpdate = true;
    }

    const typoMaterial = new THREE.MeshPhysicalMaterial({
      map: typoColorTex,
      bumpMap: typoBumpTex,
      bumpScale: 0.008,
      emissive: 0xffffff,
      emissiveMap: typoColorTex,
      emissiveIntensity: 0.45,
      transparent: true,
      alphaTest: 0.01,
      roughness: 0.15,
      metalness: 0.02,
      clearcoat: 1.0,
      clearcoatRoughness: 0.05,
      depthWrite: false
    });

    // Official Vite SVG geometry (viewBox 0 0 256 257) scaled directly to world units
    const LOGO_SCALE = 0.62 / 257;
    const vx = (svgX) => (svgX - 128) * LOGO_SCALE;
    const vy = (svgY) => (128.5 - svgY) * LOGO_SCALE;

    // Cyan-to-Purple 3D Triangle Shield
    const triShape = new THREE.Shape();
    triShape.moveTo(vx(255.153), vy(37.938));
    triShape.lineTo(vx(134.897), vy(252.976));
    triShape.bezierCurveTo(
      vx(132.414), vy(257.416),
      vx(126.035), vy(257.442),
      vx(123.515), vy(253.024)
    );
    triShape.lineTo(vx(0.875), vy(37.958));
    triShape.bezierCurveTo(
      vx(-1.871), vy(33.144),
      vx(2.246), vy(27.312),
      vx(7.702), vy(28.288)
    );
    triShape.lineTo(vx(128.087), vy(49.805));
    triShape.quadraticCurveTo(vx(129.248), vy(50.01), vx(130.409), vy(49.801));
    triShape.lineTo(vx(248.276), vy(28.318));
    triShape.bezierCurveTo(
      vx(253.714), vy(27.327),
      vx(257.850), vy(33.114),
      vx(255.153), vy(37.938)
    );

    // Yellow-to-Amber 3D Lightning Bolt
    const boltShape = new THREE.Shape();
    boltShape.moveTo(vx(185.432), vy(0.063));
    boltShape.lineTo(vx(96.44), vy(17.501));
    boltShape.quadraticCurveTo(vx(93.62), vy(18.06), vx(93.806), vy(20.515));
    boltShape.lineTo(vx(88.332), vy(112.971));
    boltShape.quadraticCurveTo(vx(88.14), vy(116.59), vx(92.329), vy(116.349));
    boltShape.lineTo(vx(117.106), vy(110.631));
    boltShape.bezierCurveTo(
      vx(119.424), vy(110.096),
      vx(121.519), vy(112.138),
      vx(121.042), vy(114.469)
    );
    boltShape.lineTo(vx(113.681), vy(150.516));
    boltShape.bezierCurveTo(
      vx(113.186), vy(152.942),
      vx(115.463), vy(155.016),
      vx(117.832), vy(154.296)
    );
    boltShape.lineTo(vx(133.136), vy(149.647));
    boltShape.bezierCurveTo(
      vx(135.508), vy(148.927),
      vx(137.788), vy(151.007),
      vx(137.286), vy(153.435)
    );
    boltShape.lineTo(vx(125.588), vy(210.056));
    boltShape.bezierCurveTo(
      vx(124.856), vy(213.598),
      vx(129.567), vy(215.529),
      vx(131.531), vy(212.493)
    );
    boltShape.lineTo(vx(132.844), vy(210.465));
    boltShape.lineTo(vx(205.360), vy(65.745));
    boltShape.bezierCurveTo(
      vx(206.575), vy(63.322),
      vx(204.480), vy(60.559),
      vx(201.820), vy(61.073)
    );
    boltShape.lineTo(vx(176.315), vy(65.995));
    boltShape.bezierCurveTo(
      vx(173.919), vy(66.457),
      vx(171.880), vy(64.225),
      vx(172.556), vy(61.881)
    );
    boltShape.lineTo(vx(189.202), vy(4.176));
    boltShape.bezierCurveTo(
      vx(189.879), vy(1.826),
      vx(187.832), vy(-0.407),
      vx(185.433), vy(0.063)
    );

    function mapSvgUVs(geo) {
      const pos = geo.attributes.position;
      const uv = geo.attributes.uv;
      for (let i = 0; i < pos.count; i++) {
        const u = THREE.MathUtils.clamp((pos.getX(i) / LOGO_SCALE + 128) / 256, 0, 1);
        const v = THREE.MathUtils.clamp(1.0 - (128.5 - pos.getY(i) / LOGO_SCALE) / 257, 0, 1);
        uv.setXY(i, u, v);
      }
      uv.needsUpdate = true;
    }

    const triGeo = new THREE.ExtrudeGeometry(triShape, {
      depth: 0.015,
      bevelEnabled: true,
      bevelThickness: 0.006,
      bevelSize: 0.005,
      bevelSegments: 8,
      curveSegments: 32
    });
    mapSvgUVs(triGeo);

    const boltGeo = new THREE.ExtrudeGeometry(boltShape, {
      depth: 0.018,
      bevelEnabled: true,
      bevelThickness: 0.007,
      bevelSize: 0.0045,
      bevelSegments: 8,
      curveSegments: 32
    });
    mapSvgUVs(boltGeo);

    const triTex = createViteTriangleGradientTexture();
    const boltTex = createViteBoltGradientTexture();

    const triMat = new THREE.MeshPhysicalMaterial({
      map: triTex,
      color: 0xffffff,
      emissive: 0xffffff,
      emissiveMap: triTex,
      emissiveIntensity: 0.85,
      roughness: 0.14,
      metalness: 0.06,
      clearcoat: 1.0,
      clearcoatRoughness: 0.05
    });

    const boltMat = new THREE.MeshPhysicalMaterial({
      map: boltTex,
      color: 0xffffff,
      emissive: 0xffffff,
      emissiveMap: boltTex,
      emissiveIntensity: 0.95,
      roughness: 0.13,
      metalness: 0.06,
      clearcoat: 1.0,
      clearcoatRoughness: 0.04
    });

    function createFaceDetailGroup() {
      const group = new THREE.Group();

      const typoMesh = new THREE.Mesh(facePlateGeo, typoMaterial);
      typoMesh.position.z = TOTAL_HALF_Z + 0.0025;
      group.add(typoMesh);

      const logoGroup = new THREE.Group();
      logoGroup.position.set(-0.55, 0.0, TOTAL_HALF_Z + 0.001);

      const triMesh = new THREE.Mesh(triGeo, triMat);
      triMesh.position.z = 0.0;
      logoGroup.add(triMesh);

      const boltMesh = new THREE.Mesh(boltGeo, boltMat);
      boltMesh.position.z = 0.013;
      logoGroup.add(boltMesh);

      group.add(logoGroup);
      return group;
    }

    badgeRoot.add(createFaceDetailGroup());

    const backFace = createFaceDetailGroup();
    backFace.rotation.y = Math.PI;
    badgeRoot.add(backFace);

    // 5D. Outer Purple-to-Gold Neon Halo on Pure #FFFFFF Background
    const haloMat = new THREE.MeshBasicMaterial({
      map: createHaloTexture(),
      transparent: true,
      opacity: 0.95,
      depthWrite: false,
      side: THREE.DoubleSide
    });
    const haloMesh = new THREE.Mesh(new THREE.PlaneGeometry(4.3, 2.2), haloMat);
    haloMesh.renderOrder = -2;
    badgeRoot.add(haloMesh);

    const auraMat = new THREE.SpriteMaterial({
      map: createBillboardAuraTexture(),
      transparent: true,
      opacity: 0.45,
      depthWrite: false
    });
    const auraSprite = new THREE.Sprite(auraMat);
    auraSprite.scale.set(4.1, 4.1, 1);
    auraSprite.renderOrder = -3;
    scene.add(auraSprite);

    // 6. 360° ORBIT CONTROLS, IDLE FLOAT, HOVER MICRO-TILT & DOUBLE-CLICK RESET
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.copy(INITIAL_TARGET);
    controls.enableDamping = true;
    controls.dampingFactor = 0.065;
    controls.enablePan = false;
    controls.rotateSpeed = 0.85;
    controls.zoomSpeed = 0.9;
    controls.minDistance = 2.0;
    controls.maxDistance = 8.5;
    controls.update();

    let isDragging = false;
    let isPointerInside = false;
    let pointerNX = 0;
    let pointerNY = 0;
    let isResetting = false;

    const resetStartCam = new THREE.Vector3();
    const resetStartTarget = new THREE.Vector3();
    let resetProgress = 0;

    controls.addEventListener('start', () => {
      isDragging = true;
      isResetting = false;
    });
    controls.addEventListener('end', () => {
      isDragging = false;
    });

    const domEl = renderer.domElement;
    domEl.addEventListener('pointermove', (e) => {
      isPointerInside = true;
      pointerNX = (e.clientX / window.innerWidth) * 2 - 1;
      pointerNY = (e.clientY / window.innerHeight) * 2 - 1;
    });
    domEl.addEventListener('pointerleave', () => {
      isPointerInside = false;
      pointerNX = 0;
      pointerNY = 0;
    });
    domEl.addEventListener('dblclick', () => {
      resetStartCam.copy(camera.position);
      resetStartTarget.copy(controls.target);
      resetProgress = 0;
      isResetting = true;
    });

    // 7. RESIZE & ANIMATION LOOP
    window.addEventListener('resize', () => {
      const w = window.innerWidth;
      const h = window.innerHeight;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    });

    const clock = new THREE.Clock();
    const viewDir = new THREE.Vector3();

    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), 0.05);
      const elapsed = clock.elapsedTime;

      if (isResetting) {
        resetProgress = Math.min(resetProgress + dt * 2.4, 1);
        const ease = 1 - Math.pow(1 - resetProgress, 3);
        camera.position.lerpVectors(resetStartCam, INITIAL_CAM_POS, ease);
        controls.target.lerpVectors(resetStartTarget, INITIAL_TARGET, ease);
        if (resetProgress >= 1) isResetting = false;
      }

      const idleFloatY = Math.sin(elapsed * 1.45) * 0.022;
      const idleRotX = Math.sin(elapsed * 0.95) * 0.012;
      const idleRotY = Math.cos(elapsed * 0.75) * 0.015;

      const targetTiltY = (!isDragging && isPointerInside) ? pointerNX * 0.085 : 0;
      const targetTiltX = (!isDragging && isPointerInside) ? pointerNY * 0.065 : 0;

      badgeRoot.position.y = THREE.MathUtils.lerp(badgeRoot.position.y, idleFloatY, 0.08);
      badgeRoot.rotation.x = THREE.MathUtils.lerp(badgeRoot.rotation.x, targetTiltX + idleRotX, 0.07);
      badgeRoot.rotation.y = THREE.MathUtils.lerp(badgeRoot.rotation.y, targetTiltY + idleRotY, 0.07);

      auraSprite.position.y = badgeRoot.position.y;
      viewDir.subVectors(camera.position, controls.target).normalize();
      const edgeFactor = 1.0 - Math.abs(viewDir.z);
      haloMat.opacity = 0.95 * (1.0 - edgeFactor * 0.65);
      auraMat.opacity = 0.35 + edgeFactor * 0.28;

      controls.update();
      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Shader — 3D Interactive Model</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #ffffff;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: grab;
      outline: none;
    }
    canvas:active { cursor: grabbing; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // 1. RENDERER, SCENE & CAMERA
    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      alpha: true,
      powerPreference: 'high-performance'
    });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.08;
    renderer.setClearColor(0xffffff, 0);
    document.body.appendChild(renderer.domElement);

    const scene = new THREE.Scene();

    const INITIAL_CAM_POS = new THREE.Vector3(0, 0, 4.25);
    const INITIAL_TARGET = new THREE.Vector3(0, 0, 0);

    const camera = new THREE.PerspectiveCamera(36, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.copy(INITIAL_CAM_POS);

    // 2. PROCEDURAL 360° STUDIO ENVIRONMENT (PMREM) & BALANCED LIGHTING
    function createStudioEnv(glRenderer) {
      const pmrem = new THREE.PMREMGenerator(glRenderer);
      pmrem.compileEquirectangularShader();
      const envScene = new THREE.Scene();
      envScene.background = new THREE.Color(0x280a04);

      const addPanel = (w, h, color, intensity, pos) => {
        const geo = new THREE.PlaneGeometry(w, h);
        const mat = new THREE.MeshBasicMaterial({
          color: new THREE.Color(color).multiplyScalar(intensity),
          side: THREE.DoubleSide
        });
        const mesh = new THREE.Mesh(geo, mat);
        mesh.position.set(...pos);
        mesh.lookAt(0, 0, 0);
        envScene.add(mesh);
      };

      addPanel(10, 5, 0xffffff, 2.1, [0, 3.2, 8]);
      addPanel(10, 5, 0xffbca8, 1.4, [0, -3.5, 8]);
      addPanel(10, 5, 0xffffff, 2.1, [0, 3.2, -8]);
      addPanel(10, 5, 0xffbca8, 1.4, [0, -3.5, -8]);
      addPanel(12, 6, 0xfff0ea, 2.0, [0, 8.5, 0]);
      addPanel(12, 6, 0xff784f, 1.1, [0, -8.5, 0]);
      addPanel(6, 8, 0xffaa8a, 1.5, [9, 0.5, 0]);
      addPanel(6, 8, 0xffaa8a, 1.5, [-9, 0.5, 0]);

      const rt = pmrem.fromScene(envScene, 0.04);
      pmrem.dispose();
      return rt.texture;
    }

    scene.environment = createStudioEnv(renderer);
    scene.add(new THREE.AmbientLight(0xffe4db, 0.85));

    const addDirLight = (color, intensity, pos) => {
      const l = new THREE.DirectionalLight(color, intensity);
      l.position.set(...pos);
      scene.add(l);
    };
    addDirLight(0xffffff, 1.35, [2.5, 3.5, 5.5]);
    addDirLight(0xff6b42, 0.70, [-3.5, -2.0, 4.5]);
    addDirLight(0xffffff, 1.35, [-2.5, 3.5, -5.5]);
    addDirLight(0xff6b42, 0.70, [3.5, -2.0, -4.5]);

    // 3. EXACT BADGE DIMENSIONS & GEOMETRY HELPERS
    const BADGE_W = 2.90;
    const BADGE_H = 1.00;
    const CORNER_R = 0.35;
    const BODY_DEPTH = 0.12;
    const BEVEL_THICKNESS = 0.042;
    const BEVEL_SIZE = 0.036;
    const TOTAL_HALF_Z = BODY_DEPTH / 2 + BEVEL_THICKNESS;

    function createRoundedRectShape(w, h, r) {
      const hw = w / 2;
      const hh = h / 2;
      const rad = Math.min(r, hw, hh);
      const s = new THREE.Shape();
      s.moveTo(-hw + rad, -hh);
      s.lineTo(hw - rad, -hh);
      s.absarc(hw - rad, -hh + rad, rad, -Math.PI / 2, 0, false);
      s.lineTo(hw, hh - rad);
      s.absarc(hw - rad, hh - rad, rad, 0, Math.PI / 2, false);
      s.lineTo(-hw + rad, hh);
      s.absarc(-hw + rad, hh - rad, rad, Math.PI / 2, Math.PI, false);
      s.lineTo(-hw, -hh + rad);
      s.absarc(-hw + rad, -hh + rad, rad, Math.PI, Math.PI * 1.5, false);
      return s;
    }

    function createRoundedRectCurvePoints(w, h, r, z = 0) {
      const hw = w / 2;
      const hh = h / 2;
      const rad = Math.min(r, hw, hh);
      const pts = [];
      const cornerSteps = 22;
      const straightSteps = 10;

      const pushLine = (x0, y0, x1, y1) => {
        for (let i = 0; i < straightSteps; i++) {
          const t = i / straightSteps;
          pts.push(new THREE.Vector3(x0 + (x1 - x0) * t, y0 + (y1 - y0) * t, z));
        }
      };
      const pushArc = (cx, cy, a0, a1) => {
        for (let i = 0; i < cornerSteps; i++) {
          const a = a0 + (a1 - a0) * (i / cornerSteps);
          pts.push(new THREE.Vector3(cx + Math.cos(a) * rad, cy + Math.sin(a) * rad, z));
        }
      };

      pushLine(-hw + rad, -hh, hw - rad, -hh);
      pushArc(hw - rad, -hh + rad, -Math.PI / 2, 0);
      pushLine(hw, -hh + rad, hw, hh - rad);
      pushArc(hw - rad, hh - rad, 0, Math.PI / 2);
      pushLine(hw - rad, hh, -hw + rad, hh);
      pushArc(-hw + rad, hh - rad, Math.PI / 2, Math.PI);
      pushLine(-hw, hh - rad, -hw, -hh + rad);
      pushArc(-hw + rad, -hh + rad, Math.PI, Math.PI * 1.5);
      return pts;
    }

    function strokeRoundedRectCanvas(ctx, x, y, w, h, r) {
      const rad = Math.min(r, w / 2, h / 2);
      ctx.beginPath();
      ctx.moveTo(x + rad, y);
      ctx.lineTo(x + w - rad, y);
      ctx.arcTo(x + w, y, x + w, y + rad, rad);
      ctx.lineTo(x + w, y + h - rad);
      ctx.arcTo(x + w, y + h, x + w - rad, y + h, rad);
      ctx.lineTo(x + rad, y + h);
      ctx.arcTo(x, y + h, x, y + h - rad, rad);
      ctx.lineTo(x, y + rad);
      ctx.arcTo(x, y, x + rad, y, rad);
      ctx.closePath();
    }

    // 4. HIGH-DPI PROCEDURAL TEXTURES (SUPERSAMPLED, SAFARI-SAFE)
    const maxAniso = renderer.capabilities.getMaxAnisotropy();

    function createSmokyEmberTexture() {
      const W = 2560;
      const H = 882;
      const canvas = document.createElement('canvas');
      canvas.width = W;
      canvas.height = H;
      const ctx = canvas.getContext('2d');

      const bg = ctx.createLinearGradient(0, 0, W, H);
      bg.addColorStop(0, '#46160b');
      bg.addColorStop(0.35, '#330f07');
      bg.addColorStop(0.7, '#260904');
      bg.addColorStop(1, '#3e1209');
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, W, H);

      let seed = 7391;
      const rand = () => {
        seed = (seed * 16807) % 2147483647;
        return (seed - 1) / 2147483646;
      };

      for (let i = 0; i < 68; i++) {
        const cx = rand() * W;
        const cy = rand() * H;
        const rx = 160 + rand() * 420;
        const ry = 70 + rand() * 190;
        const angle = (rand() - 0.5) * 0.85;
        const isLight = rand() > 0.45;

        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(angle);
        ctx.scale(1, ry / rx);
        const grad = ctx.createRadialGradient(0, 0, 0, 0, 0, rx);
        if (isLight) {
          grad.addColorStop(0, 'rgba(130, 38, 16, 0.16)');
          grad.addColorStop(0.55, 'rgba(92, 24, 10, 0.06)');
          grad.addColorStop(1, 'rgba(48, 12, 5, 0)');
        } else {
          grad.addColorStop(0, 'rgba(16, 4, 2, 0.22)');
          grad.addColorStop(0.6, 'rgba(24, 6, 3, 0.09)');
          grad.addColorStop(1, 'rgba(24, 6, 3, 0)');
        }
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(0, 0, rx, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      // Warm subtle red-orange glow behind the left cube icon
      const cubeGlow = ctx.createRadialGradient(W * 0.225, H * 0.5, 10, W * 0.225, H * 0.5, H * 0.48);
      cubeGlow.addColorStop(0, 'rgba(255, 78, 36, 0.24)');
      cubeGlow.addColorStop(0.5, 'rgba(210, 46, 18, 0.09)');
      cubeGlow.addColorStop(1, 'rgba(40, 10, 5, 0)');
      ctx.fillStyle = cubeGlow;
      ctx.fillRect(0, 0, W, H);

      // Soft inner vermilion-orange edge glow
      const pad = 22;
      const rPx = (CORNER_R / BADGE_H) * (H - pad * 2);
      ctx.save();
      strokeRoundedRectCanvas(ctx, pad, pad, W - pad * 2, H - pad * 2, rPx);
      ctx.shadowColor = 'rgba(255, 86, 38, 0.85)';
      ctx.shadowBlur = 74;
      ctx.lineWidth = 20;
      ctx.strokeStyle = 'rgba(255, 82, 36, 0.54)';
      ctx.stroke();

      ctx.shadowBlur = 30;
      ctx.lineWidth = 10;
      ctx.strokeStyle = 'rgba(255, 108, 62, 0.72)';
      ctx.stroke();
      ctx.restore();

      const tex = new THREE.CanvasTexture(canvas);
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.anisotropy = maxAniso;
      return tex;
    }

    function createTypographyLayerTextures() {
      const W = 2560;
      const H = 882;

      const canvas = document.createElement('canvas');
      canvas.width = W;
      canvas.height = H;
      const ctx = canvas.getContext('2d');

      const bumpCanvas = document.createElement('canvas');
      bumpCanvas.width = W;
      bumpCanvas.height = H;
      const bCtx = bumpCanvas.getContext('2d');

      ctx.clearRect(0, 0, W, H);
      bCtx.fillStyle = '#000000';
      bCtx.fillRect(0, 0, W, H);

      const text = 'Shader';
      const fontFamily = '"Inter", "SF Pro Display", "Segoe UI", "Roboto", "Helvetica Neue", Arial, sans-serif';
      let fontSize = Math.round(H * 0.43);
      const maxTextWidth = W * 0.52;

      ctx.font = `700 ${fontSize}px ${fontFamily}`;
      const measuredW = ctx.measureText(text).width;
      if (measuredW > maxTextWidth) {
        fontSize = Math.round(fontSize * (maxTextWidth / measuredW));
      }

      const fontSpec = `700 ${fontSize}px ${fontFamily}`;
      ctx.font = fontSpec;
      ctx.textAlign = 'left';
      ctx.textBaseline = 'alphabetic';

      const textX = W * 0.376;
      const textY = H * 0.642;

      ctx.save();
      ctx.shadowColor = 'rgba(255, 220, 200, 0.45)';
      ctx.shadowBlur = 14;
      ctx.fillStyle = '#FFF9F6';
      ctx.fillText(text, textX, textY);
      ctx.restore();

      ctx.save();
      ctx.shadowColor = 'rgba(255, 255, 255, 0.35)';
      ctx.shadowBlur = 4;
      ctx.fillStyle = '#FFFFFF';
      ctx.fillText(text, textX, textY);
      ctx.restore();

      bCtx.font = fontSpec;
      bCtx.textAlign = 'left';
      bCtx.textBaseline = 'alphabetic';
      bCtx.shadowColor = 'rgba(200, 200, 200, 0.85)';
      bCtx.shadowBlur = 6;
      bCtx.fillStyle = '#ffffff';
      bCtx.fillText(text, textX, textY);

      const mapTex = new THREE.CanvasTexture(canvas);
      mapTex.colorSpace = THREE.SRGBColorSpace;
      mapTex.anisotropy = maxAniso;

      const bumpTex = new THREE.CanvasTexture(bumpCanvas);
      bumpTex.anisotropy = maxAniso;

      return { mapTex, bumpTex };
    }

    function createHaloTexture() {
      const W = 2048;
      const H = 1024;
      const canvas = document.createElement('canvas');
      canvas.width = W;
      canvas.height = H;
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, W, H);

      const rectW = W * 0.635;
      const rectH = H * 0.435;
      const rectX = (W - rectW) / 2;
      const rectY = (H - rectH) / 2;
      const rPx = (CORNER_R / BADGE_H) * rectH;

      const passes = [
        { blur: 130, alpha: 0.22, lw: 34 },
        { blur: 82,  alpha: 0.32, lw: 26 },
        { blur: 46,  alpha: 0.42, lw: 18 },
        { blur: 22,  alpha: 0.50, lw: 12 }
      ];

      passes.forEach((p) => {
        ctx.save();
        strokeRoundedRectCanvas(ctx, rectX, rectY, rectW, rectH, rPx);
        ctx.shadowColor = `rgba(255, 78, 36, ${p.alpha})`;
        ctx.shadowBlur = p.blur;
        ctx.lineWidth = p.lw;
        ctx.strokeStyle = `rgba(255, 78, 36, ${p.alpha * 0.52})`;
        ctx.stroke();
        ctx.restore();
      });

      const tex = new THREE.CanvasTexture(canvas);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    function createBillboardAuraTexture() {
      const S = 1024;
      const canvas = document.createElement('canvas');
      canvas.width = S;
      canvas.height = S;
      const ctx = canvas.getContext('2d');

      ctx.save();
      ctx.translate(S / 2, S / 2);
      ctx.scale(1.0, 0.52);
      const grad = ctx.createRadialGradient(0, 0, S * 0.14, 0, 0, S * 0.48);
      grad.addColorStop(0, 'rgba(255, 78, 36, 0.26)');
      grad.addColorStop(0.45, 'rgba(255, 78, 36, 0.12)');
      grad.addColorStop(0.75, 'rgba(255, 78, 36, 0.035)');
      grad.addColorStop(1, 'rgba(255, 78, 36, 0.0)');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(0, 0, S * 0.48, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      const tex = new THREE.CanvasTexture(canvas);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    function createCoreGlowTexture() {
      const S = 256;
      const canvas = document.createElement('canvas');
      canvas.width = S;
      canvas.height = S;
      const ctx = canvas.getContext('2d');
      const grad = ctx.createRadialGradient(S / 2, S / 2, 0, S / 2, S / 2, S / 2);
      grad.addColorStop(0, 'rgba(255, 195, 160, 0.95)');
      grad.addColorStop(0.25, 'rgba(255, 82, 36, 0.72)');
      grad.addColorStop(0.60, 'rgba(240, 40, 12, 0.24)');
      grad.addColorStop(1, 'rgba(240, 40, 12, 0.0)');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, S, S);
      const tex = new THREE.CanvasTexture(canvas);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    // 5. BUILD PHYSICAL 3D DOUBLE-SIDED MODEL
    const badgeRoot = new THREE.Group();
    scene.add(badgeRoot);

    const smokyEmberTex = createSmokyEmberTexture();
    const { mapTex: typoColorTex, bumpTex: typoBumpTex } = createTypographyLayerTextures();
    const coreGlowTex = createCoreGlowTexture();

    // 5A. Extruded Physical Pill Body with 14-Segment Rounded Bevels
    const bodyShape = createRoundedRectShape(BADGE_W, BADGE_H, CORNER_R);
    const bodyGeo = new THREE.ExtrudeGeometry(bodyShape, {
      depth: BODY_DEPTH,
      bevelEnabled: true,
      bevelThickness: BEVEL_THICKNESS,
      bevelSize: BEVEL_SIZE,
      bevelSegments: 14,
      curveSegments: 56
    });
    bodyGeo.center();

    {
      const pos = bodyGeo.attributes.position;
      const uv = bodyGeo.attributes.uv;
      const totalW = BADGE_W + BEVEL_SIZE * 2;
      const totalH = BADGE_H + BEVEL_SIZE * 2;
      for (let i = 0; i < pos.count; i++) {
        uv.setXY(i, (pos.getX(i) / totalW) + 0.5, (pos.getY(i) / totalH) + 0.5);
      }
      uv.needsUpdate = true;
    }

    const bodyMaterial = new THREE.MeshPhysicalMaterial({
      map: smokyEmberTex,
      color: 0xffffff,
      roughness: 0.16,
      metalness: 0.08,
      clearcoat: 1.0,
      clearcoatRoughness: 0.06,
      ior: 1.52,
      reflectivity: 0.92,
      envMapIntensity: 1.25
    });

    badgeRoot.add(new THREE.Mesh(bodyGeo, bodyMaterial));

    // 5B. 3D Glowing Vermilion-Orange Perimeter Bevel Tubes
    const neonOrangeMat = new THREE.MeshPhysicalMaterial({
      color: 0xff5a2e,
      emissive: 0xe63c12,
      emissiveIntensity: 1.05,
      roughness: 0.15,
      metalness: 0.05,
      clearcoat: 1.0,
      clearcoatRoughness: 0.05,
      envMapIntensity: 1.1
    });

    function createRimTube(w, h, r, zPos, tubeRadius) {
      const pts = createRoundedRectCurvePoints(w, h, r, zPos);
      const curve = new THREE.CatmullRomCurve3(pts, true);
      const geo = new THREE.TubeGeometry(curve, 180, tubeRadius, 14, true);
      return new THREE.Mesh(geo, neonOrangeMat);
    }

    const rimZ = BODY_DEPTH / 2 + BEVEL_THICKNESS * 0.64;
    badgeRoot.add(createRimTube(BADGE_W + 0.022, BADGE_H + 0.022, CORNER_R + 0.011, rimZ, 0.024));
    badgeRoot.add(createRimTube(BADGE_W + 0.022, BADGE_H + 0.022, CORNER_R + 0.011, -rimZ, 0.024));
    badgeRoot.add(createRimTube(BADGE_W + BEVEL_SIZE * 1.85, BADGE_H + BEVEL_SIZE * 1.85, CORNER_R + BEVEL_SIZE * 0.92, 0, 0.020));

    // 5C. Front & Back Raised Face Assemblies (3D Prismatic Shader Cube + Supersampled Typography)
    const facePlateShape = createRoundedRectShape(BADGE_W - 0.04, BADGE_H - 0.04, CORNER_R - 0.02);
    const facePlateGeo = new THREE.ShapeGeometry(facePlateShape, 48);
    {
      const pos = facePlateGeo.attributes.position;
      const uv = facePlateGeo.attributes.uv;
      for (let i = 0; i < pos.count; i++) {
        uv.setXY(i, (pos.getX(i) / BADGE_W) + 0.5, (pos.getY(i) / BADGE_H) + 0.5);
      }
      uv.needsUpdate = true;
    }

    const typoMaterial = new THREE.MeshPhysicalMaterial({
      map: typoColorTex,
      bumpMap: typoBumpTex,
      bumpScale: 0.008,
      emissive: 0xfff5f0,
      emissiveMap: typoColorTex,
      emissiveIntensity: 0.45,
      transparent: true,
      alphaTest: 0.01,
      roughness: 0.15,
      metalness: 0.02,
      clearcoat: 1.0,
      clearcoatRoughness: 0.05,
      depthWrite: false
    });

    // Shared 3D Prismatic Shader Cube Geometries & Custom GLSL Materials
    const OUTER_CUBE_SIZE = 0.295;
    const INNER_CUBE_SIZE = 0.155;

    const outerBoxGeo = new THREE.BoxGeometry(OUTER_CUBE_SIZE, OUTER_CUBE_SIZE, OUTER_CUBE_SIZE);
    const innerBoxGeo = new THREE.BoxGeometry(INNER_CUBE_SIZE, INNER_CUBE_SIZE, INNER_CUBE_SIZE);

    // Helper to build a continuous 12-edge 3D wireframe cage for a cube
    function createCubeWireframeGeometry(size, radius) {
      const h = size / 2;
      const verts = [
        new THREE.Vector3(-h, -h, -h), new THREE.Vector3( h, -h, -h),
        new THREE.Vector3( h,  h, -h), new THREE.Vector3(-h,  h, -h),
        new THREE.Vector3(-h, -h,  h), new THREE.Vector3( h, -h,  h),
        new THREE.Vector3( h,  h,  h), new THREE.Vector3(-h,  h,  h)
      ];
      const edges = [
        [0,1],[1,2],[2,3],[3,0],
        [4,5],[5,6],[6,7],[7,4],
        [0,4],[1,5],[2,6],[3,7]
      ];
      const meshes = [];
      const up = new THREE.Vector3(0, 1, 0);
      const dir = new THREE.Vector3();
      const mid = new THREE.Vector3();

      edges.forEach(([a, b]) => {
        const pA = verts[a];
        const pB = verts[b];
        const len = pA.distanceTo(pB);
        const cyl = new THREE.CylinderGeometry(radius, radius, len, 8, 1);
        mid.addVectors(pA, pB).multiplyScalar(0.5);
        dir.subVectors(pB, pA).normalize();
        const quat = new THREE.Quaternion().setFromUnitVectors(up, dir);
        cyl.applyQuaternion(quat);
        cyl.translate(mid.x, mid.y, mid.z);
        meshes.push(cyl);
      });

      verts.forEach((v) => {
        const cap = new THREE.SphereGeometry(radius * 1.12, 8, 8);
        cap.translate(v.x, v.y, v.z);
        meshes.push(cap);
      });

      // Merge all edge geometries into a single BufferGeometry
      let totalVerts = 0;
      let totalIdx = 0;
      meshes.forEach((g) => {
        totalVerts += g.attributes.position.count;
        totalIdx += g.index ? g.index.count : g.attributes.position.count;
      });

      const positions = new Float32Array(totalVerts * 3);
      const normals = new Float32Array(totalVerts * 3);
      const indices = new Uint32Array(totalIdx);

      let vOffset = 0;
      let iOffset = 0;
      meshes.forEach((g) => {
        const pos = g.attributes.position.array;
        const norm = g.attributes.normal.array;
        positions.set(pos, vOffset * 3);
        normals.set(norm, vOffset * 3);
        if (g.index) {
          const idx = g.index.array;
          for (let i = 0; i < idx.length; i++) {
            indices[iOffset + i] = idx[i] + vOffset;
          }
          iOffset += idx.length;
        }
        vOffset += g.attributes.position.count;
        g.dispose();
      });

      const merged = new THREE.BufferGeometry();
      merged.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      merged.setAttribute('normal', new THREE.BufferAttribute(normals, 3));
      merged.setIndex(new THREE.BufferAttribute(indices, 1));
      return merged;
    }

    const outerEdgeGeo = createCubeWireframeGeometry(OUTER_CUBE_SIZE, 0.0068);
    const innerEdgeGeo = createCubeWireframeGeometry(INNER_CUBE_SIZE, 0.0046);

    // GLSL Spectral Glass Shader for the Outer Cube
    const isoRotX = Math.atan(Math.SQRT1_2);
    const isoRotY = -Math.PI / 4;

    const iridescentShaderCommon = /* glsl */ `
      varying vec3 vLocalPos;
      varying vec3 vViewNormal;
      varying vec3 vViewDir;

      // Rotate local cube coordinates into isometric view alignment for exact spectral mapping
      vec3 toIsoSpace(vec3 p) {
        float cy = cos(${isoRotY.toFixed(6)});
        float sy = sin(${isoRotY.toFixed(6)});
        vec3 py = vec3(p.x * cy + p.z * sy, p.y, -p.x * sy + p.z * cy);

        float cx = cos(${isoRotX.toFixed(6)});
        float sx = sin(${isoRotX.toFixed(6)});
        return vec3(py.x, py.y * cx - py.z * sx, py.y * sx + py.z * cx);
      }

      vec3 getSpectralColor(vec3 isoP) {
        float u = clamp(isoP.x * 2.6 + 0.5, 0.0, 1.0);
        float v = clamp(isoP.y * 2.6 + 0.5, 0.0, 1.0);

        vec3 bottomLeft  = vec3(0.18, 0.72, 0.98); // Cyan-Blue
        vec3 bottomRight = vec3(0.28, 0.90, 0.48); // Emerald-Lime
        vec3 topLeft     = vec3(0.94, 0.28, 0.78); // Magenta-Pink
        vec3 topRight    = vec3(0.99, 0.84, 0.24); // Gold-Yellow

        vec3 bot = mix(bottomLeft, bottomRight, u);
        vec3 top = mix(topLeft, topRight, u);
        return mix(bot, top, v);
      }
    `;

    function createOuterGlassMaterial(side, baseAlpha) {
      return new THREE.ShaderMaterial({
        transparent: true,
        depthWrite: false,
        side,
        uniforms: {
          uBaseAlpha: { value: baseAlpha },
          uHalfSize: { value: OUTER_CUBE_SIZE * 0.5 }
        },
        vertexShader: /* glsl */ `
          varying vec3 vLocalPos;
          varying vec3 vViewNormal;
          varying vec3 vViewDir;
          void main() {
            vLocalPos = position;
            vec4 mvPos = modelViewMatrix * vec4(position, 1.0);
            vViewNormal = normalize(normalMatrix * normal);
            vViewDir = normalize(-mvPos.xyz);
            gl_Position = projectionMatrix * mvPos;
          }
        `,
        fragmentShader: /* glsl */ `
          uniform float uBaseAlpha;
          uniform float uHalfSize;
          ${iridescentShaderCommon}
          void main() {
            vec3 iso = toIsoSpace(vLocalPos / uHalfSize * 0.42);
            vec3 spec = getSpectralColor(iso);

            float ndotv = abs(dot(normalize(vViewNormal), normalize(vViewDir)));
            float fresnel = pow(1.0 - clamp(ndotv, 0.0, 1.0), 1.65);

            // Subtle white specular sheen on upper facet + rainbow edge glow
            float topHighlight = smoothstep(0.15, 0.85, iso.y + 0.45) * 0.22;
            vec3 col = mix(spec, vec3(1.0, 0.97, 0.95), fresnel * 0.35 + topHighlight);

            float alpha = clamp(uBaseAlpha + fresnel * 0.42, 0.14, 0.82);
            gl_FragColor = vec4(col, alpha);
          }
        `
      });
    }

    const outerGlassBackMat = createOuterGlassMaterial(THREE.BackSide, 0.22);
    const outerGlassFrontMat = createOuterGlassMaterial(THREE.FrontSide, 0.18);

    const outerEdgeMat = new THREE.ShaderMaterial({
      transparent: true,
      depthWrite: false,
      uniforms: {
        uHalfSize: { value: OUTER_CUBE_SIZE * 0.5 }
      },
      vertexShader: /* glsl */ `
        varying vec3 vLocalPos;
        varying vec3 vViewNormal;
        varying vec3 vViewDir;
        void main() {
          vLocalPos = position;
          vec4 mvPos = modelViewMatrix * vec4(position, 1.0);
          vViewNormal = normalize(normalMatrix * normal);
          vViewDir = normalize(-mvPos.xyz);
          gl_Position = projectionMatrix * mvPos;
        }
      `,
      fragmentShader: /* glsl */ `
        uniform float uHalfSize;
        ${iridescentShaderCommon}
        void main() {
          vec3 iso = toIsoSpace(vLocalPos / uHalfSize * 0.42);
          vec3 spec = getSpectralColor(iso);
          vec3 col = mix(spec, vec3(1.0), 0.38);
          gl_FragColor = vec4(col * 1.15, 0.92);
        }
      `
    });

    // Inner Glowing Red-Orange Core Materials
    const innerCoreMat = new THREE.MeshPhysicalMaterial({
      color: 0xff3b18,
      emissive: 0xff3814,
      emissiveIntensity: 1.35,
      roughness: 0.18,
      metalness: 0.05,
      clearcoat: 1.0,
      clearcoatRoughness: 0.08
    });

    const innerEdgeMat = new THREE.MeshBasicMaterial({
      color: 0xffcbb8,
      transparent: true,
      opacity: 0.92
    });

    function createShaderCubeAssembly() {
      const tiltGroup = new THREE.Group();
      tiltGroup.rotation.x = isoRotX;

      const rotGroup = new THREE.Group();
      rotGroup.rotation.y = isoRotY;
      tiltGroup.add(rotGroup);

      // Soft radiant red-orange core sprite inside the glass cube
      const glowSprite = new THREE.Sprite(
        new THREE.SpriteMaterial({
          map: coreGlowTex,
          transparent: true,
          opacity: 0.78,
          blending: THREE.AdditiveBlending,
          depthWrite: false
        })
      );
      glowSprite.scale.set(0.36, 0.36, 1);
      glowSprite.renderOrder = 1;
      tiltGroup.add(glowSprite);

      // Inner glowing cube + crisp edges
      const innerMesh = new THREE.Mesh(innerBoxGeo, innerCoreMat);
      innerMesh.renderOrder = 2;
      rotGroup.add(innerMesh);

      const innerEdges = new THREE.Mesh(innerEdgeGeo, innerEdgeMat);
      innerEdges.renderOrder = 3;
      rotGroup.add(innerEdges);

      // Outer iridescent glass cube (back faces -> front faces -> spectral edges)
      const outerBack = new THREE.Mesh(outerBoxGeo, outerGlassBackMat);
      outerBack.renderOrder = 4;
      rotGroup.add(outerBack);

      const outerFront = new THREE.Mesh(outerBoxGeo, outerGlassFrontMat);
      outerFront.renderOrder = 5;
      rotGroup.add(outerFront);

      const outerEdges = new THREE.Mesh(outerEdgeGeo, outerEdgeMat);
      outerEdges.renderOrder = 6;
      rotGroup.add(outerEdges);

      return tiltGroup;
    }

    function createFaceDetailGroup() {
      const group = new THREE.Group();

      const typoMesh = new THREE.Mesh(facePlateGeo, typoMaterial);
      typoMesh.position.z = TOTAL_HALF_Z + 0.0025;
      group.add(typoMesh);

      const cubeEmblem = createShaderCubeAssembly();
      cubeEmblem.position.set(-0.79, 0.0, TOTAL_HALF_Z + 0.24);
      group.add(cubeEmblem);

      return group;
    }

    badgeRoot.add(createFaceDetailGroup());

    const backFace = createFaceDetailGroup();
    backFace.rotation.y = Math.PI;
    badgeRoot.add(backFace);

    // 5D. Outer Warm Coral-Orange Neon Halo on Pure #FFFFFF Background
    const haloMat = new THREE.MeshBasicMaterial({
      map: createHaloTexture(),
      transparent: true,
      opacity: 0.92,
      depthWrite: false,
      side: THREE.DoubleSide
    });
    const haloMesh = new THREE.Mesh(new THREE.PlaneGeometry(4.5, 2.25), haloMat);
    haloMesh.renderOrder = -2;
    badgeRoot.add(haloMesh);

    const auraMat = new THREE.SpriteMaterial({
      map: createBillboardAuraTexture(),
      transparent: true,
      opacity: 0.42,
      depthWrite: false
    });
    const auraSprite = new THREE.Sprite(auraMat);
    auraSprite.scale.set(4.3, 4.3, 1);
    auraSprite.renderOrder = -3;
    scene.add(auraSprite);

    // 6. 360° ORBIT CONTROLS, IDLE FLOAT, HOVER MICRO-TILT & DOUBLE-CLICK RESET
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.copy(INITIAL_TARGET);
    controls.enableDamping = true;
    controls.dampingFactor = 0.065;
    controls.enablePan = false;
    controls.rotateSpeed = 0.85;
    controls.zoomSpeed = 0.9;
    controls.minDistance = 2.0;
    controls.maxDistance = 8.5;
    controls.update();

    let isDragging = false;
    let isPointerInside = false;
    let pointerNX = 0;
    let pointerNY = 0;
    let isResetting = false;

    const resetStartCam = new THREE.Vector3();
    const resetStartTarget = new THREE.Vector3();
    let resetProgress = 0;

    controls.addEventListener('start', () => {
      isDragging = true;
      isResetting = false;
    });
    controls.addEventListener('end', () => {
      isDragging = false;
    });

    const domEl = renderer.domElement;
    domEl.addEventListener('pointermove', (e) => {
      isPointerInside = true;
      pointerNX = (e.clientX / window.innerWidth) * 2 - 1;
      pointerNY = (e.clientY / window.innerHeight) * 2 - 1;
    });
    domEl.addEventListener('pointerleave', () => {
      isPointerInside = false;
      pointerNX = 0;
      pointerNY = 0;
    });
    domEl.addEventListener('dblclick', () => {
      resetStartCam.copy(camera.position);
      resetStartTarget.copy(controls.target);
      resetProgress = 0;
      isResetting = true;
    });

    // 7. RESIZE & ANIMATION LOOP
    window.addEventListener('resize', () => {
      const w = window.innerWidth;
      const h = window.innerHeight;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    });

    const clock = new THREE.Clock();
    const viewDir = new THREE.Vector3();

    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), 0.05);
      const elapsed = clock.elapsedTime;

      if (isResetting) {
        resetProgress = Math.min(resetProgress + dt * 2.4, 1);
        const ease = 1 - Math.pow(1 - resetProgress, 3);
        camera.position.lerpVectors(resetStartCam, INITIAL_CAM_POS, ease);
        controls.target.lerpVectors(resetStartTarget, INITIAL_TARGET, ease);
        if (resetProgress >= 1) isResetting = false;
      }

      const idleFloatY = Math.sin(elapsed * 1.45) * 0.022;
      const idleRotX = Math.sin(elapsed * 0.95) * 0.012;
      const idleRotY = Math.cos(elapsed * 0.75) * 0.015;

      const targetTiltY = (!isDragging && isPointerInside) ? pointerNX * 0.085 : 0;
      const targetTiltX = (!isDragging && isPointerInside) ? pointerNY * 0.065 : 0;

      badgeRoot.position.y = THREE.MathUtils.lerp(badgeRoot.position.y, idleFloatY, 0.08);
      badgeRoot.rotation.x = THREE.MathUtils.lerp(badgeRoot.rotation.x, targetTiltX + idleRotX, 0.07);
      badgeRoot.rotation.y = THREE.MathUtils.lerp(badgeRoot.rotation.y, targetTiltY + idleRotY, 0.07);

      auraSprite.position.y = badgeRoot.position.y;
      viewDir.subVectors(camera.position, controls.target).normalize();
      const edgeFactor = 1.0 - Math.abs(viewDir.z);
      haloMat.opacity = 0.92 * (1.0 - edgeFactor * 0.65);
      auraMat.opacity = 0.34 + edgeFactor * 0.26;

      controls.update();
      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>

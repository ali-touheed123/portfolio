  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      background: radial-gradient(circle at center, #141929 0%, #06070c 100%);
      color: #fff;
      font-family: system-ui, -apple-system, sans-serif;
      overflow-x: hidden;
    }

    canvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      display: block;
      z-index: 1;
    }

    #scroll-track {
      height: 360vh;
      width: 100%;
      pointer-events: none;
    }

    /* One-time Default Baker Screen (only shows if no default images are embedded yet) */
    #setup-screen {
      position: fixed;
      inset: 0;
      z-index: 30;
      display: none;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, #141929 0%, #06070c 100%);
    }
    .setup-box {
      width: 330px;
      padding: 24px;
      border-radius: 14px;
      background: rgba(15, 18, 28, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.14);
      display: flex;
      flex-direction: column;
      gap: 12px;
      text-align: center;
    }
    .setup-box h3 { font-size: 16px; font-weight: 600; color: #f1f5f9; }
    .setup-box p { font-size: 12px; color: #94a3b8; line-height: 1.45; }

    label.pick-btn, button.action-btn {
      display: block;
      width: 100%;
      padding: 11px 14px;
      border-radius: 9px;
      border: none;
      background: #4f46e5;
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.15s;
    }
    label.pick-btn:hover, button.action-btn:hover { background: #6366f1; }
    label.pick-btn.done { background: #10b981; }
    button.action-btn:disabled { background: #262e45; color: #64748b; cursor: not-allowed; }
    input[type="file"] { display: none; }

    /* Minimal "Wanna try?" Floating Pill */
    #try-trigger {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 15;
      display: none;
      padding: 9px 16px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      background: rgba(15, 18, 28, 0.72);
      backdrop-filter: blur(10px);
      color: #e2e8f0;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s, transform 0.15s;
    }
    #try-trigger:hover {
      background: rgba(79, 70, 229, 0.85);
      border-color: rgba(255, 255, 255, 0.35);
      transform: translateY(-1px);
    }

    /* Compact "Wanna try?" Upload Popover */
    #try-modal {
      position: fixed;
      bottom: 66px;
      right: 20px;
      z-index: 20;
      width: 260px;
      padding: 16px;
      border-radius: 12px;
      background: rgba(15, 18, 28, 0.9);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.16);
      display: none;
      flex-direction: column;
      gap: 10px;
    }
    #try-modal.open { display: flex; }
    .try-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      font-weight: 600;
      color: #f1f5f9;
    }
    .try-close {
      background: none;
      border: none;
      color: #94a3b8;
      font-size: 18px;
      line-height: 1;
      cursor: pointer;
    }
    .try-close:hover { color: #fff; }
    .try-note { font-size: 11px; color: #94a3b8; line-height: 1.35; }
    button.reset-btn {
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: rgba(255, 255, 255, 0.06);
      color: #cbd5e1;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    button.reset-btn:hover { background: rgba(255, 255, 255, 0.14); color: #fff; }

    #scroll-hint {
      position: fixed;
      bottom: 22px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.45);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.6s ease;
    }
    #scroll-hint.visible { opacity: 1; }
  </style>
</head>
<body>

  <!-- Shown ONLY once if default images aren't baked in yet -->
  <div id="setup-screen">
    <div class="setup-box">
      <h3>One-Time Setup: Default Images</h3>
      <p>Select your 2 default images once, then download the permanent HTML file.</p>
      <label class="pick-btn" id="defLabel1">
        1. Choose Default Galaxy Image
        <input type="file" id="defInput1" accept="image/*">
      </label>
      <label class="pick-btn" id="defLabel2">
        2. Choose Default Character Image
        <input type="file" id="defInput2" accept="image/*">
      </label>
      <button class="action-btn" id="bakeBtn" disabled="">Download Permanent HTML</button>
    </div>
  </div>

  <!-- Minimal "Wanna try?" feature -->
  <button id="try-trigger">Wanna try?</button>
  <div id="try-modal">
    <div class="try-header">
      <span>Try Your Own 2 Images</span>
      <button class="try-close" id="tryClose">×</button>
    </div>
    <p class="try-note">Upload any 2 images to test the morph. Refreshing the page resets back to default.</p>
    <label class="pick-btn" id="tryLabel1">
      1. Upload First Image
      <input type="file" id="tryInput1" accept="image/*">
    </label>
    <label class="pick-btn" id="tryLabel2">
      2. Upload Second Image
      <input type="file" id="tryInput2" accept="image/*">
    </label>
    <button class="reset-btn" id="resetDefaultBtn">Reset to Default</button>
  </div>

  <div id="scroll-hint">Scroll down to transform</div>
  <div id="scroll-track"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    // Locked Settings
    const PARTICLE_SIZE = 4.3;
    const DEPTH_3D = 50;
    const REMOVE_WHITE_BG = true;
    const MAX_PARTICLES = 26000;

    let PRISTINE_HTML = '';
    let scene, camera, renderer;
    let pointsMesh = null;
    let count = 0;
    let pos1, pos2, col1, col2, scatterVec, delays, hoverOff;

    let defaultImg1Obj = null;
    let defaultImg2Obj = null;

    let targetScroll = 0;
    let smoothScroll = 0;
    let mouseActive = false;
    let mouseWorldX = 0;
    let mouseWorldY = 0;

    // Helper: Compress/resize image to clean PNG DataURL for baking
    function imageToCompactDataURL(file, callback) {
      const reader = new FileReader();
      reader.onload = (ev) => {
        const img = new Image();
        img.onload = () => {
          const maxSide = 480;
          const scale = Math.min(1, maxSide / Math.max(img.width, img.height));
          const c = document.createElement('canvas');
          c.width = Math.round(img.width * scale);
          c.height = Math.round(img.height * scale);
          const ctx = c.getContext('2d');
          ctx.drawImage(img, 0, 0, c.width, c.height);
          callback(c.toDataURL('image/png'), img);
        };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    }

    function loadImageFromSrc(src) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.onerror = reject;
        img.src = src;
      });
    }

    function createCircleTexture() {
      const c = document.createElement('canvas');
      c.width = c.height = 64;
      const ctx = c.getContext('2d');
      const grad = ctx.createRadialGradient(32, 32, 2, 32, 32, 30);
      grad.addColorStop(0, 'rgba(255,255,255,1)');
      grad.addColorStop(0.5, 'rgba(255,255,255,0.85)');
      grad.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 64, 64);
      return new THREE.CanvasTexture(c);
    }

    function sampleImagePoints(img, maxDim) {
      const scale = Math.min(maxDim / img.width, maxDim / img.height);
      const w = Math.floor(img.width * scale);
      const h = Math.floor(img.height * scale);

      const canvas = document.createElement('canvas');
      canvas.width = w;
      canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, w, h);

      const data = ctx.getImageData(0, 0, w, h).data;
      const pts = [];

      for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
          const i = (y * w + x) * 4;
          const r = data[i], g = data[i + 1], b = data[i + 2], a = data[i + 3];

          if (a < 40) continue;
          if (REMOVE_WHITE_BG && r > 235 && g > 235 && b > 235) continue;

          const px = x - w / 2;
          const py = -(y - h / 2);

          const lum = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
          const distFromCenter = Math.hypot(px / (w / 2), py / (h / 2));
          const zFactor = Math.max(0, 1 - distFromCenter * 0.6) * 0.6 + lum * 0.4 + (Math.random() - 0.5) * 0.25;
          const pz = zFactor * DEPTH_3D - DEPTH_3D * 0.4;

          pts.push({
            x: px,
            y: py,
            z: pz,
            r: Math.max(0.08, r / 255),
            g: Math.max(0.08, g / 255),
            b: Math.max(0.10, b / 255)
          });
        }
      }
      return pts;
    }

    function shuffleArray(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
    }

    let particleTexture;

    function buildDualParticleSystem(img1, img2) {
      if (pointsMesh) {
        scene.remove(pointsMesh);
        pointsMesh.geometry.dispose();
        pointsMesh.material.dispose();
        pointsMesh = null;
      }

      let gPts = sampleImagePoints(img1, 215);
      let cPts = sampleImagePoints(img2, 210);

      shuffleArray(gPts);
      shuffleArray(cPts);

      count = Math.min(MAX_PARTICLES, Math.max(gPts.length, cPts.length));

      pos1 = new Float32Array(count * 3);
      pos2 = new Float32Array(count * 3);
      col1 = new Float32Array(count * 3);
      col2 = new Float32Array(count * 3);
      scatterVec = new Float32Array(count * 3);
      delays = new Float32Array(count);
      hoverOff = new Float32Array(count * 3);

      const positions = new Float32Array(count * 3);
      const colors = new Float32Array(count * 3);

      for (let i = 0; i < count; i++) {
        const gp = gPts[i % gPts.length];
        const cp = cPts[i % cPts.length];
        const i3 = i * 3;

        const jitter1 = i >= gPts.length ? (Math.random() - 0.5) * 0.8 : 0;
        const jitter2 = i >= cPts.length ? (Math.random() - 0.5) * 0.8 : 0;

        pos1[i3]     = gp.x + jitter1;
        pos1[i3 + 1] = gp.y + jitter1;
        pos1[i3 + 2] = gp.z;

        pos2[i3]     = cp.x + jitter2;
        pos2[i3 + 1] = cp.y + jitter2;
        pos2[i3 + 2] = cp.z;

        col1[i3]     = gp.r;
        col1[i3 + 1] = gp.g;
        col1[i3 + 2] = gp.b;

        col2[i3]     = cp.r;
        col2[i3 + 1] = cp.g;
        col2[i3 + 2] = cp.b;

        positions[i3]     = pos1[i3];
        positions[i3 + 1] = pos1[i3 + 1];
        positions[i3 + 2] = pos1[i3 + 2];

        colors[i3]     = col1[i3];
        colors[i3 + 1] = col1[i3 + 1];
        colors[i3 + 2] = col1[i3 + 2];

        const rad = 55 + Math.random() * 145;
        const theta = Math.random() * Math.PI * 2;
        const phi = Math.acos(2 * Math.random() - 1);
        scatterVec[i3]     = rad * Math.sin(phi) * Math.cos(theta);
        scatterVec[i3 + 1] = rad * Math.sin(phi) * Math.sin(theta);
        scatterVec[i3 + 2] = rad * Math.cos(phi);

        delays[i] = Math.random() * 0.25;
      }

      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

      const material = new THREE.PointsMaterial({
        size: PARTICLE_SIZE,
        map: particleTexture,
        vertexColors: true,
        transparent: true,
        depthWrite: false,
        blending: THREE.NormalBlending
      });

      pointsMesh = new THREE.Points(geometry, material);
      scene.add(pointsMesh);

      window.scrollTo({ top: 0 });
      targetScroll = 0;
      smoothScroll = 0;
    }

    function startExperience(img1, img2) {
      defaultImg1Obj = img1;
      defaultImg2Obj = img2;
      document.getElementById('setup-screen').style.display = 'none';
      document.getElementById('try-trigger').style.display = 'block';
      buildDualParticleSystem(img1, img2);

      const hint = document.getElementById('scroll-hint');
      hint.classList.add('visible');
      setTimeout(() => hint.classList.remove('visible'), 4000);
    }

    async function tryAutoDetectServerImages() {
      if (window.location.protocol === 'file:') return false;
      const candidates1 = ['./galaxy.png', './galaxy.jpg', './galaxy.webp'];
      const candidates2 = ['./character.png', './character.jpg', './character.webp'];

      let img1 = null, img2 = null;
      for (const src of candidates1) {
        try { img1 = await loadImageFromSrc(src); break; } catch (_) {}
      }
      for (const src of candidates2) {
        try { img2 = await loadImageFromSrc(src); break; } catch (_) {}
      }
      if (img1 && img2) {
        startExperience(img1, img2);
        return true;
      }
      return false;
    }

    window.addEventListener('DOMContentLoaded', async () => {
      // Capture clean HTML before adding canvas or mutating DOM
      PRISTINE_HTML = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;

      // Setup Three.js
      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 2000);
      camera.position.set(0, 0, 260);

      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      document.body.appendChild(renderer.domElement);

      particleTexture = createCircleTexture();

      // Check embedded default images
      const embedded = JSON.parse(document.getElementById('default-images').textContent || '{}');
      if (embedded.img1 && embedded.img2) {
        const [i1, i2] = await Promise.all([
          loadImageFromSrc(embedded.img1),
          loadImageFromSrc(embedded.img2)
        ]);
        startExperience(i1, i2);
      } else {
        const autoLoaded = await tryAutoDetectServerImages();
        if (!autoLoaded) {
          document.getElementById('setup-screen').style.display = 'flex';
        }
      }

      // One-Time Setup Baker Listeners
      let bakeData1 = '', bakeData2 = '';
      document.getElementById('defInput1').addEventListener('change', (e) => {
        const f = e.target.files[0];
        if (!f) return;
        imageToCompactDataURL(f, (dataUrl) => {
          bakeData1 = dataUrl;
          const lbl = document.getElementById('defLabel1');
          lbl.textContent = '1. Galaxy Ready ✓';
          lbl.classList.add('done');
          if (bakeData1 && bakeData2) document.getElementById('bakeBtn').disabled = false;
        });
      });

      document.getElementById('defInput2').addEventListener('change', (e) => {
        const f = e.target.files[0];
        if (!f) return;
        imageToCompactDataURL(f, (dataUrl) => {
          bakeData2 = dataUrl;
          const lbl = document.getElementById('defLabel2');
          lbl.textContent = '2. Character Ready ✓';
          lbl.classList.add('done');
          if (bakeData1 && bakeData2) document.getElementById('bakeBtn').disabled = false;
        });
      });

      document.getElementById('bakeBtn').addEventListener('click', () => {
        const payload = JSON.stringify({ img1: bakeData1, img2: bakeData2 });
        const finalHtml = PRISTINE_HTML.replace(
          /<script type="application\/json" id="default-images">[\s\S]*?<\/script>/,
          () => `<script type="application/json" id="default-images">${payload}<\/script>`
        );
        const blob = new Blob([finalHtml], { type: 'text/html' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'index.html';
        a.click();
        URL.revokeObjectURL(url);
      });

      // "Wanna try?" Feature Listeners
      const tryTrigger = document.getElementById('try-trigger');
      const tryModal = document.getElementById('try-modal');
      let tryImg1 = null, tryImg2 = null;

      tryTrigger.addEventListener('click', () => {
        tryModal.classList.toggle('open');
      });
      document.getElementById('tryClose').addEventListener('click', () => {
        tryModal.classList.remove('open');
      });

      document.getElementById('tryInput1').addEventListener('change', (e) => {
        const f = e.target.files[0];
        if (!f) return;
        imageToCompactDataURL(f, (_, img) => {
          tryImg1 = img;
          const lbl = document.getElementById('tryLabel1');
          lbl.textContent = '1. First Image ✓';
          lbl.classList.add('done');
          if (tryImg1 && tryImg2) {
            buildDualParticleSystem(tryImg1, tryImg2);
            tryModal.classList.remove('open');
          }
        });
      });

      document.getElementById('tryInput2').addEventListener('change', (e) => {
        const f = e.target.files[0];
        if (!f) return;
        imageToCompactDataURL(f, (_, img) => {
          tryImg2 = img;
          const lbl = document.getElementById('tryLabel2');
          lbl.textContent = '2. Second Image ✓';
          lbl.classList.add('done');
          if (tryImg1 && tryImg2) {
            buildDualParticleSystem(tryImg1, tryImg2);
            tryModal.classList.remove('open');
          }
        });
      });

      document.getElementById('resetDefaultBtn').addEventListener('click', () => {
        if (defaultImg1Obj && defaultImg2Obj) {
          tryImg1 = null;
          tryImg2 = null;
          const l1 = document.getElementById('tryLabel1');
          const l2 = document.getElementById('tryLabel2');
          l1.childNodes[0].nodeValue = '1. Upload First Image ';
          l2.childNodes[0].nodeValue = '2. Upload Second Image ';
          l1.classList.remove('done');
          l2.classList.remove('done');
          buildDualParticleSystem(defaultImg1Obj, defaultImg2Obj);
          tryModal.classList.remove('open');
        }
      });

      // Scroll Tracking
      window.addEventListener('scroll', () => {
        const maxScroll = document.documentElement.scrollHeight - window.innerHeight;
        if (maxScroll > 0) {
          targetScroll = Math.max(0, Math.min(1, window.scrollY / maxScroll));
        }
        document.getElementById('scroll-hint').classList.remove('visible');
      }, { passive: true });

      // Magnetic Hover Tracking (NO drag rotation)
      const tempVec = new THREE.Vector3();
      window.addEventListener('pointermove', (e) => {
        mouseActive = true;
        tempVec.set(
          (e.clientX / window.innerWidth) * 2 - 1,
          -(e.clientY / window.innerHeight) * 2 + 1,
          0.5
        );
        tempVec.unproject(camera);
        tempVec.sub(camera.position).normalize();
        const dist = -camera.position.z / tempVec.z;
        const worldPos = camera.position.clone().add(tempVec.multiplyScalar(dist));
        mouseWorldX = worldPos.x;
        mouseWorldY = worldPos.y;
      });

      window.addEventListener('pointerleave', () => {
        mouseActive = false;
      });

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });

      // Render Loop
      const clock = new THREE.Clock();
      const MAGNET_RADIUS = 44;
      const MAGNET_PULL = 0.42;

      function smoothstep(t) {
        return t * t * (3 - 2 * t);
      }

      function animate() {
        requestAnimationFrame(animate);
        const time = clock.getElapsedTime();

        smoothScroll += (targetScroll - smoothScroll) * 0.08;

        if (pointsMesh) {
          const posAttr = pointsMesh.geometry.attributes.position;
          const colAttr = pointsMesh.geometry.attributes.color;
          const pos = posAttr.array;
          const col = colAttr.array;

          for (let i = 0; i < count; i++) {
            const i3 = i * 3;
            const d = delays[i];
            const rawT = Math.max(0, Math.min(1, (smoothScroll - d * 0.5) / (1 - 0.25 * 0.5)));
            const t = smoothstep(rawT);

            const scatterAmt = Math.sin(rawT * Math.PI);
            const swirlAngle = scatterAmt * 1.4;
            const sx = scatterVec[i3];
            const sy = scatterVec[i3 + 1];
            const swirlX = sx * Math.cos(swirlAngle) - sy * Math.sin(swirlAngle);
            const swirlY = sx * Math.sin(swirlAngle) + sy * Math.cos(swirlAngle);

            const baseX = pos1[i3]     + (pos2[i3]     - pos1[i3])     * t + swirlX * scatterAmt;
            const baseY = pos1[i3 + 1] + (pos2[i3 + 1] - pos1[i3 + 1]) * t + swirlY * scatterAmt;
            const baseZ = pos1[i3 + 2] + (pos2[i3 + 2] - pos1[i3 + 2]) * t + scatterVec[i3 + 2] * scatterAmt;

            const floatX = Math.sin(time * 1.2 + i * 0.01) * 0.35;
            const floatY = Math.cos(time * 1.1 + i * 0.013) * 0.35;

            let targetHoverX = 0, targetHoverY = 0, targetHoverZ = 0;
            if (mouseActive) {
              const dx = mouseWorldX - baseX;
              const dy = mouseWorldY - baseY;
              const dist = Math.hypot(dx, dy);

              if (dist < MAGNET_RADIUS) {
                const force = 1 - dist / MAGNET_RADIUS;
                const smoothForce = force * force;
                targetHoverX = dx * MAGNET_PULL * smoothForce;
                targetHoverY = dy * MAGNET_PULL * smoothForce;
                targetHoverZ = 18 * smoothForce;
              }
            }

            hoverOff[i3]     += (targetHoverX - hoverOff[i3])     * 0.14;
            hoverOff[i3 + 1] += (targetHoverY - hoverOff[i3 + 1]) * 0.14;
            hoverOff[i3 + 2] += (targetHoverZ - hoverOff[i3 + 2]) * 0.14;

            pos[i3]     = baseX + floatX + hoverOff[i3];
            pos[i3 + 1] = baseY + floatY + hoverOff[i3 + 1];
            pos[i3 + 2] = baseZ + hoverOff[i3 + 2];

            col[i3]     = col1[i3]     + (col2[i3]     - col1[i3])     * t;
            col[i3 + 1] = col1[i3 + 1] + (col2[i3 + 1] - col1[i3 + 1]) * t;
            col[i3 + 2] = col1[i3 + 2] + (col2[i3 + 2] - col1[i3 + 2]) * t;
          }

          posAttr.needsUpdate = true;
          colAttr.needsUpdate = true;
        }

        renderer.render(scene, camera);
      }

      animate();
    });
  </script>

</body></html>
